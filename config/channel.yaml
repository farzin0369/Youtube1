channel:
  brand: "BAMO"
  display_name: "BAMO"
  secondary_brand: "#12bamo"
  url: "https://www.youtube.com/@12bamo"
  language: fa-IR
  timezone: Asia/Tehran
  audience: مخاطب فارسی‌زبان علاقه‌مند به معنویت، علم، فلسفه، تاریخ، هنر، ورزش، کشف‌های شگفت‌انگیز و رشد فردی
  objective: تولید محتوای اصیل و متنوع فارسی با روایت سینمایی، موشن‌گرافیک حرفه‌ای و پیام روشن؛ از دین و اخلاق تا علم و تاریخ و سرگرمی
  narrator: مرد
  tts_voice: fa-IR-FaridNeural
  tts_model: edge-tts
  visual_style: ویدئوی عمودی ۹:۱۶ با هوک فوری، موشن‌گرافیک چندلایه، عمق سه‌بعدی، حرکت دوربین، تصاویر سینمایی مرتبط با روایت، زیرنویس فارسی راست‌به‌چپ
  ai_engine: eleven-agent-editorial-hyperframes-cpu
  llm_model: optional-free-provider
  local_llm_model: qwen2.5:7b

schedule:
  timezone: Asia/Tehran
  publication_times_local:
    - "07:00"
    - "10:00"
    - "12:00"
    - "15:00"
    - "18:00"
    - "21:00"
  publication_timezone: Asia/Tehran
  publication_crons_utc:
    - "30 3 * * *"
    - "30 6 * * *"
    - "30 8 * * *"
    - "30 11 * * *"
    - "30 14 * * *"
    - "30 17 * * *"
  cadence: six-times-daily

publishing:
  mode: public
  public_publish_enabled: true
  category_id: "22"
  default_language: fa
  minimum_schedule_lead_minutes: 30
  require_successful_render: true
  require_human_approval: false
  comments_max_replies_per_run: 3

content:
  production_format: shorts
  target_duration_seconds: "18-30"
  target_word_count: "28-44"
  pillars:
    - معنویت، اخلاق، قرآن و حدیث با منبع معتبر
    - علم، فیزیک، ریاضیات و کشف‌های شگفت‌انگیز
    - فلسفه، روان‌شناسی و پرسش‌های ذهن
    - تاریخ، تمدن‌ها و زندگی شخصیت‌های اثرگذار
    - هنر، موسیقی، معماری و نمادشناسی
    - ورزش، سرگرمی و رویدادهای روز با راستی‌آزمایی
    - رشد فردی، سواد مالی عمومی و مهارت‌های زندگی
  forbidden:
    - ادعای ساختگی یا نقل‌قول بدون منبع
    - وعده قطعی پولدارشدن، موفقیت یا درمان
    - توصیه مالی، سرمایه‌گذاری یا پزشکی شخصی
    - کلیک‌بیت گمراه‌کننده، ترساندن یا شرمنده‌کردن
    - تقلید از سبک اختصاصی کانال‌ها یا نویسندگان دیگر
  source_policy: ادعاهای علمی، تاریخی و دینی باید با منبع معتبر بررسی شوند؛ عدم اختلاق آمار یا نقل‌قول
  comment_policy: پاسخ کوتاه فقط به نظرهای روشن و بی‌خطر؛ موارد حساس یا نامطمئن بدون پاسخ خودکار
