channel:
  brand: "BAMO"
  display_name: "BAMO"
  secondary_brand: "#BAMOShorts"
  url: "https://www.youtube.com/@12bamo"
  language: en-US
  timezone: America/New_York
  audience: English-speaking audience interested in science, physics, mathematics, AI, history, psychology, surprising facts and high-quality educational Shorts
  objective: Produce original, accurate, visually strong English YouTube Shorts (20-30s) with strong hooks, clear value, and professional motion graphics
  narrator: male
  tts_voice: en-US-GuyNeural          # temporary; will be evaluated against Piper and others
  tts_model: edge-tts
  visual_style: vertical 9:16, strong opening hook, topic-matched motion, clean English captions, high visual density every 5 seconds
  ai_engine: BAMO-Content-Intelligence + OpenMontage
  llm_model: openai/gpt-oss-20b
  local_llm_model: qwen2.5:7b

schedule:
  timezone: America/New_York
  publication_times_local: ["12:00"]   # single daily slot for now; will be optimized with real Analytics later
  publication_timezone: America/New_York
  publication_crons_utc: ["0 17 * * *"]  # 12:00 ET ≈ 17:00 UTC (adjust for DST later)
  cadence: daily

publishing:
  mode: private                        # start private / unlisted until quality is proven
  public_publish_enabled: false
  require_human_approval: true
  category_id: "27"                    # Education
  default_language: en
  minimum_schedule_lead_minutes: 30
  require_successful_render: true
  comments_max_replies_per_run: 0

content:
  production_format: shorts
  target_duration_seconds: "20-30"
  target_word_count: "45-75"
  pillars:
    - Science & discoveries
    - Physics & astrophysics
    - Mathematics & geometry
    - Chemistry & biology
    - Medicine & public health (no medical advice)
    - Artificial intelligence & future tech
    - Psychology & cognitive science
    - Philosophy & critical thinking
    - History & ancient civilizations
    - Art, music & architecture
    - Sports & world records
    - Nature & animals
    - Space & cosmic mysteries
    - Inventions & discoveries
    - Paradoxes & mind-bending facts
    - Surprising true stories
  forbidden:
    - Fake statistics or unverified claims
    - Medical, financial or legal advice
    - Religious proselytizing or fabricated quotes
    - Clickbait that does not deliver value
    - Any content that was part of the previous Persian spiritual brand
  source_policy: Every factual claim must be backed by a reputable source. No invented numbers or stories.
  comment_policy: No automatic replies in the experimental phase
