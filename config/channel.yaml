channel:
  brand: "BAMO"
  display_name: "BAMO"
  secondary_brand: "#BAMOShorts"
  url: "https://www.youtube.com/@12bamo"
  language: en-US
  timezone: America/New_York
  audience: English-speaking YouTube viewers interested in science, physics, math, history, psychology, space, philosophy, art, and surprising true facts
  objective: One high-quality English Short per day from the idea bank, rendered with HyperFrames official templates, published publicly with strong SEO
  narrator: male
  tts_voice: en-US-GuyNeural
  tts_model: edge-tts
  visual_style: vertical 9:16, official HyperFrames kinetic-type motion, high visual density
  ai_engine: BAMO-Content-Intelligence + HyperFrames 0.9.19

schedule:
  timezone: America/New_York
  publication_times_local: ["12:00"]
  publication_timezone: America/New_York
  publication_crons_utc: ["0 17 * * *"]
  cadence: daily

publishing:
  mode: public
  public_publish_enabled: true
  require_human_approval: false
  category_id: "27"
  default_language: en
  default_audio_language: en
  minimum_schedule_lead_minutes: 30
  require_successful_render: true
  comments_max_replies_per_run: 5
  made_for_kids: false

content:
  production_format: shorts
  target_duration_seconds: "20-30"
  target_word_count: "45-75"
  pillars:
    - Science & discoveries
    - Physics & astrophysics
    - Mathematics & geometry
    - Chemistry & biology
    - Medicine & public health (no medical advice)
    - Artificial intelligence & future tech
    - Psychology & cognitive science
    - Philosophy & metaphysics
    - History & ancient civilizations
    - Art, music & architecture
    - Sports & world records
    - Nature & animals
    - Space & astronomy
    - Inventions & discoveries
    - Paradoxes & mind-bending facts
    - Success & human performance
    - Religion as cultural history (no proselytizing)
    - Humor & surprising ironies
  forbidden:
    - Fake statistics or unverified claims
    - Medical, financial or legal advice
    - Religious proselytizing or fabricated quotes
    - Clickbait that does not deliver value
    - Any Persian spiritual / ImamAli brand content
  source_policy: Every factual claim must be backed by a reputable source.
  comment_policy: Reply briefly in English to clear, non-crisis comments. Skip medical/legal/financial advice, hate, self-harm, or spam.
