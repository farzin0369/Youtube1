  secondary_brand: "#The110Path"
  url: "https://www.youtube.com/@imamali.110"
  language: fa-IR
  timezone: Asia/Tehran
  audience: مخاطب فارسی‌زبان علاقه‌مند به ارتباط معنوی با خدا، حکمت، رشد فردی و عادت‌های سالم مالی
  objective: ویدئوهای اصیل دربارهٔ معنویت روزمره، توکل، امید، رشد مالی مسئولانه، عادت‌های سالم و رشد عملی
  narrator: مرد
  tts_voice: fa-IR-FaridNeural
  tts_model: edge-tts
  visual_style: انیمیشن سینمایی سه‌بعدی تولیدشده با LTX-Video؛ Shorts عمودی ۹:۱۶ با چهار صحنهٔ متناسب با روایت و زیرنویس فارسی خوانا؛ ویدئوی بلند افقی ۱۶:۹
  ai_engine: local-ollama-only
  llm_model: openai/gpt-oss-20b
  local_llm_model: qwen2.5:7b

schedule:
  timezone: UTC
  long_form_utc: "0 14 * * *"
  shorts_utc: "0 17 * * *"
  cadence: daily-long-and-shorts
  activation_note: "Requires an always-available CUDA GPU runner; free Colab sessions cannot be reliably scheduled from GitHub Actions."

publishing:
  mode: private
  category_id: "22"
  default_language: fa
  minimum_schedule_lead_minutes: 30
  public_publish_enabled: false
  require_successful_render: true
  comments_max_replies_per_run: 3

content:
  production_format: shorts
  target_duration_seconds: "18-30"
  target_word_count: "28-44"
  pillars:
    - معنویت روزمره و تأمل دربارهٔ معنا
    - توکل، امید و تاب‌آوری بدون وعدهٔ قطعی
    - نیت و امید و تأمل نقادانه دربارهٔ مفهوم جذب، بدون انتساب حکم قطعی به اسلام
    - عادت‌های کوچک و رشد فردی
    - مدیریت زمان، نظم و تمرکز
    - سواد مالی عمومی و عادت‌های سالم مالی
  forbidden:
    - وعدهٔ قطعی پولدارشدن، موفقیت یا درمان
    - توصیهٔ مالی، سرمایه‌گذاری یا پزشکی شخصی
    - نقل‌قول، آیه یا حدیث ساختگی یا بدون منبع معتبر
    - کلیک‌بیت، ترساندن، شرمنده‌کردن یا لحن سرزنش‌گر
    - تقلید از سبک اختصاصی کانال‌ها یا نویسندگان دیگر
    - پاسخ خودکار به بحران، خودآسیبی، تهدید، نفرت یا درخواست فتوا
  source_policy: محتوای تأملی و آموزشی عمومی؛ ادعای دینیِ قابل‌راستی‌آزمایی فقط با منبع معتبر؛ عدم اختلاق نقل‌قول
  comment_policy: پاسخ کوتاه فقط به نظرهای روشن و بی‌خطر؛ مورد حساس یا نامطمئن بدون پاسخ خودکار
