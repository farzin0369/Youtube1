channel:
  brand: "TT خبر"
  display_name: "TT خبر"
  url: "https://www.youtube.com/@imamali.110"
  language: fa-IR
  timezone: Asia/Tehran
  audience: مخاطب عمومی فارسی‌زبان
  objective: ارائه خبرهای دقیق، سریع، متوازن و قابل‌فهم درباره ایران و رویدادهای جهانی مرتبط با ایران به زبان فارسی
  narrator: مرد
  tts_voice: fa-IR-FaridNeural
  tts_model: edge
  visual_style: مستند خبری سینمایی؛ تصاویر متحرک مرتبط با خبر؛ بدون اسلایدشو خشک؛ بدون جعل تصویر واقعی رویداد
  ai_engine: local
  llm_model: llama3.2:3b
  logo: generate-once-and-cache

schedule:
  news_cycle_hours: 1
  short: "manual"
  long: "0 * * * *"
  short_duration_seconds: 45
  long_duration_minutes: "3-5"

publishing:
  mode: public
  public_publish_enabled: true
  category: "News & Politics"
  default_language: fa
  require_review_for_sensitive_comments: true
  require_sources_in_description: true
  disclose_synthetic_media_when_required: true

content:
  pillars:
    - سیاست و روابط بین‌الملل
    - فناوری و هوش مصنوعی
    - اقتصاد و کسب‌وکار
    - جهان و بحران‌های انسانی
    - علم و فضا
    - ورزش
    - سرگرمی و فرهنگ
    - سلامت عمومی بر پایه منابع معتبر
  forbidden:
    - خبر بدون منبع قابل بررسی
    - ادعای تأییدنشده به‌عنوان واقعیت
    - عنوان گمراه‌کننده یا اغراق‌آمیز
    - نقل قول ساختگی
    - محتوای نفرت‌پراکن یا آزار هدفمند
    - توصیه پزشکی شخصی یا ادعای درمان قطعی
    - تصاویر ساختگی که به‌عنوان تصویر واقعی رویداد معرفی شوند
  source_policy: استفاده از خبرهای دارای لینک و زمان انتشار؛ تفکیک واقعیت، ادعا و تحلیل؛ ذکر منابع در توضیحات ویدئو
  target_stories_per_video: 3-5
  approved_source_books: []
