<!doctype html>
<html data-aspect="9:16">
<head>
<meta charset="utf-8">
<meta name="duration" content="20">
<meta name="aspect" content="9:16">
<meta name="message" content="BAMO | سفر به سیاه‌چاله">
<script type="importmap">{"imports":{"three":"/assets/vendor/three.module.min.js"}}</script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a;color:#fff;font-family:system-ui,sans-serif}
#scene{position:absolute;inset:0;width:100%;height:100%}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 46%,transparent 25%,rgba(1,2,10,.18) 55%,#02030a 100%);pointer-events:none}
.top{position:absolute;top:7%;left:8%;right:8%;display:flex;justify-content:space-between;align-items:center;color:#9eb8d9;font-size:2.2vh;letter-spacing:.12em}
.brand{font-weight:800;color:#fff;letter-spacing:.35em}
.copy{position:absolute;left:8%;right:8%;top:62%;bottom:8%;text-align:center;min-height:0;height:30%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.kicker{font-size:2.1vh;letter-spacing:.08em;color:#70dcff;font-weight:800;margin-bottom:2vh;text-shadow:0 0 18px #1ba9ff}
h1{font-size:6.2vh;line-height:1.08;margin:0;font-weight:900;letter-spacing:-.04em;text-shadow:0 0 35px rgba(64,169,255,.45);max-width:100%}
.sub{font-size:2.5vh;line-height:1.3;color:#d6e5f7;margin-top:2vh;letter-spacing:0;max-width:95%}
.rule{height:2px;width:26%;margin:3vh auto;background:linear-gradient(90deg,transparent,#52dfff,transparent);box-shadow:0 0 18px #26bfff}
.caption{font-size:1.8vh;color:#8fa8c5;letter-spacing:.08em;margin-top:1.8vh}
.fade{opacity:0;transform:translateY(24px)}
.progress{position:absolute;left:8%;right:8%;bottom:6%;height:4px;background:#25334a;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#55dfff;box-shadow:0 0 12px #55dfff}
</style></head>
<body>
<canvas id="scene"></canvas><div class="vignette"></div>
<div class="top"><span class="brand">B A M O</span><span>رازهای کیهان</span></div>
<div class="copy">
<div class="kicker" id="kicker">یک سؤال عجیب...</div>
<h1 id="title">اگر نزدیکش شوی؟</h1>
<div class="rule" id="rule"></div>
<div class="sub" id="sub">در ۲۰ ثانیه، راز سیاه‌چاله را بفهم</div>
<div class="caption" id="caption">BAMO • علم در یک دقیقه</div>
</div>
<div class="progress"><i id="progress"></i></div>
<script type="module">
import * as THREE from 'three';
import '/core/engine/page-api.js';
const canvas=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(1);renderer.setSize(window.vawe?.width||1080,window.vawe?.height||1920,false);renderer.setClearColor(0x02030a,1);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x02030a,.035);
const W=window.vawe?.width||1080,H=window.vawe?.height||1920;const camera=new THREE.PerspectiveCamera(37,W/H,.1,120);camera.position.set(0,2.6,15);
scene.add(new THREE.AmbientLight(0x243a68,1.25));
const key=new THREE.PointLight(0x42aaff,95,40);key.position.set(-5,5,7);scene.add(key);
const warm=new THREE.PointLight(0xff6b25,65,35);warm.position.set(4,-2,3);scene.add(warm);
const core=new THREE.Mesh(new THREE.SphereGeometry(1.42,96,64),new THREE.MeshBasicMaterial({color:0x010106}));core.position.set(0,2.55,0);scene.add(core);
function ring(radius,tube,color,opacity,rotation){const m=new THREE.Mesh(new THREE.TorusGeometry(radius,tube,12,220),new THREE.MeshBasicMaterial({color,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false}));m.rotation.set(rotation[0],rotation[1],rotation[2]);m.position.y=2.55;scene.add(m);return m}
const r1=ring(2.15,.18,0xff8b38,.88,[1.18,.08,.12]);
const r2=ring(2.55,.075,0x35bfff,.72,[1.27,-.14,-.08]);
const r3=ring(3.0,.025,0x9a55ff,.5,[1.34,.18,.1]);
const glow=new THREE.Mesh(new THREE.SphereGeometry(1.58,48,48),new THREE.MeshBasicMaterial({color:0x1456a0,transparent:true,opacity:.12,side:THREE.BackSide}));glow.position.copy(core.position);scene.add(glow);
const starsGeo=new THREE.BufferGeometry(),N=1600,positions=new Float32Array(N*3),sizes=new Float32Array(N);
let seed=123456;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<N;i++){let rad=7+rand()*35,a=rand()*Math.PI*2,b=(rand()-.5)*Math.PI;positions[i*3]=Math.cos(a)*Math.cos(b)*rad;positions[i*3+1]=Math.sin(b)*rad;positions[i*3+2]=Math.sin(a)*Math.cos(b)*rad;sizes[i]=rand()}
starsGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));
const stars=new THREE.Points(starsGeo,new THREE.PointsMaterial({color:0x9bcaff,size:.045,transparent:true,opacity:.85,sizeAttenuation:true}));scene.add(stars);
const dustGeo=new THREE.BufferGeometry(),D=650,dp=new Float32Array(D*3);
for(let i=0;i<D;i++){let a=rand()*Math.PI*2,rad=2.1+rand()*1.8;dp[i*3]=Math.cos(a)*rad;dp[i*3+1]=2.55+(rand()-.5)*.9;dp[i*3+2]=Math.sin(a)*rad*.42}
dustGeo.setAttribute('position',new THREE.BufferAttribute(dp,3));
const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xffb36b,size:.035,transparent:true,opacity:.9,blending:THREE.AdditiveBlending}));scene.add(dust);
const beamGeo=new THREE.CylinderGeometry(.018,.32,9,32,1,true);const beamMat=new THREE.MeshBasicMaterial({color:0x318fff,transparent:true,opacity:.12,side:THREE.DoubleSide,blending:THREE.AdditiveBlending});const beam=new THREE.Mesh(beamGeo,beamMat);beam.position.set(0,2.55,0);scene.add(beam);
const lessonGroup=new THREE.Group();scene.add(lessonGroup);
const rayCurve=new THREE.CatmullRomCurve3([
 new THREE.Vector3(-5,3.5,1.2),new THREE.Vector3(-3.2,3.35,.9),
 new THREE.Vector3(-2.1,4.25,.4),new THREE.Vector3(-1.0,4.6,.1),
 new THREE.Vector3(0,4.55,0),new THREE.Vector3(1.1,4.15,.1),
 new THREE.Vector3(2.5,3.15,.5),new THREE.Vector3(4,2.7,1)
]);
const ray=new THREE.Mesh(new THREE.TubeGeometry(rayCurve,120,.035,8,false),new THREE.MeshBasicMaterial({color:0x6be7ff,transparent:true,opacity:.95,blending:THREE.AdditiveBlending}));lessonGroup.add(ray);
const horizon=new THREE.Mesh(new THREE.TorusGeometry(1.72,.035,12,180),new THREE.MeshBasicMaterial({color:0x55dfff,transparent:true,opacity:.9,blending:THREE.AdditiveBlending}));horizon.position.copy(core.position);lessonGroup.add(horizon);
const clockGroup=new THREE.Group();clockGroup.position.set(3.25,2.0,.3);lessonGroup.add(clockGroup);
const clockFace=new THREE.Mesh(new THREE.CircleGeometry(.85,64),new THREE.MeshBasicMaterial({color:0x071a32,transparent:true,opacity:.85,side:THREE.DoubleSide}));clockGroup.add(clockFace);
const clockRim=new THREE.Mesh(new THREE.RingGeometry(.84,.91,80),new THREE.MeshBasicMaterial({color:0x7bdfff,side:THREE.DoubleSide}));clockGroup.add(clockRim);
const handMat=new THREE.MeshBasicMaterial({color:0xffffff});
const hand1=new THREE.Mesh(new THREE.BoxGeometry(.035,.58,.025),handMat);hand1.position.y=.27;clockGroup.add(hand1);
const hand2=new THREE.Mesh(new THREE.BoxGeometry(.025,.4,.03),new THREE.MeshBasicMaterial({color:0x5de0ff}));hand2.position.set(.16,.1,.02);hand2.rotation.z=-.85;clockGroup.add(hand2);
const sun=new THREE.Mesh(new THREE.SphereGeometry(.34,32,24),new THREE.MeshBasicMaterial({color:0xffc15c}));sun.position.set(-3.4,-1.5,.2);lessonGroup.add(sun);
const earth=new THREE.Mesh(new THREE.SphereGeometry(.16,24,18),new THREE.MeshStandardMaterial({color:0x318dff,roughness:.7}));earth.position.set(-2.2,-1.5,.2);lessonGroup.add(earth);
const orbit=new THREE.Mesh(new THREE.TorusGeometry(.85,.012,8,100),new THREE.MeshBasicMaterial({color:0x75bfff,transparent:true,opacity:.8}));orbit.position.set(-3.4,-1.5,.2);lessonGroup.add(orbit);

function smooth(a,b,x){let t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)}
window.seek=(t)=>{
 const p=t/20;
 r1.rotation.z=.25+t*.45;r2.rotation.z=-.2-t*.32;r3.rotation.z=.1+t*.2;dust.rotation.y=t*.5;stars.rotation.y=t*.004;horizon.rotation.z=t*.42;horizon.scale.setScalar(1+Math.sin(t*3.2)*.055);clockGroup.rotation.z=Math.sin(t*1.8)*.045;ray.material.opacity=.72+.25*Math.sin(t*5);
 const approach=smooth(0,8,t),pull=smooth(10,18,t);
 ray.visible=t>=3.2&&t<7.1;horizon.visible=t>=7.1&&t<11.2;
 clockGroup.visible=t>=11.2&&t<15.4;sun.visible=t>=15.4&&t<18.3;earth.visible=t>=15.4&&t<18.3;orbit.visible=t>=15.4&&t<18.3;
 hand1.rotation.z=-t*.18;hand2.rotation.z=-t*.32;
 earth.position.set(-3.4+Math.cos(t*1.8)*.85,-1.5+Math.sin(t*1.8)*.85,.2);

 camera.position.set(Math.sin(t*.42)*(.9+pull*1.2),4.5-approach*.45+Math.sin(t*.7)*.18,16-approach*4.2+pull*.8);
 camera.lookAt(Math.sin(t*.28)*.35,2.25+Math.sin(t*.55)*.12,0);camera.fov=35-approach*5;camera.updateProjectionMatrix();
 core.scale.setScalar(1+pull*.12);glow.material.opacity=.08+Math.sin(t*2)*.035;
 renderer.render(scene,camera);
 const beats=[
  [0,3.2,'یک سؤال عجیب...','اگر به سیاه‌چاله نزدیک شوی؟','پاسخ، عجیب‌تر از تصور توست',''],
  [3.2,7.1,'راز اول','نور هم خم می‌شود','گرانشِ شدید، مسیر نور را کج می‌کند','نور • گرانش'],
  [7.1,8.45,'راز دوم','افق رویداد','از این مرز به بعد، حتی نور راه فرار ندارد','مرز بی‌بازگشت'],
  [8.45,9.35,'','','',''],
  [9.35,11.2,'راز دوم','افق رویداد','حتی نور هم نمی‌تواند بازگردد','مرز بی‌بازگشت'],
  [11.2,15.4,'راز سوم','زمان کُند می‌شود','از نگاه ناظر دوردست، ساعتِ نزدیک سیاه‌چاله کندتر می‌گذرد','زمان • نسبیت'],
  [15.4,18.3,'حقیقت مهم','همه‌چیز را نمی‌بلعد!','اگر خورشید هم‌جرمِ خودش سیاه‌چاله می‌شد، مدار زمین تقریباً همان می‌ماند','گرانش از فاصله'],
  [18.3,20.01,'حالا تو بگو','کدام راز عجیب‌تر بود؟','برای راز بعدی، BAMO را دنبال کن','BAMO']
 ];
 let beat=beats.find(b=>t>=b[0]&&t<b[1])||beats[beats.length-1];
 for(const [id,value] of [['kicker',beat[2]],['title',beat[3]],['sub',beat[4]],['caption',beat[5]]])document.getElementById(id).textContent=value;
 const local=Math.min(1,(t-beat[0])/(beat[1]-beat[0]));
 for(const id of ['kicker','title','rule','sub','caption']){const e=document.getElementById(id);const visible=beat[2]!=='';e.style.opacity=visible?Math.min(1,local*5,(1-local)*5+0.15):0;e.style.transform='translateY('+(18*(1-Math.min(1,local*5)))+'px)';}
 document.getElementById('progress').style.width=(p*100)+'%';
};
window.seek(0);
</script>

<audio data-synth="whoosh" data-at="1.0" data-gain="-13"></audio>
