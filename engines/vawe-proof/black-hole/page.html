<style>

<script type="module">
import * as THREE from 'three';
import '/core/engine/page-api.js';
const canvas=document.querySelector('#scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(1);renderer.setSize(1080,1920,false);renderer.setClearColor(0x02030a,1);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x02030a,.035);
const camera=new THREE.PerspectiveCamera(37,1080/1920,.1,120);camera.position.set(0,2.6,15);
scene.add(new THREE.AmbientLight(0x243a68,1.25));
const key=new THREE.PointLight(0x42aaff,95,40);key.position.set(-5,5,7);scene.add(key);
const warm=new THREE.PointLight(0xff6b25,65,35);warm.position.set(4,-2,3);scene.add(warm);
const core=new THREE.Mesh(new THREE.SphereGeometry(1.42,96,64),new THREE.MeshBasicMaterial({color:0x010106}));core.position.set(0,.55,0);scene.add(core);
function ring(radius,tube,color,opacity,rotation){const m=new THREE.Mesh(new THREE.TorusGeometry(radius,tube,12,220),new THREE.MeshBasicMaterial({color,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false}));m.rotation.set(rotation[0],rotation[1],rotation[2]);m.position.y=.55;scene.add(m);return m}
const r1=ring(2.15,.18,0xff8b38,.88,[1.18,.08,.12]);
const r2=ring(2.55,.075,0x35bfff,.72,[1.27,-.14,-.08]);
const r3=ring(3.0,.025,0x9a55ff,.5,[1.34,.18,.1]);

const starsGeo=new THREE.BufferGeometry(),N=1600,positions=new Float32Array(N*3),sizes=new Float32Array(N);
let seed=123456;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<N;i++){let rad=7+rand()*35,a=rand()*Math.PI*2,b=(rand()-.5)*Math.PI;positions[i*3]=Math.cos(a)*Math.cos(b)*rad;positions[i*3+1]=Math.sin(b)*rad;positions[i*3+2]=Math.sin(a)*Math.cos(b)*rad;sizes[i]=rand()}
starsGeo.setAttribute('position',new THREE.BufferAttribute(positions,3));
const stars=new THREE.Points(starsGeo,new THREE.PointsMaterial({color:0x9bcaff,size:.045,transparent:true,opacity:.85,sizeAttenuation:true}));scene.add(stars);
const dustGeo=new THREE.BufferGeometry(),D=650,dp=new Float32Array(D*3);
for(let i=0;i<D;i++){let a=rand()*Math.PI*2,rad=2.1+rand()*1.8;dp[i*3]=Math.cos(a)*rad;dp[i*3+1]=.55+(rand()-.5)*.9;dp[i*3+2]=Math.sin(a)*rad*.42}
dustGeo.setAttribute('position',new THREE.BufferAttribute(dp,3));
const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0xffb36b,size:.035,transparent:true,opacity:.9,blending:THREE.AdditiveBlending}));scene.add(dust);
const beamGeo=new THREE.CylinderGeometry(.018,.32,9,32,1,true);const beamMat=new THREE.MeshBasicMaterial({color:0x318fff,transparent:true,opacity:.12,side:THREE.DoubleSide,blending:THREE.AdditiveBlending});const beam=new THREE.Mesh(beamGeo,beamMat);beam.position.set(0,.55,0);scene.add(beam);
function smooth(a,b,x){let t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)}
window.seek=(t)=>{
 const p=t/12;
 r1.rotation.z=.25+t*.45;r2.rotation.z=-.2-t*.32;r3.rotation.z=.1+t*.2;dust.rotation.y=t*.5;stars.rotation.y=t*.004;
 const approach=smooth(0,5,t),pull=smooth(5,10,t);
 camera.position.set(Math.sin(t*.24)*(.7+pull*1.1),2.6-approach*.65,15-approach*4.2+pull*1.1);
 camera.lookAt(0,.45,0);camera.fov=37-approach*5;camera.updateProjectionMatrix();
 core.scale.setScalar(1+pull*.12);glow.material.opacity=.08+Math.sin(t*2)*.035;
 renderer.render(scene,camera);
 for(const [id,a,b] of [['kicker',.6,11.7],['title',1,11.7],['rule',1.7,11.7],['sub',2,11.7],['caption',2.8,11.7]]){
  const e=document.getElementById(id),v=smooth(a,a+.8,t)*(1-smooth(b-.55,b,t));e.style.opacity=v;e.style.transform='translateY('+(24*(1-v))+'px)';
 }
};
window.seek(0);
</script>
