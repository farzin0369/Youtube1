<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAMO — Gravity bends spacetime</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(ellipse at 50% 48%,#10152b 0%,#050815 52%,#010208 100%);color:#f4f7ff;font-family:Arial,sans-serif}
svg{position:absolute;inset:0;width:100%;height:100%}
.title{position:absolute;top:7%;left:8%;right:8%;text-align:center;font-size:48px;line-height:1.55;font-weight:800;letter-spacing:-1px;text-shadow:0 0 26px #70dfff}
.subtitle{position:absolute;top:15%;left:10%;right:10%;text-align:center;color:#b9c8e9;font-size:27px;line-height:1.8}
.caption{position:absolute;left:8%;right:8%;bottom:13%;text-align:center;font-size:31px;line-height:1.7;color:#eaf7ff;text-shadow:0 0 18px #56dfff}
.brand{position:absolute;bottom:5%;left:0;right:0;text-align:center;letter-spacing:8px;font-size:23px;color:#a8d9ff}
</style></head>
<body><div id="stage" data-composition-id="bamo-spacetime-curvature" data-width="1080" data-height="1920" data-fps="30" data-duration="20">
<svg viewBox="0 0 1080 1920" role="img" aria-label="Animated scientific illustration of spacetime curvature around a massive object">
<defs>
 <radialGradient id="hole"><stop offset="0" stop-color="#000"/><stop offset=".7" stop-color="#01030b"/><stop offset=".83" stop-color="#111b34"/><stop offset="1" stop-color="#62eaff" stop-opacity="0"/></radialGradient>
 <radialGradient id="glow"><stop stop-color="#9af8ff" stop-opacity=".9"/><stop offset=".25" stop-color="#4e9dff" stop-opacity=".28"/><stop offset="1" stop-color="#4e9dff" stop-opacity="0"/></radialGradient>
 <linearGradient id="ring"><stop stop-color="#7cf6ff"/><stop offset=".45" stop-color="#d7a4ff"/><stop offset="1" stop-color="#ffb36b"/></linearGradient>
 <filter id="bloom" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<g id="camera">
 <g id="grid" fill="none" stroke="#56cfff" stroke-width="2.2" opacity=".55" filter="url(#bloom)"></g>
 <ellipse cx="540" cy="1000" rx="380" ry="180" fill="url(#glow)" opacity=".7"/>
 <g id="well" transform="translate(540 1000)">
  <ellipse id="accretion" cx="0" cy="0" rx="260" ry="92" fill="none" stroke="url(#ring)" stroke-width="20" opacity=".0" filter="url(#bloom)"/>
  <ellipse cx="0" cy="0" rx="206" ry="72" fill="none" stroke="#70eaff" stroke-width="3" opacity=".8"/>
  <circle r="160" fill="url(#hole)"/>
  <circle r="116" fill="#010208"/>
  <circle r="118" fill="none" stroke="#9cefff" stroke-width="3" opacity=".75" filter="url(#bloom)"/>
  <path d="M-220 -6 C-150 -105 130 -105 220 -6" fill="none" stroke="#ffbd78" stroke-width="5" opacity=".85" filter="url(#bloom)"/>
  <g id="orbitPath" fill="none" stroke="#d5edff" stroke-width="2" stroke-dasharray="7 12" opacity=".55"><ellipse rx="310" ry="112"/></g>
  <g id="probe"><circle r="15" fill="#fff" filter="url(#bloom)"/><circle r="30" fill="none" stroke="#85f3ff" stroke-width="3" opacity=".8"/></g>
 </g>
 <g id="lens" fill="none" stroke="#e7a8ff" stroke-width="5" opacity="0" filter="url(#bloom)">
  <path d="M115 650 C310 510 770 510 965 650"/><path d="M115 1350 C310 1490 770 1490 965 1350"/>
 </g>
</g>
<g id="stars"></g>
</svg>
<div class="title">گرانش چگونه فضا-زمان را خم می‌کند؟</div>
<div class="subtitle">جرم، هندسهٔ مسیرها را تغییر می‌دهد</div>
<div class="caption" id="caption">یک جرم بزرگ، شبکهٔ فضا-زمان را دگرگون می‌کند</div>
<div class="brand">B A M O • #12bamo</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function(){
 const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);
 const grid=$('grid'),stars=$('stars');
 // Curved coordinate grid: the displacement is strongest near the massive body.
 const cx=540,cy=1000;
 function warp(x,y){const r=Math.hypot(x,y),d=1+Math.max(0,330-r)/330*2.7;return [cx+x,cy+y/d];}
 for(let k=-8;k<=8;k++){
  let pts=[];
  for(let x=-480;x<=480;x+=12){const y=k*48;const p=warp(x,y);pts.push(p.join(','))}
  const path=document.createElementNS(NS,'polyline');path.setAttribute('points',pts.join(' '));path.setAttribute('stroke',k===0?'#b7f7ff':'#4bbde8');path.setAttribute('stroke-width',k===0?3.4:1.8);grid.appendChild(path);
 }
 for(let k=-8;k<=8;k++){
  let pts=[];
  for(let y=-430;y<=430;y+=12){const x=k*55;const p=warp(x,y);pts.push(p.join(','))}
  const path=document.createElementNS(NS,'polyline');path.setAttribute('points',pts.join(' '));path.setAttribute('stroke',k===0?'#b7f7ff':'#4bbde8');path.setAttribute('stroke-width',k===0?3.4:1.8);grid.appendChild(path);
 }
 for(let i=0;i<100;i++){const c=document.createElementNS(NS,'circle');c.setAttribute('cx',(i*137)%1080);c.setAttribute('cy',(i*281)%1920);c.setAttribute('r',i%9===0?3:1.4);c.setAttribute('fill','#c8eaff');c.setAttribute('opacity',.18+(i%5)*.09);stars.appendChild(c)}
 const tl=gsap.timeline({paused:true});
 tl.fromTo('#grid',{opacity:0,scale:.78,transformOrigin:'50% 52%'},{opacity:.68,scale:1,duration:2.5,ease:'power3.out'},0);
 tl.fromTo('#well',{scale:.2,opacity:0,transformOrigin:'center'},{scale:1,opacity:1,duration:1.8,ease:'back.out(1.2)'},2);
 tl.to('#accretion',{opacity:.95,duration:1.4},3.2);
 tl.fromTo('#probe',{x:310,y:0,scale:.5},{x:-310,y:0,scale:1,duration:6,ease:'none'},4);
 tl.to('#camera',{rotation:-5,scale:1.13,transformOrigin:'50% 52%',duration:5,ease:'sine.inOut'},5);
 tl.to('#lens',{opacity:.9,duration:1.2},10);
 tl.to('#grid',{rotation:2,scale:1.2,duration:4,ease:'sine.inOut'},11);
 tl.to('#caption',{textContent:'مسیر حرکتِ نور و ماده در نزدیکی جرم تغییر می‌کند',duration:.5},10.5);
 tl.to('#probe',{x:0,y:-25,scale:.75,duration:2,ease:'power2.inOut'},14);
 tl.to('#caption',{opacity:0,duration:.7},17.8);
 tl.to('#caption',{textContent:'جرم، هندسهٔ جهان را شکل می‌دهد',opacity:1,duration:.7},18.5);
 window.__timelines=window.__timelines||{};window.__timelines['bamo-spacetime-curvature']=tl;
})();
</script></body></html>
