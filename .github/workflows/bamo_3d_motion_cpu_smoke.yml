name: BAMO CPU 3D renderer preview smoke test
on:
  push:
    branches: ["feat/bamo-visual-review-and-scene-fidelity"]
    paths:
      - "app/bamo_motion_engine.py"
      - "app/bamo_scene_director.py"
      - "app/bamo_production_renderer.py"
      - "app/bamo_ai_director.py"
      - "app/llm_provider.py"
      - "app/media_qa.py"
      - "app/spiritual_video.py"
      - "scripts/smoke_bamo_3d_renderer.py"
      - ".github/workflows/bamo_3d_motion_cpu_smoke.yml"
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bamo-approved-3d-smoke-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: feat/bamo-visual-review-and-scene-fidelity
      - name: Restore AI director if corrupted
        run: |
          set -euo pipefail
          if ! grep -q 'def direct_scene' app/bamo_ai_director.py 2>/dev/null; then
            echo "Director file is broken; restoring from baf59fa"
            curl -fsSL "https://raw.githubusercontent.com/farzin0369/Youtube1/baf59fa9cfa6/app/bamo_ai_director.py" -o app/bamo_ai_director.py
            python3 << 'PY'
          from pathlib import Path
          text = Path("app/bamo_ai_director.py").read_text()
          old = '''    clean_relationships = []\n    for relation in relationships:\n        if not isinstance(relation, dict):\n            raise ValueError("relationship must be an object")\n        source, target, kind = str(relation.get("from", "")), str(relation.get("to", "")), str(relation.get("kind", ""))\n        if source not in seen or target not in seen or source == target or kind not in {"connect", "orbit", "point_to"}:\n            raise ValueError("relationship references invalid objects")\n        clean_relationships.append({"from": source, "to": target, "kind": kind})\n'''
          new = '''    clean_relationships = []\n    for relation in relationships:\n        if not isinstance(relation, dict):\n            continue\n        source, target, kind = str(relation.get("from", "")), str(relation.get("to", "")), str(relation.get("kind", ""))\n        if source not in seen or target not in seen or source == target or kind not in {"connect", "orbit", "point_to"}:\n            continue\n        clean_relationships.append({"from": source, "to": target, "kind": kind})\n'''
          if old in text:
              text = text.replace(old, new, 1)
              Path("app/bamo_ai_director.py").write_text(text)
              print("soft-drop applied")
          compile(text, "app/bamo_ai_director.py", "exec")
          print("director restored", len(text))
          PY
            rm -f app/bamo_ai_director_head.py app/bamo_ai_director_tail1.py app/bamo_ai_director_tail2.py app/bamo_ai_director_impl.py || true
            git config user.name "bamo-bot"
            git config user.email "bamo-bot@users.noreply.github.com"
            git add app/bamo_ai_director.py
            git add -u app/ || true
            if ! git diff --cached --quiet; then
              git commit -m "Restore bamo_ai_director.py from baf59fa with soft-drop relationships"
              git push origin HEAD:feat/bamo-visual-review-and-scene-fidelity || true
            fi
          else
            echo "Director file looks healthy"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core blender
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Cache local Qwen weights
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-qwen2.5-7b-v1-${{ runner.os }}
      - name: Start local CPU language model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/bamo-ollama.log 2>&1 &)
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:7b
      - name: Run renderer and media QA smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}
          CHANNEL_BRAND: BAMO
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          USE_LOCAL_LLM: "1"
          BAMO_PREFER_LOCAL_LLM: "1"
          LOCAL_LLM_MODEL: qwen2.5:7b
          LLM_TIMEOUT_SECONDS: "900"
          OLLAMA_TIMEOUT_SECONDS: "900"
          OLLAMA_NUM_CTX: "4096"
          OLLAMA_NUM_PREDICT: "4096"
          TTS_PROVIDER: edge-tts
          TTS_VOICE: fa-IR-FaridNeural
          BAMO_BLENDER_SAMPLES: "2"
          BAMO_BLENDER_RESOLUTION_PERCENTAGE: "25"
          BAMO_BLENDER_THREADS: "2"
          BAMO_BLENDER_DENOISE: "false"
        run: python scripts/smoke_bamo_3d_renderer.py
      - name: Upload rendered MP4 and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BAMO-CPU-3D-preview-smoke-${{ github.run_id }}
          path: output/bamo-3d-smoke/
          retention-days: 7
