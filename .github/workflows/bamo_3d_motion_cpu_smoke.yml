name: BAMO CPU 3D renderer preview smoke test
on:
  push:
    branches: ["feat/bamo-visual-review-and-scene-fidelity"]
    paths:
      - "app/bamo_motion_engine.py"
      - "app/bamo_scene_director.py"
      - "app/bamo_production_renderer.py"
      - "app/bamo_ai_director.py"
      - "app/media_qa.py"
      - "app/spiritual_video.py"
      - "scripts/smoke_bamo_3d_renderer.py"
      - ".github/workflows/bamo_3d_motion_cpu_smoke.yml"
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bamo-approved-3d-smoke-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core blender
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run renderer and media QA smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}
          CHANNEL_BRAND: BAMO
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          TTS_PROVIDER: edge-tts
          TTS_VOICE: fa-IR-FaridNeural
          # Fast, low-resolution CI smoke settings only. Production render
          # quality remains controlled separately and is not approved here.
          BAMO_BLENDER_SAMPLES: "2"
          BAMO_BLENDER_RESOLUTION_PERCENTAGE: "25"
          BAMO_BLENDER_THREADS: "2"
          BAMO_BLENDER_DENOISE: "false"
        run: python scripts/smoke_bamo_3d_renderer.py
      - name: Upload rendered MP4 and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BAMO-CPU-3D-preview-smoke-${{ github.run_id }}
          path: output/bamo-3d-smoke/
          retention-days: 7
