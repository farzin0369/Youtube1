name: Apply OpenClaw reviewer fix
on:
  workflow_dispatch:
  push:
    branches: ["feat/openclaw-autonomous-manager-v2", "fix/openclaw-reviewer-v3"]
    paths:
      - "scripts/patch_openclaw_reviewer.py"
      - "scripts/patch_spiritual_shorts.py"
      - ".github/workflows/apply-openclaw-reviewer-fix.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply OpenClaw reviewer patch if present
        run: |
          if [ -f scripts/patch_openclaw_reviewer.py ]; then
            python3 scripts/patch_openclaw_reviewer.py
          fi
      - name: Restore and patch spiritual_shorts word-count recovery
        run: |
          if [ -f scripts/patch_spiritual_shorts.py ]; then
            python3 scripts/patch_spiritual_shorts.py
          fi
      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name "openclaw-fix-bot"
          git config user.email "openclaw-fix-bot@users.noreply.github.com"
          git add app/spiritual_shorts.py scripts/openclaw_manager.py || true
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "fix: apply bounded recovery patches (reviewer + shorts word-count)"
            git push
          fi
