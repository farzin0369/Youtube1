name: BAMO Vawe cinematic proof
on:
  push:
    branches: [feat/bamo-vawe-cinematic-proof]
    paths:
      - 'engines/vawe-proof/**'
      - '.github/workflows/bamo-vawe-cinematic-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install system tools and Chrome runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg ca-certificates fonts-liberation libasound2t64 libatk-bridge2.0-0 libatk1.0-0 libc6 libcairo2 libcups2 libdbus-1-3 libdrm2 libexpat1 libfontconfig1 libgbm1 libgcc-s1 libglib2.0-0 libgtk-3-0 libnspr4 libnss3 libpango-1.0-0 libpangocairo-1.0-0 libstdc++6 libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 libxext6 libxfixes3 libxi6 libxkbcommon0 libxrandr2 libxrender1 libxshmfence1 libxss1 libxtst6 lsb-release wget xdg-utils
      - name: Clone and install Vawe
        run: |
          git clone --depth 1 https://github.com/vawe-hq/vawe.git /tmp/vawe
          cd /tmp/vawe
          npm install
          npm install three
          npx puppeteer browsers install chrome
          npx puppeteer --version
          bin/vawe doctor
      - name: Render cinematic 3D sample
        run: |
          mkdir -p /tmp/vawe/films/bamo-black-hole
          cp engines/vawe-proof/black-hole/page.html /tmp/vawe/films/bamo-black-hole/page.html
          cd /tmp/vawe
          bin/vawe dev films/bamo-black-hole/page.html --no-judge --fast
          test -s out/bamo-black-hole-draft.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_name,width,height,r_frame_rate -of json out/bamo-black-hole-draft.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: BAMO-Vawe-Black-Hole-Proof
          path: |
            /tmp/vawe/out/bamo-black-hole-draft.mp4
            /tmp/vawe/out/bamo-black-hole-draft.png
          if-no-files-found: error
          retention-days: 14
