name: BAMO OMNIVISION foundation CI
on:
  push:
    branches: [feat/bamo-omnivision-engine]
    paths:
      - 'engines/omnivision/**'
      - '.github/workflows/bamo-omnivision-ci.yml'
  pull_request:
    paths:
      - 'engines/omnivision/**'
      - '.github/workflows/bamo-omnivision-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  planner-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run planner and scene graph tests
        working-directory: engines/omnivision
        run: |
          npm test
          printf 'سیاه‌چاله نور را خم می‌کند. زمان نزدیک افق رویداد کندتر می‌گذرد.\n' | node src/cli.mjs > /tmp/plan.json
          node -e "const p=JSON.parse(require('node:fs').readFileSync('/tmp/plan.json','utf8')); if(p.scenes.length!==2) process.exit(1); console.log('PASS: scene plan generated')"
