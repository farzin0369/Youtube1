name: HyperFrames Render BAMO Short

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-pro:
    name: Official template level render
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bamo-openmontage-autonomous-studio

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-liberation

      - name: Scaffold from official kinetic-type + add cosmic-orb
        run: |
          set -euo pipefail
          rm -rf /tmp/bamo-pro
          # Official HyperFrames project template (type-led motion)
          npx --yes hyperframes@0.9.19 init /tmp/bamo-pro --example kinetic-type --non-interactive
          cd /tmp/bamo-pro
          # Registry block: WebGL nebula orb (pro visual language)
          npx --yes hyperframes@0.9.19 add cosmic-orb --no-clipboard || true
          npx --yes hyperframes@0.9.19 add gravitational-lens --no-clipboard || true
          ls -la
          ls compositions 2>/dev/null || true

      - name: Inject BAMO English Short content + portrait framing
        run: |
          set -euo pipefail
          cd /tmp/bamo-pro
          python3 - <<'PY'
          from pathlib import Path
          import re

          # Portrait Shorts frame + BAMO brand overlays injected into main-graphics if present
          graphics = Path("compositions/main-graphics.html")
          index = Path("index.html")

          # Ensure narration asset dir
          Path("assets").mkdir(exist_ok=True)

          # Patch index to 9:16 and 21s when possible
          if index.exists():
              t = index.read_text(encoding="utf-8")
              t = t.replace('width=1920, height=1080', 'width=1080, height=1920')
              t = t.replace('width: 1920px', 'width: 1080px')
              t = t.replace('height: 1080px', 'height: 1920px')
              t = re.sub(r'data-width="1920"', 'data-width="1080"', t)
              t = re.sub(r'data-height="1080"', 'data-height="1920"', t)
              t = re.sub(r'data-duration="[0-9.]+"', 'data-duration="21"', t, count=3)
              # Prefer local narration if we add audio element later
              index.write_text(t, encoding="utf-8")
              print("patched index.html to portrait 21s")

          if graphics.exists():
              g = graphics.read_text(encoding="utf-8")
              # Soft replace common demo strings if present
              replacements = [
                  ("HyperFrames", "BAMO"),
                  ("hyperframes", "BAMO"),
              ]
              for a, b in replacements:
                  g = g.replace(a, b)
              graphics.write_text(g, encoding="utf-8")
              print("patched main-graphics.html brand strings")
          else:
              print("no main-graphics.html — template structure differs")
          PY

      - name: Generate English narration
        run: |
          pip install -q edge-tts
          python3 - <<'PY'
          import asyncio, edge_tts
          text = (
            "Time is not the same for everyone. "
            "Near a black hole, one second can equal years on Earth. "
            "GPS satellites already correct for this every day. "
            "Relativity is not theory on a chalkboard. It runs the modern world. "
            "BAMO. Follow at twelve bamo."
          )
          asyncio.run(edge_tts.Communicate(text, "en-US-GuyNeural").save("/tmp/bamo-pro/assets/narration.mp3"))
          print("tts ok")
          PY

      - name: Render with HyperFrames 0.9.19
        run: |
          set -euo pipefail
          cd /tmp/bamo-pro
          mkdir -p /tmp/bamo-out
          npx --yes hyperframes@0.9.19 render --gpu -o /tmp/bamo-out/BAMO_Pro_HyperFrames_@12bamo.mp4 \
            || npx --yes hyperframes@0.9.19 render -o /tmp/bamo-out/BAMO_Pro_HyperFrames_@12bamo.mp4
          ls -lh /tmp/bamo-out/
          ffprobe -v error -show_entries stream=width,height,codec_name -show_entries format=duration,size -of default=nw=1 /tmp/bamo-out/*.mp4 || true

      - uses: actions/upload-artifact@v4
        with:
          name: bamo-hyperframes-pro-official
          path: /tmp/bamo-out/
          if-no-files-found: error
          retention-days: 14
