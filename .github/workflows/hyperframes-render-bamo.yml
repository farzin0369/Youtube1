name: HyperFrames Render BAMO Short

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-cpu:
    name: HyperFrames HQ (Actions CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bamo-openmontage-autonomous-studio

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-liberation

      - name: Generate English narration
        run: |
          pip install -q edge-tts
          mkdir -p productions/bamo-time-dilation/assets
          python3 - <<'PY'
          import asyncio, edge_tts
          text = (
            "Time is not the same for everyone. "
            "Near a black hole, one second can equal years on Earth. "
            "GPS satellites already correct for this every day. "
            "Relativity is not theory on a chalkboard. It runs the modern world. "
            "BAMO. Follow at twelve bamo."
          )
          asyncio.run(edge_tts.Communicate(text, "en-US-GuyNeural").save(
              "productions/bamo-time-dilation/assets/narration.mp3"
          ))
          print("tts ok")
          PY

      - name: Render HyperFrames 0.9.19 HQ
        working-directory: productions/bamo-time-dilation
        run: |
          mkdir -p ../../outputs
          # Latest HyperFrames; try --gpu if available on runner, fall back
          npx --yes hyperframes@0.9.19 render --gpu -o ../../outputs/BAMO_TimeDilation_HyperFrames_HQ_@12bamo.mp4 \
            || npx --yes hyperframes@0.9.19 render -o ../../outputs/BAMO_TimeDilation_HyperFrames_HQ_@12bamo.mp4
          ls -lh ../../outputs/BAMO_TimeDilation_HyperFrames_HQ_@12bamo.mp4
          ffprobe -v error -show_entries stream=width,height,codec_name,bit_rate -show_entries format=duration,size -of default=nw=1 ../../outputs/BAMO_TimeDilation_HyperFrames_HQ_@12bamo.mp4 || true

      - uses: actions/upload-artifact@v4
        with:
          name: bamo-hyperframes-hq
          path: outputs/BAMO_TimeDilation_HyperFrames_HQ_@12bamo.mp4
          if-no-files-found: error
          retention-days: 14

  render-colab-gpu:
    name: HyperFrames on Colab GPU
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bamo-openmontage-autonomous-studio

      - name: Check Colab token
        id: check
        run: |
          if [ -n "${{ secrets.COLAB_CLI_TOKEN_JSON }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "COLAB_CLI_TOKEN_JSON missing — skip Colab GPU job"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Install Colab CLI
        if: steps.check.outputs.ok == 'true'
        run: pip install -q google-colab-cli edge-tts

      - name: Restore token
        if: steps.check.outputs.ok == 'true'
        env:
          COLAB_CLI_TOKEN_JSON: ${{ secrets.COLAB_CLI_TOKEN_JSON }}
        run: |
          mkdir -p ~/.config/colab-cli
          printf '%s' "$COLAB_CLI_TOKEN_JSON" > ~/.config/colab-cli/token.json
          chmod 600 ~/.config/colab-cli/token.json

      - name: Colab T4 HyperFrames render
        if: steps.check.outputs.ok == 'true'
        run: |
          set -euo pipefail
          mkdir -p output/colab_hf
          SESSION="bamo-hf-$(date +%s)"
          colab new -s "$SESSION" --gpu T4 2>&1 | tee output/colab_hf/run.log

          # Install Node 22 + ffmpeg + hyperframes on Colab
          colab exec -s "$SESSION" -b '
          set -e
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y -qq nodejs ffmpeg > /dev/null
          node -v
          pip install -q edge-tts
          ' 2>&1 | tee -a output/colab_hf/run.log

          # Upload project files
          colab upload -s "$SESSION" productions/bamo-time-dilation /content/bamo-time-dilation 2>&1 | tee -a output/colab_hf/run.log || true

          # Generate TTS + render with --gpu
          colab exec -s "$SESSION" -b '
          set -e
          cd /content/bamo-time-dilation
          mkdir -p assets
          python3 - <<PY
          import asyncio, edge_tts
          text = "Time is not the same for everyone. Near a black hole, one second can equal years on Earth. GPS satellites already correct for this every day. Relativity is not theory on a chalkboard. It runs the modern world. BAMO. Follow at twelve bamo."
          asyncio.run(edge_tts.Communicate(text, "en-US-GuyNeural").save("assets/narration.mp3"))
          print("tts ok")
          PY
          npx --yes hyperframes@0.9.19 render --gpu -o /content/BAMO_TimeDilation_HyperFrames_GPU_@12bamo.mp4 \
            || npx --yes hyperframes@0.9.19 render -o /content/BAMO_TimeDilation_HyperFrames_GPU_@12bamo.mp4
          ls -lh /content/BAMO_TimeDilation_HyperFrames_GPU_@12bamo.mp4
          ' 2>&1 | tee -a output/colab_hf/run.log

          colab download -s "$SESSION" /content/BAMO_TimeDilation_HyperFrames_GPU_@12bamo.mp4 output/colab_hf/BAMO_TimeDilation_HyperFrames_GPU_@12bamo.mp4 2>&1 | tee -a output/colab_hf/run.log || true
          colab stop -s "$SESSION" 2>&1 | tee -a output/colab_hf/run.log || true
          ls -la output/colab_hf/

      - uses: actions/upload-artifact@v4
        if: always() && steps.check.outputs.ok == 'true'
        with:
          name: bamo-hyperframes-colab-gpu
          path: output/colab_hf/
          if-no-files-found: warn
          retention-days: 14
