name: Free cinematic short (no GPU)

# Mixkit + Edge-TTS + FFmpeg — runs on GitHub Actions CPU, no Colab

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # daily ~06:00 UTC

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q edge-tts

      - name: Render free cinematic short
        run: python scripts/render_free_cinematic_short.py output/free_cinematic

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-cinematic-short
          path: output/free_cinematic/
          if-no-files-found: warn
