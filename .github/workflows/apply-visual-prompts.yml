name: Wire visual prompts
on:
  workflow_dispatch:
  push:
    branches: ["feat/openclaw-autonomous-manager-v2"]
    paths:
      - "app/visual_prompts.py"
      - "scripts/patch_wire_visual_prompts.py"
      - "scripts/trigger_visual_prompts.txt"
      - ".github/workflows/apply-visual-prompts.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_wire_visual_prompts.py
      - run: |
          git config user.name "openclaw-fix-bot"
          git config user.email "openclaw-fix-bot@users.noreply.github.com"
          git add app/spiritual_video.py app/visual_prompts.py app/ltx_video_engine.py notebooks/colab_ai_video_shorts.md
          if git diff --cached --quiet; then echo noop; else git commit -m "feat: wire cinematic visual prompts + Colab AI video guide" && git push; fi
