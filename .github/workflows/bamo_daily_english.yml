name: BAMO Daily English HyperFrames

# PUBLISHING DISABLED — do not upload to YouTube until quality is explicitly approved.
on:
  # schedule disabled to prevent accidental daily public uploads
  # schedule:
  #   - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to YouTube (KEEP FALSE unless quality approved)"
        type: boolean
        default: false
      privacy:
        description: "Privacy if publishing"
        type: choice
        options: [private, unlisted, public]
        default: private
      language:
        description: "Narration language"
        type: choice
        options: [en, fa]
        default: en

concurrency:
  group: bamo-daily-english
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-liberation fonts-noto-core fonts-noto-ui-core

      - name: Python deps
        run: |
          pip install -q edge-tts google-api-python-client google-auth google-auth-oauthlib pyyaml

      - name: Ensure idea bank
        run: |
          python scripts/expand_idea_bank.py --target 10000
          wc -l data/ideas/ideas.jsonl

      - name: Probe YouTube OAuth
        if: ${{ inputs.publish == true }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          from app.youtube_client import probe_youtube_auth
          r = probe_youtube_auth()
          print(r)
          if not r.get("ok"):
            raise SystemExit("YouTube OAuth failed — check Secrets")
          PY

      - name: Factory (render only by default — no publish)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CONTAINS_SYNTHETIC_MEDIA: "false"
          YOUTUBE_DEFAULT_LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail
          # Hard stop: never publish unless input is explicitly true
          PUBLISH_FLAG=""
          PRIVACY="private"
          LANG_CODE="${{ inputs.language }}"
          if [ "${{ inputs.publish }}" = "true" ]; then
            echo "WARNING: publish explicitly requested"
            PUBLISH_FLAG="--publish"
            PRIVACY="${{ inputs.privacy }}"
          else
            echo "Publish disabled — render only"
          fi
          if [ "$LANG_CODE" = "fa" ]; then
            python scripts/bamo_persian_once.py $PUBLISH_FLAG --privacy "$PRIVACY"
          else
            python scripts/bamo_daily_run.py $PUBLISH_FLAG --privacy "$PRIVACY"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bamo-daily-output
          path: |
            outputs/daily/
            data/publish_history.jsonl
          if-no-files-found: warn
          retention-days: 14

      - name: Commit idea bank usage + history
        if: always()
        run: |
          git config user.name "bamo-bot"
          git config user.email "bot@bamo.local"
          git add data/ideas/ideas.jsonl data/publish_history.jsonl || true
          git diff --staged --quiet || git commit -m "chore(daily): idea usage + publish history"
          git push || true
