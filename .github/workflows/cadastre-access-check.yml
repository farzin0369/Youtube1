name: Cadastre public access smoke test

on:
  push:
    branches:
      - test/cadastre-google-access-check
    paths:
      - ".github/workflows/cadastre-access-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check public website access (no login or form submission)
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';

          const targets = [
            { name: 'Google', url: 'https://www.google.com/' },
            { name: 'Cadastre domain root', url: 'https://cadastre.mimt.gov.ir/' },
            { name: 'Cadastre application', url: 'https://cadastre.mimt.gov.ir/cadastre' }
          ];

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage();
          let failures = 0;

          for (const target of targets) {
            try {
              const response = await page.goto(target.url, {
                waitUntil: 'commit',
                timeout: 30000
              });
              const result = {
                site: target.name,
                requestedUrl: target.url,
                finalUrl: page.url(),
                httpStatus: response?.status() ?? null,
                result: response && response.ok() ? 'reachable' : 'responded_non_2xx'
              };
              console.log(JSON.stringify(result));
              if (!response || !response.ok()) failures++;
            } catch (error) {
              failures++;
              console.log(JSON.stringify({
                site: target.name,
                requestedUrl: target.url,
                result: 'navigation_failed',
                error: String(error).slice(0, 500)
              }));
            }
          }

          await browser.close();
          if (failures) process.exitCode = 1;
          NODE
