name: "Deprecated Pexels stock renderer — disabled; use LTX-Video"

on:
  workflow_dispatch:

jobs:
  render:
    if: false # Disabled: production video generation is LTX-Video only.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Generate stock short
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          mkdir -p output/stock
          python engine/stock_short.py --out output/stock/final_story.mp4 --work output/stock/work
          ls -la output/stock/
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/stock/final_story.mp4 || true

      - uses: actions/upload-artifact@v4
        with:
          name: stock-short
          path: output/stock/
          if-no-files-found: warn
