name: MoneyPrinterTurbo smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Checkout upstream MoneyPrinterTurbo
        uses: actions/checkout@v4
        with:
          repository: harry0703/MoneyPrinterTurbo
          path: /tmp/MoneyPrinterTurbo
      - name: Install upstream requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/MoneyPrinterTurbo/requirements.txt
      - name: Verify CLI and example config
        run: |
          test -f /tmp/MoneyPrinterTurbo/config.example.toml
          cd /tmp/MoneyPrinterTurbo
          python cli.py --help
      - name: Report smoke-test scope
        run: |
          echo 'Smoke test checks upstream CLI startup and example config only.'
          echo 'It does not generate a video and does not upload to YouTube.'
