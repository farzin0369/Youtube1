name: MoneyPrinterTurbo isolated smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moneyprinterturbo-smoke-test
  cancel-in-progress: false

jobs:
  cli-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Checkout upstream MoneyPrinterTurbo
        uses: actions/checkout@v4
        with:
          repository: harry0703/MoneyPrinterTurbo
          ref: main
          path: .tmp/MoneyPrinterTurbo
          persist-credentials: false

      - name: Install upstream dependencies
        working-directory: .tmp/MoneyPrinterTurbo
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "::error::Upstream requirements.txt not found; inspect pyproject.toml before changing this test."
            exit 1
          fi

      - name: Verify CLI starts without publishing or generating a video
        working-directory: .tmp/MoneyPrinterTurbo
        run: |
          python cli.py --help
          test -f config.example.toml
          echo "CLI smoke test passed. No video was generated and no YouTube upload was attempted."

      - name: Upload smoke-test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneyprinterturbo-smoke-test-report
          path: .tmp/MoneyPrinterTurbo/config.example.toml
          if-no-files-found: warn
          retention-days: 3
