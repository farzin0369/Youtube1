name: BAMO Autopilot continuous brain

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bamo-autopilot-continuous
  cancel-in-progress: false

jobs:
  brain-and-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: feat/bamo-visual-review-and-scene-fidelity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Self-heal + director patches + brain
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 scripts/bamo_self_heal.py --syntax-only || true
          python3 scripts/patch_director_procedural_fallback.py || true
          python3 scripts/patch_director_aliases_and_fallback.py || true
          python3 scripts/bamo_brain_tick.py
          git config user.name "bamo-bot"
          git config user.email "bamo-bot@users.noreply.github.com"
          git add app/bamo_ai_director.py app/spiritual_video.py app/bamo_heal_rules.json state/research state/autopilot || true
          if ! git diff --cached --quiet; then
            git commit -m "autopilot continuous: heal + director harden + brain"
            git push origin HEAD:feat/bamo-visual-review-and-scene-fidelity || true
          fi
      - name: Upload brain state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bamo-brain-${{ github.run_id }}
          path: |
            state/autopilot/
            state/research/
          if-no-files-found: warn
          retention-days: 14

  produce-domain-proof:
    needs: brain-and-heal
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: feat/bamo-visual-review-and-scene-fidelity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install media stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core blender
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Domain proof (ellipse / water / interference)
        env:
          PYTHONPATH: ${{ github.workspace }}
          USE_LOCAL_LLM: "1"
          BAMO_PREFER_LOCAL_LLM: "1"
          LOCAL_LLM_MODEL: qwen2.5:3b
          LLM_TIMEOUT_SECONDS: "180"
          OLLAMA_TIMEOUT_SECONDS: "180"
          OLLAMA_NUM_PREDICT: "700"
          TTS_PROVIDER: edge-tts
          TTS_VOICE: fa-IR-FaridNeural
          BAMO_BLENDER_SAMPLES: "4"
          BAMO_BLENDER_RESOLUTION_PERCENTAGE: "35"
          BAMO_BLENDER_DENOISE: "false"
          BAMO_AUTOPILOT_PUBLISH: "false"
        run: |
          set -euo pipefail
          python3 scripts/patch_director_procedural_fallback.py
          python3 scripts/patch_director_aliases_and_fallback.py
          python3 scripts/bamo_self_heal.py --syntax-only
          if curl -fsSL https://ollama.com/install.sh | sh; then
            (ollama serve > /tmp/ollama.log 2>&1 &) || true
            for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 2; done
            ollama pull qwen2.5:3b || true
            curl -fsS http://127.0.0.1:11434/api/generate -d '{"model":"qwen2.5:3b","prompt":"ping","stream":false}' >/dev/null || true
          fi
          python scripts/render_ai_domain_proof.py
          python3 scripts/bamo_brain_tick.py
      - name: Upload domain proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bamo-domain-proof-${{ github.run_id }}
          path: output/bamo-ai-three-domain/
          if-no-files-found: warn
          retention-days: 14
