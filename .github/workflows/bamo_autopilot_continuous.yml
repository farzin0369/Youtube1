name: BAMO Autopilot continuous brain

# Scheduled runs become active only after this workflow is merged to the default branch.
# Manual runs execute the selected branch itself; previews never publish to YouTube.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - work/bamo-integrated-safe-20261104
    paths:
      - app/bamo_motion_engine.py
      - scripts/bamo_blender_scene.py
      - .github/workflows/bamo_autopilot_continuous.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/bamo_autopilot_continuous.yml

# This workflow may generate repair proposals and preview artifacts, but must not push code.
permissions:
  contents: read

concurrency:
  group: bamo-autopilot-continuous-${{ github.ref }}
  cancel-in-progress: false

jobs:
  brain-and-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run regression suite, self-heal syntax check, and brain tick
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test -f scripts/bamo_self_heal.py || { echo "Self-heal engine is not present on this ref"; exit 1; }
          test -f scripts/bamo_brain_tick.py || { echo "Brain tick is not present on this ref"; exit 1; }
          python -m pytest -q
          python3 scripts/bamo_self_heal.py --syntax-only
          python3 scripts/bamo_brain_tick.py
          mkdir -p output/bamo-audit
          git diff --binary > output/bamo-audit/heal-proposal.patch
      - name: Upload brain state and uncommitted repair proposal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bamo-brain-${{ github.run_id }}
          path: |
            state/autopilot/
            state/research/
            output/heal_memory.jsonl
            output/bamo-audit/heal-proposal.patch
          if-no-files-found: warn
          retention-days: 14

  produce-preview:
    needs: brain-and-heal
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU media stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core blender libegl1 libgl1 libgbm1 libxkbcommon0 libwayland-egl1 xvfb mesa-vulkan-drivers
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: AI-directed three-domain CPU preview benchmark (no YouTube)
        env:
          PYTHONPATH: ${{ github.workspace }}
          USE_LOCAL_LLM: "1"
          BAMO_PREFER_LOCAL_LLM: "1"
          # Candidate model for a measured preview run; not production-approved.
          LOCAL_LLM_MODEL: qwen2.5:3b
          OLLAMA_KEEP_ALIVE: "3600"
          OLLAMA_NUM_CTX: "4096"
          BAMO_BLENDER_ENGINE: BLENDER_WORKBENCH
          BAMO_BLENDER_TIMEOUT_SECONDS: "1200"
          BAMO_BLENDER_RENDER_ATTEMPTS: "3"
          BAMO_BLENDER_SAMPLES: "8"
          BAMO_BLENDER_RESOLUTION_PERCENTAGE: "70"
          BAMO_BLENDER_DENOISE: "false"
          BAMO_AUTOPILOT_COUNCIL: "false"
          BAMO_AUTOPILOT_PUBLISH: "false"
        run: |
          set -euo pipefail
          python3 scripts/bamo_self_heal.py --syntax-only
          if ! command -v ollama >/dev/null 2>&1; then
            curl -fsSL https://ollama.com/install.sh -o /tmp/ollama-install.sh
            sh /tmp/ollama-install.sh
          fi
          (ollama serve > /tmp/ollama.log 2>&1 &)
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:3b
          python scripts/render_ai_domain_proof.py
          python3 scripts/bamo_brain_tick.py
          mkdir -p output/bamo-audit
          git diff --binary > output/bamo-audit/heal-proposal.patch
      - name: Upload preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bamo-ai-domain-preview-${{ github.run_id }}
          path: |
            output/bamo-ai-three-domain/
            output/bamo-audit/heal-proposal.patch
          if-no-files-found: warn
          retention-days: 14
