name: BAMO Autopilot continuous brain

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bamo-autopilot-continuous
  cancel-in-progress: true

jobs:
  brain-and-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: feat/bamo-visual-review-and-scene-fidelity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: RESTORE director + quality patches + brain
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 scripts/restore_bamo_ai_director.py
          python3 scripts/apply_quality_patches.py || true
          python3 scripts/bamo_self_heal.py --syntax-only || true
          python3 scripts/bamo_brain_tick.py || true
          git config user.name "bamo-bot"
          git config user.email "bamo-bot@users.noreply.github.com"
          git add app/bamo_ai_director.py app/bamo_motion_engine.py scripts/bamo_blender_motifs_b.py scripts/bamo_blender_primitives.py app/spiritual_video.py app/bamo_heal_rules.json state/research state/autopilot || true
          if ! git diff --cached --quiet; then
            git commit -m "continuous: restore director + apply verified quality patches"
            git push origin HEAD:feat/bamo-visual-review-and-scene-fidelity || true
          fi
      - name: Upload brain state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bamo-brain-${{ github.run_id }}
          path: |
            state/autopilot/
            state/research/
          if-no-files-found: warn
          retention-days: 14

  produce-domain-proof:
    needs: brain-and-heal
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: feat/bamo-visual-review-and-scene-fidelity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install media stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core blender
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Proven domain proof (24 samples, quality patches, procedural)
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Stable profile proven on run 41931613255 (~56 min, ~12MB MP4)
          BAMO_FORCE_PROCEDURAL: "1"
          USE_LOCAL_LLM: "0"
          BAMO_PREFER_LOCAL_LLM: "0"
          TTS_PROVIDER: edge-tts
          TTS_VOICE: fa-IR-FaridNeural
          BAMO_BLENDER_SAMPLES: "24"
          BAMO_BLENDER_RESOLUTION_PERCENTAGE: "40"
          BAMO_BLENDER_DENOISE: "true"
          BAMO_BLENDER_SEED: "17"
          BAMO_BLENDER_EXPOSURE: "-0.35"
          BAMO_BLENDER_FILM_GRAIN: "0"
          BAMO_BLENDER_THREADS: "2"
          BAMO_AUTOPILOT_PUBLISH: "false"
        run: |
          set -euo pipefail
          python3 scripts/restore_bamo_ai_director.py
          python3 scripts/apply_quality_patches.py
          python3 -c "from pathlib import Path; t=Path('app/bamo_ai_director.py').read_text(); assert len(t)>20000 and 'def direct_scene' in t"
          python scripts/render_ai_domain_proof.py
          python3 scripts/bamo_brain_tick.py || true
      - name: Upload domain proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bamo-domain-proof-${{ github.run_id }}
          path: output/bamo-ai-three-domain/
          if-no-files-found: warn
          retention-days: 14
