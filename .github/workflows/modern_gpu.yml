name: Modern GPU CogVideoX story short

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Check Colab token
        id: check
        run: |
          if [ -n "${{ secrets.COLAB_CLI_TOKEN_JSON }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Install Colab CLI
        if: steps.check.outputs.ok == 'true'
        run: pip install -q google-colab-cli

      - name: Restore token
        if: steps.check.outputs.ok == 'true'
        env:
          COLAB_CLI_TOKEN_JSON: ${{ secrets.COLAB_CLI_TOKEN_JSON }}
        run: |
          mkdir -p ~/.config/colab-cli
          printf '%s' "$COLAB_CLI_TOKEN_JSON" > ~/.config/colab-cli/token.json
          chmod 600 ~/.config/colab-cli/token.json

      - name: Free sessions
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        run: |
          mkdir -p output/modern_gpu
          colab sessions 2>&1 | tee output/modern_gpu/sessions.txt || true
          colab sessions 2>/dev/null | awk '{print $1}' | while read -r s; do
            case "$s" in SESSION|Name|----*|"") continue ;; esac
            colab stop -s "$s" 2>&1 || true
          done
          sleep 15

      - name: Run CogVideoX-2B on Colab T4
        if: steps.check.outputs.ok == 'true'
        run: |
          set -euo pipefail
          mkdir -p output/modern_gpu
          SESSION="cog-$(date +%s)"
          echo "SESSION=$SESSION cogvideox-2b" | tee output/modern_gpu/run.log
          ok=0
          for attempt in 1 2 3; do
            if colab new -s "$SESSION" --gpu T4 2>&1 | tee -a output/modern_gpu/run.log; then
              ok=1
              break
            fi
            sleep 30
            SESSION="cog-$(date +%s)-$attempt"
          done
          if [ "$ok" != "1" ]; then
            echo "GPU allocate failed" | tee -a output/modern_gpu/run.log
            exit 1
          fi
          set +e
          colab exec -s "$SESSION" -f engine/modern_gpu_short.py --timeout 9000 2>&1 | tee -a output/modern_gpu/run.log
          set -e
          colab download -s "$SESSION" /content/final_story.mp4 output/modern_gpu/final_story.mp4 2>&1 | tee -a output/modern_gpu/run.log || true
          colab download -s "$SESSION" /content/video_raw.mp4 output/modern_gpu/video_raw.mp4 2>&1 | tee -a output/modern_gpu/run.log || true
          colab stop -s "$SESSION" 2>&1 | tee -a output/modern_gpu/run.log || true
          ls -la output/modern_gpu/ || true
          if [ ! -f output/modern_gpu/final_story.mp4 ] && [ ! -f output/modern_gpu/video_raw.mp4 ]; then
            tail -n 100 output/modern_gpu/run.log || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always() && steps.check.outputs.ok == 'true'
        with:
          name: modern-gpu-short
          path: output/modern_gpu/
          if-no-files-found: warn
