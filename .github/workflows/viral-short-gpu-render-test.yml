name: Viral short real GPU render test

on:
  push:
    branches:
      - fix/viral-short-qc-recovery
    paths:
      - "engine/viral_short.py"
      - ".github/workflows/viral-short-gpu-render-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Require Colab CLI credential
        env:
          COLAB_CLI_TOKEN_JSON: ${{ secrets.COLAB_CLI_TOKEN_JSON }}
        run: |
          if [ -z "${COLAB_CLI_TOKEN_JSON:-}" ]; then
            echo "::error::COLAB_CLI_TOKEN_JSON secret is missing; GPU render cannot start."
            exit 1
          fi

      - name: Install Colab CLI
        run: |
          python -m pip install --quiet google-colab-cli

      - name: Restore Colab CLI token without printing it
        env:
          COLAB_CLI_TOKEN_JSON: ${{ secrets.COLAB_CLI_TOKEN_JSON }}
        run: |
          mkdir -p ~/.config/colab-cli
          printf '%s' "$COLAB_CLI_TOKEN_JSON" > ~/.config/colab-cli/token.json
          chmod 600 ~/.config/colab-cli/token.json

      - name: Allocate T4 and render the branch engine
        id: render
        run: |
          set -euo pipefail
          mkdir -p output/viral-short-gpu
          SESSION="viral-qc-$(date +%s)"
          trap 'colab stop -s "$SESSION" >/dev/null 2>&1 || true' EXIT
          echo "Requesting Colab T4 session"
          ok=0
          for attempt in 1 2 3; do
            if colab new -s "$SESSION" --gpu T4 2>&1 | tee -a output/viral-short-gpu/run.log; then
              ok=1
              break
            fi
            sleep 20
            SESSION="viral-qc-$(date +%s)-$attempt"
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Could not allocate a Colab T4 session after three attempts."
            exit 1
          fi
          echo "Allocated session; checking GPU and running engine"
          printf '%s\n' 'import torch; print("CUDA_AVAILABLE=", torch.cuda.is_available()); print("GPU=", torch.cuda.get_device_name(0) if torch.cuda.is_available() else "NONE"); assert torch.cuda.is_available(), "CUDA GPU is required"' | colab exec -s "$SESSION" 2>&1 | tee -a output/viral-short-gpu/run.log
          set +e
          colab exec -s "$SESSION" -f engine/viral_short.py --timeout 3300 2>&1 | tee -a output/viral-short-gpu/run.log
          render_rc=${PIPESTATUS[0]}
          set -e
          colab download -s "$SESSION" /content/final_story.mp4 output/viral-short-gpu/final_story.mp4 2>&1 | tee -a output/viral-short-gpu/run.log || true
          colab download -s "$SESSION" /content/engine_work/qc_log.json output/viral-short-gpu/qc_log.json 2>&1 | tee -a output/viral-short-gpu/run.log || true
          if [ "$render_rc" -ne 0 ]; then
            echo "::error::Engine exited with code $render_rc"
            exit "$render_rc"
          fi
          test -s output/viral-short-gpu/final_story.mp4

      - name: Install ffprobe and validate final MP4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          set -euo pipefail
          VIDEO=output/viral-short-gpu/final_story.mp4
          test -s "$VIDEO"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,width,height -of json "$VIDEO" | tee output/viral-short-gpu/ffprobe.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("output/viral-short-gpu/ffprobe.json")
          d = json.loads(p.read_text())
          duration = float(d["format"]["duration"])
          size = int(d["format"]["size"])
          streams = d.get("streams", [])
          assert duration >= 10, f"Video too short: {duration:.2f}s"
          assert size >= 1_000_000, f"Video too small: {size} bytes"
          assert any(s.get("codec_type") == "video" for s in streams), "Missing video stream"
          assert any(s.get("codec_type") == "audio" for s in streams), "Missing audio stream"
          v = next(s for s in streams if s.get("codec_type") == "video")
          assert v.get("height", 0) > v.get("width", 0), f"Expected portrait video, got {v.get('width')}x{v.get('height')}"
          print(f"FINAL_MP4_VALID duration={duration:.2f}s size={size} dimensions={v['width']}x{v['height']}")
          PY

      - name: Upload render and QC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viral-short-real-gpu-render
          path: output/viral-short-gpu/
          if-no-files-found: warn
          retention-days: 7
