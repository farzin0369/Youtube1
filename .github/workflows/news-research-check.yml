name: TT Khabar live news research check

on:
  push:
    branches: [main]
    paths:
      - "app/research.py"
      - "scripts/collect_news.py"
      - ".github/workflows/news-research-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependency
        run: python -m pip install PyYAML
      - name: Collect and validate current global news
        run: python scripts/collect_news.py --output output/tt-khabar-news.json
      - name: Upload source-linked research evidence
        uses: actions/upload-artifact@v4
        with:
          name: tt-khabar-news-research-${{ github.run_id }}
          path: output/tt-khabar-news.json
          retention-days: 3
