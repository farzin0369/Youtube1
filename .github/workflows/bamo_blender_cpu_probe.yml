name: BAMO Blender headless CPU qualification
on:
  push:
    branches: ["feat/bamo-omnivision-engine"]
    paths:
      - "scripts/bamo_blender_cpu_probe.py"
      - ".github/workflows/bamo_blender_cpu_probe.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bamo-blender-cpu-probe
  cancel-in-progress: false
jobs:
  blender-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and software OpenGL runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender ffmpeg libegl1 libgl1 libgl1-mesa-dri libx11-6 libxext6 libxrender1 libxi6 libsm6 libxxf86vm1
          blender --version
          ldconfig -p | grep -E 'libEGL.so.1|libGL.so.1'
      - name: Render a real animated 3D scene in headless CPU mode
        env:
          BAMO_BLENDER_OUT: output/bamo-blender-probe
          LIBGL_ALWAYS_SOFTWARE: "1"
          MESA_LOADER_DRIVER_OVERRIDE: llvmpipe
        run: |
          mkdir -p output/bamo-blender-probe
          blender --background --factory-startup --python scripts/bamo_blender_cpu_probe.py
      - name: Upload Blender render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BAMO-Blender-CPU-qualification-${{ github.run_id }}
          path: output/bamo-blender-probe/
          retention-days: 7
