name: BAMO Blender headless CPU qualification
on:
  push:
    branches: ["feat/bamo-omnivision-engine"]
    paths:
      - "scripts/bamo_blender_cpu_probe.py"
      - ".github/workflows/bamo_blender_cpu_probe.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bamo-blender-cpu-probe
  cancel-in-progress: false
jobs:
  blender-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender ffmpeg
          blender --version
      - name: Render a real animated 3D scene in headless mode
        env:
          BAMO_BLENDER_OUT: output/bamo-blender-probe
        run: |
          mkdir -p output/bamo-blender-probe
          blender --background --factory-startup --python scripts/bamo_blender_cpu_probe.py
      - name: Upload Blender render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BAMO-Blender-CPU-qualification-${{ github.run_id }}
          path: output/bamo-blender-probe/
          retention-days: 7
