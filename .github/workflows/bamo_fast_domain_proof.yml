name: BAMO fast domain proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bamo-fast-domain-proof
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bamo-visual-review-and-scene-fidelity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install stack
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core blender
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Restore director + force procedural domain proof
        env:
          PYTHONPATH: ${{ github.workspace }}
          # No local LLM — director must use procedural domain author
          USE_LOCAL_LLM: "0"
          BAMO_PREFER_LOCAL_LLM: "0"
          TTS_PROVIDER: edge-tts
          TTS_VOICE: fa-IR-FaridNeural
          BAMO_BLENDER_SAMPLES: "2"
          BAMO_BLENDER_RESOLUTION_PERCENTAGE: "20"
          BAMO_BLENDER_DENOISE: "false"
          BAMO_AUTOPILOT_PUBLISH: "false"
        run: |
          set -euo pipefail
          python3 scripts/restore_bamo_ai_director.py
          python3 -c "from pathlib import Path; t=Path('app/bamo_ai_director.py').read_text(); assert len(t)>20000 and 'def direct_scene' in t"
          # Break cloud LLM attempts quickly so procedural path engages
          export LLM_TIMEOUT_SECONDS=5
          python scripts/render_ai_domain_proof.py
      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bamo-fast-domain-${{ github.run_id }}
          path: output/bamo-ai-three-domain/
          if-no-files-found: warn
          retention-days: 14
