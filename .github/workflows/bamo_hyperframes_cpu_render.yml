name: BAMO HyperFrames CPU render
on:
  push:
    branches: ["feat/bamo-single-hyperframes-eleven-agent"]
    paths:
      - "scripts/render_bamo_hyperframes.py"
      - "scripts/add_bamo_audio.py"
      - "examples/bamo_first_film.json"
      - ".github/workflows/bamo_hyperframes_cpu_render.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: bamo-hyperframes-cpu-render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Clone and pin the existing YouTube automation agent
        run: |
          git clone https://github.com/darkzOGx/youtube-automation-agent.git integrations/youtube-automation-agent
          git -C integrations/youtube-automation-agent checkout e973d515aef90c467da2289144df737a3bd03859
      - name: Verify cloned upstream revision
        run: |
          git -C integrations/youtube-automation-agent rev-parse HEAD
          test "$(git -C integrations/youtube-automation-agent rev-parse HEAD)" = "e973d515aef90c467da2289144df737a3bd03859"
          test -f integrations/youtube-automation-agent/package.json
          test -f integrations/youtube-automation-agent/test.js
      - name: Run upstream project checks without publishing
        working-directory: integrations/youtube-automation-agent
        run: |
          npm ci
          npm run lint
          npm test
      - name: Install CPU render and voice dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-extra python3-venv
          python3 -m venv /tmp/bamo-tts
          /tmp/bamo-tts/bin/pip install --upgrade pip edge-tts
          node --version
          ffmpeg -version | head -n 2
      - name: Ensure browser runtime
        run: npx --yes hyperframes@0.8.225 browser ensure
      - name: Build and render BAMO short with HyperFrames
        run: |
          python3 scripts/render_bamo_hyperframes.py \
            --brief examples/bamo_first_film.json \
            --output-dir output/bamo/hyperframes \
            --cli-version 0.8.225
      - name: Add Persian voiceover and timed subtitles
        run: |
          /tmp/bamo-tts/bin/edge-tts --version
          /tmp/bamo-tts/bin/python scripts/add_bamo_audio.py \
            --video output/bamo/hyperframes/BAMO-HyperFrames.mp4 \
            --brief examples/bamo_first_film.json \
            --voice fa-IR-FaridNeural --rate +10%
      - name: Verify final MP4 video and audio
        run: |
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate -of json output/bamo/hyperframes/BAMO-HyperFrames.mp4
          ffprobe -v error -show_entries format=duration,size -of json output/bamo/hyperframes/BAMO-HyperFrames.mp4
          test "$(stat -c%s output/bamo/hyperframes/BAMO-HyperFrames.mp4)" -gt 10000
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 output/bamo/hyperframes/BAMO-HyperFrames.mp4)" = "1080"
          test "$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 output/bamo/hyperframes/BAMO-HyperFrames.mp4)" = "1920"
          test "$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 output/bamo/hyperframes/BAMO-HyperFrames.mp4)" = "aac"
          test -s output/bamo/hyperframes/BAMO-fa.vtt
      - name: Save review-only video artifact
        uses: actions/upload-artifact@v4
        with:
          name: BAMO-HyperFrames-CPU-preview-${{ github.run_id }}
          path: output/bamo/hyperframes/
          retention-days: 7
