name: YouTube SEO Update

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Video ID (empty = latest upload)"
        required: false
        default: ""
      mode:
        description: "list | update | comment | both"
        type: choice
        options: [update, list, comment, both]
        default: update
      privacy:
        description: "Keep current, or force privacy"
        type: choice
        options: [keep, private, unlisted, public]
        default: keep
      target:
        description: "Which video when video_id empty"
        type: choice
        options: [latest, latest-private]
        default: latest

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Deps
        run: pip install -q google-api-python-client google-auth google-auth-oauthlib

      - name: Run
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          VID="${{ inputs.video_id }}"
          MODE="${{ inputs.mode }}"
          PRIV="${{ inputs.privacy }}"
          TARGET="${{ inputs.target }}"

          if [ "$MODE" = "list" ]; then
            python scripts/youtube_update_seo.py --list
            exit 0
          fi

          if [ "$MODE" = "update" ] || [ "$MODE" = "both" ]; then
            ARGS=()
            if [ -n "$VID" ]; then
              ARGS+=(--video-id "$VID")
            elif [ "$TARGET" = "latest-private" ]; then
              ARGS+=(--latest-private)
            else
              ARGS+=(--latest)
            fi
            if [ "$PRIV" != "keep" ]; then ARGS+=(--privacy "$PRIV"); fi
            python scripts/youtube_update_seo.py "${ARGS[@]}"
          fi

          if [ "$MODE" = "comment" ] || [ "$MODE" = "both" ]; then
            CARGS=()
            if [ -n "$VID" ]; then
              CARGS+=(--video-id "$VID")
            elif [ "$TARGET" = "latest-private" ]; then
              CARGS+=(--latest-private)
            else
              CARGS+=(--latest)
            fi
            python scripts/youtube_pin_comment.py "${CARGS[@]}" || true
          fi
