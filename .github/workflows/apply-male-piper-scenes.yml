name: Male Piper + scene match
on:
  workflow_dispatch:
  push:
    branches: ["feat/openclaw-autonomous-manager-v2"]
    paths:
      - "scripts/patch_male_piper_and_scenes.py"
      - "scripts/trigger_male_piper_scenes.txt"
      - ".github/workflows/apply-male-piper-scenes.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_male_piper_and_scenes.py
      - run: |
          git config user.name "openclaw-fix-bot"
          git config user.email "openclaw-fix-bot@users.noreply.github.com"
          git add app/piper_tts.py app/spiritual_tts.py app/spiritual_video.py
          if git diff --cached --quiet; then echo noop; else git commit -m "feat: male Piper gyro/ganji + scene-matched Mixkit visuals" && git push; fi
