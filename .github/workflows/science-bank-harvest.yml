name: Science bank harvest (isolated branch only)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/science-bank-harvest-run
    paths:
      - .github/workflows/science-bank-harvest.yml

permissions:
  contents: write

jobs:
  harvest-crossref:
    if: github.ref == 'refs/heads/feat/science-bank-harvest-run'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out isolated harvest branch
        uses: actions/checkout@v4
        with:
          ref: feat/science-bank-harvest-run
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test science idea-bank logic
        run: python -m unittest discover -s tests -p 'test_science_engine.py'

      - name: Harvest research metadata in controlled batches
        shell: bash
        run: |
          set +e
          python -m science_engine.batch_import_crossref --start-index 107 --topics-per-run 20 --limit-per-topic 100 --delay-seconds 1 > /tmp/science-harvest.log 2>&1
          harvest_status=$?
          cat /tmp/science-harvest.log
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add science_engine/ideas.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Harvest Crossref science research candidates"
            git push origin HEAD:feat/science-bank-harvest-run
          else
            echo "No bank changes to commit."
          fi
          exit "$harvest_status"

      - name: Upload harvest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: science-bank-harvest-report
          path: /tmp/science-harvest.log
          if-no-files-found: warn
          retention-days: 7
