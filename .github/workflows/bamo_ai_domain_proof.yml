name: BAMO — AI-authored three-domain CPU proof

on:
  workflow_dispatch:
  push:
    branches:
      - feat/bamo-visual-review-and-scene-fidelity
    paths:
      - scripts/render_ai_domain_proof.py
      - .github/workflows/bamo_ai_domain_proof.yml
      - app/bamo_ai_director.py
      - scripts/bamo_blender_scene.py

permissions:
  contents: read

jobs:
  render-ai-domains:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TTS_PROVIDER: edge-tts
      TTS_VOICE: fa-IR-FaridNeural
      CHANNEL_BRAND: BAMO
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      USE_LOCAL_LLM: "1"
      BAMO_PREFER_LOCAL_LLM: "1"
      LOCAL_LLM_MODEL: qwen2.5:7b
      LLM_TIMEOUT_SECONDS: "900"
      OLLAMA_TIMEOUT_SECONDS: "900"
      OLLAMA_NUM_CTX: "4096"
      OLLAMA_NUM_PREDICT: "4096"
      BAMO_BLENDER_SAMPLES: "16"
      BAMO_BLENDER_RESOLUTION_PERCENTAGE: "50"
      BAMO_BLENDER_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core blender
      - name: Cache local Qwen weights
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-qwen2.5-7b-v1-${{ runner.os }}
      - name: Start local CPU language model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/bamo-ollama.log 2>&1 &)
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:7b
      - name: Direct and render three domains
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/render_ai_domain_proof.py
      - name: Upload MP4 and AI scene graphs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BAMO-ai-three-domain-${{ github.run_id }}
          path: output/bamo-ai-three-domain/
          retention-days: 7
          if-no-files-found: warn
