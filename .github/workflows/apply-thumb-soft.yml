name: Soft-fail private thumbnail
on:
  workflow_dispatch:
  push:
    branches: ["feat/openclaw-autonomous-manager-v2"]
    paths: ["scripts/patch_thumbnail_soft_fail.py", ".github/workflows/apply-thumb-soft.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_thumbnail_soft_fail.py
      - run: |
          git config user.name "openclaw-fix-bot"
          git config user.email "openclaw-fix-bot@users.noreply.github.com"
          git add app/youtube_client.py
          if git diff --cached --quiet; then echo noop; else git commit -m "fix: keep private upload when thumbnail quota exceeded" && git push; fi
