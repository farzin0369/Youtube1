name: Python regression tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg and Persian fonts needed by tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

  colab-render:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/eleven-agent-youtube-integration' }}
    uses: ./.github/workflows/colab_cli_gpu.yml
    secrets: inherit
