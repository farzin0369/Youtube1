name: Python regression tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install system Python, D-Bus, GObject introspection, FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-venv python3-gi gir1.2-glib-2.0 dbus-x11 ffmpeg fonts-noto-core
      - name: Create venv using system Python so PyGObject ABI matches
        run: /usr/bin/python3 -m venv --system-site-packages .venv
      - name: Install compatible build tooling and dependencies
        run: |
          .venv/bin/python -m pip install --upgrade pip "setuptools<81" wheel
          .venv/bin/python -m pip install -r requirements.txt pytest
      - name: Run regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}:/usr/lib/python3/dist-packages
        run: .venv/bin/python -m pytest -q
