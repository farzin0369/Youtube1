name: Python regression tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg and Persian fonts needed by tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Syntax-check GPU and TTS scripts
        run: |
          python -m py_compile scripts/validate_video_quality.py scripts/natural_tts_persian.py scripts/finish_gpu_short.py scripts/colab_render_minimal.py
      - name: Exercise video quality gate on a synthetic moving clip
        run: |
          ffmpeg -y -v error -f lavfi -i testsrc2=size=720x1280:rate=24 -t 8 -an -c:v libx264 -preset ultrafast -crf 30 -pix_fmt yuv420p /tmp/qa-motion.mp4
          python scripts/validate_video_quality.py /tmp/qa-motion.mp4
      - name: Run regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
