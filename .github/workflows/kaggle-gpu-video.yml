name: ImamAli110 cinematic GPU video

on:
  schedule:
    # 05:35 Tehran = 02:05 UTC
    - cron: "5 2 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: Video type
        required: true
        default: short
        type: choice
        options: [short, long]

permissions:
  contents: read

concurrency:
  group: imamali110-kaggle-gpu
  cancel-in-progress: false

jobs:
  launch-kaggle-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Kaggle CLI
        run: python -m pip install --upgrade kaggle
      - name: Configure Kaggle API credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "::error::Add repository Actions secrets KAGGLE_USERNAME and KAGGLE_KEY first."
            exit 1
          fi
          echo "KAGGLE_USERNAME=$KAGGLE_USERNAME" >> "$GITHUB_ENV"
          echo "KAGGLE_KEY=$KAGGLE_KEY" >> "$GITHUB_ENV"
      - name: Prepare GPU kernel
        env:
          VIDEO_KIND: ${{ inputs.kind || 'short' }}
        run: |
          mkdir -p "$RUNNER_TEMP/kaggle-kernel"
          cp kaggle/kernel.py "$RUNNER_TEMP/kaggle-kernel/kernel.py"
          sed "s/KAGGLE_USERNAME/$KAGGLE_USERNAME/" kaggle/kernel-metadata.template.json > "$RUNNER_TEMP/kaggle-kernel/kernel-metadata.json"
          # Add the kind to the script environment without embedding credentials.
          sed -i "1i import os\nos.environ['VIDEO_KIND'] = '${VIDEO_KIND}'" "$RUNNER_TEMP/kaggle-kernel/kernel.py"
          cat "$RUNNER_TEMP/kaggle-kernel/kernel-metadata.json"
      - name: Push and run Kaggle GPU kernel
        working-directory: ${{ runner.temp }}/kaggle-kernel
        run: kaggle kernels push -p .
