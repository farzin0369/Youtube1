name: Colab photoreal story (SDXL + natural TTS)

# Secret: COLAB_CLI_TOKEN_JSON

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Check Colab token
        id: check
        run: |
          if [ -n "${{ secrets.COLAB_CLI_TOKEN_JSON }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Missing COLAB_CLI_TOKEN_JSON"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Install Colab CLI
        if: steps.check.outputs.ok == 'true'
        run: pip install -q google-colab-cli

      - name: Restore token
        if: steps.check.outputs.ok == 'true'
        env:
          COLAB_CLI_TOKEN_JSON: ${{ secrets.COLAB_CLI_TOKEN_JSON }}
        run: |
          mkdir -p ~/.config/colab-cli
          printf '%s' "$COLAB_CLI_TOKEN_JSON" > ~/.config/colab-cli/token.json
          chmod 600 ~/.config/colab-cli/token.json

      - name: Free sessions
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        run: |
          mkdir -p output/colab_photo
          colab sessions 2>&1 | tee output/colab_photo/sessions.txt || true
          colab sessions 2>/dev/null | awk '{print $1}' | while read -r s; do
            case "$s" in SESSION|Name|----*|"") continue ;; esac
            colab stop -s "$s" 2>&1 || true
          done
          sleep 12

      - name: GPU photoreal render
        if: steps.check.outputs.ok == 'true'
        id: gpu
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p output/colab_photo
          SESSION="photo-$(date +%s)"
          echo "SESSION=$SESSION" | tee output/colab_photo/run.log
          ok=0
          for attempt in 1 2 3; do
            if colab new -s "$SESSION" --gpu T4 2>&1 | tee -a output/colab_photo/run.log; then
              ok=1
              break
            fi
            sleep 25
            SESSION="photo-$(date +%s)-$attempt"
          done
          if [ "$ok" != "1" ]; then
            echo "allocate failed" | tee -a output/colab_photo/run.log
            exit 1
          fi

          # Install deps via stdin (no -c flag on this CLI version)
          printf '%s\n' \
            'import subprocess,sys' \
            'subprocess.check_call([sys.executable,"-m","pip","install","-q","diffusers==0.32.2","transformers","accelerate","safetensors","edge-tts","nest_asyncio"])' \
            'print("deps_ok")' \
            | colab exec -s "$SESSION" --timeout 900 2>&1 | tee -a output/colab_photo/run.log || true

          set +e
          colab exec -s "$SESSION" -f scripts/colab_photoreal_story.py --timeout 3300 2>&1 | tee -a output/colab_photo/run.log
          set -e

          colab download -s "$SESSION" /content/final_story.mp4 output/colab_photo/final_story.mp4 2>&1 | tee -a output/colab_photo/run.log || true
          colab download -s "$SESSION" /content/video_raw.mp4 output/colab_photo/video_raw.mp4 2>&1 | tee -a output/colab_photo/run.log || true
          colab stop -s "$SESSION" 2>&1 | tee -a output/colab_photo/run.log || true
          ls -la output/colab_photo/ || true

      - name: QA
        if: steps.check.outputs.ok == 'true'
        run: |
          if [ -f output/colab_photo/final_story.mp4 ]; then
            ls -la output/colab_photo/final_story.mp4
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/colab_photo/final_story.mp4 || true
          elif [ -f output/colab_photo/video_raw.mp4 ]; then
            echo "only video_raw"
            ls -la output/colab_photo/
          else
            echo "no video"
            tail -n 120 output/colab_photo/run.log || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always() && steps.check.outputs.ok == 'true'
        with:
          name: colab-photoreal
          path: output/colab_photo/
          if-no-files-found: warn
