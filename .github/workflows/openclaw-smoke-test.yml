name: OpenClaw cloud model smoke test

on:
  workflow_dispatch:
  push:
    branches: ["feat/openclaw-autonomous-manager"]
    paths:
      - "vendor/openclaw/package.json"
      - ".github/workflows/openclaw-smoke-test.yml"
      - "docs/OPENCLAW_AUTONOMOUS_MANAGER.md"
      - "app/llm_provider.py"
      - "tests/test_llm_provider_cloud_only.py"
      - "config/channel.yaml"
      - ".github/workflows/daily_run.yml"

permissions:
  contents: read

concurrency:
  group: openclaw-cloud-smoke
  cancel-in-progress: false

jobs:
  cloud-model-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify imported OpenClaw source
        shell: bash
        run: |
          set -euo pipefail
          test -f vendor/openclaw/package.json
          node -e "const p=require('./vendor/openclaw/package.json'); if(p.name!=='openclaw') process.exit(1); console.log('OpenClaw package:', p.name, p.version)"
          test -f vendor/openclaw/openclaw.mjs

      - name: Require cloud credentials without revealing them
        run: |
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "::error::GROQ_API_KEY repository secret is missing. Add it in Settings > Secrets and variables > Actions. The secret value must not be printed."
            exit 1
          fi
          echo "Groq credential presence check passed."

      - name: Test cloud-only provider policy
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run focused provider regression tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_llm_provider_cloud_only.py

      - name: Install OpenClaw CLI and official Groq provider
        run: |
          npm install --global openclaw@latest
          openclaw --help >/dev/null
          openclaw plugins install npm:@openclaw/groq-provider --accept-capabilities --acknowledge-install-policy-warning

      - name: Configure and validate cloud model
        run: |
          openclaw config set agents.defaults.model.primary "groq/openai/gpt-oss-20b"
          openclaw config validate

      - name: Run a real OpenClaw cloud completion
        shell: bash
        run: |
          set -euo pipefail
          openclaw agent exec --model groq/openai/gpt-oss-20b --json "Reply with exactly this marker and nothing else: OPENCLAW_CLOUD_MODEL_OK" > "${RUNNER_TEMP}/openclaw-result.json"
          if ! grep -q "OPENCLAW_CLOUD_MODEL_OK" "${RUNNER_TEMP}/openclaw-result.json"; then
            echo "::error::OpenClaw exited without the expected cloud completion marker."
            echo "Sanitized result follows (no environment or credential values):"
            head -c 3000 "${RUNNER_TEMP}/openclaw-result.json"
            exit 1
          fi
          echo "PASS: OpenClaw returned the expected marker from the configured Groq cloud model."

      - name: Upload sanitized OpenClaw result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-cloud-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/openclaw-result.json
          if-no-files-found: ignore
          retention-days: 3
