name: OpenClaw cloud model smoke test

on:
  workflow_dispatch:
  push:
    branches: ["feat/**", "fix/**"]
    paths:
      - "vendor/openclaw/package.json"
      - ".github/workflows/openclaw-smoke-test.yml"
      - ".github/workflows/daily_run.yml"
      - "docs/OPENCLAW_AUTONOMOUS_MANAGER.md"
      - "app/llm_provider.py"
      - "app/spiritual_shorts.py"
      - "scripts/openclaw_manager.py"
      - "tests/test_llm_provider_cloud_only.py"
      - "tests/test_openclaw_manager.py"
      - "config/channel.yaml"

permissions:
  contents: read

concurrency:
  group: openclaw-cloud-smoke
  cancel-in-progress: false

jobs:
  cloud-model-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run cloud-only and manager unit tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_llm_provider_cloud_only.py tests/test_openclaw_manager.py

      - name: Require cloud credentials without revealing them
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare Workers AI credentials are configured."
          elif [ -n "${GROQ_API_KEY:-}" ] || [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "A cloud credential is configured."
          else
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, or a working Groq/OpenAI key."
            exit 1
          fi

      - name: Test Cloudflare Workers AI API directly
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"].strip()
          token = os.environ["CLOUDFLARE_API_TOKEN"].strip()
          url = f"https://api.cloudflare.com/client/v4/accounts/{account}/ai/run/@cf/meta/llama-3.1-8b-instruct-fast"
          body = json.dumps({"messages":[{"role":"user","content":"Reply with exactly CLOUDFLARE_WORKERS_AI_OK"}]}).encode()
          req = urllib.request.Request(url, data=body, headers={"Authorization":f"Bearer {token}","Content-Type":"application/json"}, method="POST")
          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = json.loads(response.read().decode())
          except urllib.error.HTTPError as exc:
              print(f"Cloudflare Workers AI request failed with HTTP {exc.code}; response body redacted.")
              raise SystemExit(1)
          except Exception as exc:
              print(f"Cloudflare Workers AI request failed: {type(exc).__name__}; details withheld.")
              raise SystemExit(1)
          if not payload.get("success"):
              print("Cloudflare Workers AI returned success=false; response details withheld.")
              raise SystemExit(1)
          result = payload.get("result") or {}
          answer = result.get("response") or result.get("content") or ""
          if "CLOUDFLARE_WORKERS_AI_OK" not in str(answer):
              print("Cloudflare Workers AI returned a response but not the expected marker.")
              raise SystemExit(1)
          print("PASS: Cloudflare Workers AI accepted the repository secrets and returned the expected marker.")
          PY

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify imported OpenClaw source
        shell: bash
        run: |
          set -euo pipefail
          test -f vendor/openclaw/package.json
          node -e "const p=require('./vendor/openclaw/package.json'); if(p.name!=='openclaw') process.exit(1); console.log('OpenClaw package:', p.name, p.version)"
          test -f vendor/openclaw/openclaw.mjs

      - name: Select cloud provider and model
        id: model
        shell: bash
        run: |
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "provider=cloudflare" >> "$GITHUB_OUTPUT"
            echo "model=cloudflare/@cf/meta/llama-3.1-8b-instruct-fast" >> "$GITHUB_OUTPUT"
          elif [ -n "${GROQ_API_KEY:-}" ]; then
            echo "model=groq/openai/gpt-oss-20b" >> "$GITHUB_OUTPUT"
            echo "provider=groq" >> "$GITHUB_OUTPUT"
          else
            echo "model=openai/gpt-5.5" >> "$GITHUB_OUTPUT"
            echo "provider=openai" >> "$GITHUB_OUTPUT"
          fi

      - name: Install OpenClaw CLI and selected provider
        run: |
          npm install --global openclaw@2026.10.3
          openclaw --help >/dev/null
          if [ "${{ steps.model.outputs.provider }}" = "groq" ]; then
            openclaw plugins install npm:@openclaw/groq-provider --accept-capabilities --acknowledge-install-policy-warning
          fi

      - name: Configure and validate cloud model
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.model.outputs.provider }}" = "cloudflare" ]; then
            provider_json="$(python - <<'PY'
          import json
          print(json.dumps({
            "baseUrl": "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1",
            "apiKey": {"source": "env", "provider": "default", "id": "CLOUDFLARE_API_TOKEN"},
            "api": "openai-completions",
            "models": [{
              "id": "@cf/meta/llama-3.1-8b-instruct-fast",
              "name": "Cloudflare Workers AI Llama 3.1 8B",
              "reasoning": False,
              "input": ["text"],
              "cost": {"input": 0, "output": 0, "cacheRead": 0, "cacheWrite": 0},
              "contextWindow": 131072,
              "maxTokens": 4096,
              "compat": {"requiresStringContent": True, "supportsTools": False}
            }]
          }))
          PY
          )"
            openclaw config set models.providers.cloudflare "$provider_json" --strict-json --merge
          fi
          openclaw config set agents.defaults.model.primary "${{ steps.model.outputs.model }}"
          openclaw config validate

      - name: Run a real OpenClaw cloud completion
        shell: bash
        run: |
          set -euo pipefail
          openclaw agent exec --model "${{ steps.model.outputs.model }}" --timeout 120 --json "Reply with exactly this marker and nothing else: OPENCLAW_CLOUD_MODEL_OK" > "${RUNNER_TEMP}/openclaw-result.json"
          if ! grep -q "OPENCLAW_CLOUD_MODEL_OK" "${RUNNER_TEMP}/openclaw-result.json"; then
            echo "::error::OpenClaw exited without the expected cloud completion marker."
            head -c 3000 "${RUNNER_TEMP}/openclaw-result.json"
            exit 1
          fi
          echo "PASS: OpenClaw returned the expected cloud completion marker."

      - name: Run the real OpenClaw editorial manager
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || secrets.OPENAI_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENCLAW_MODEL: ${{ steps.model.outputs.model }}
        run: python scripts/openclaw_manager.py

      - name: Upload sanitized OpenClaw result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-cloud-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/openclaw-result.json
            state/openclaw_brief.json
          if-no-files-found: ignore
          retention-days: 3
