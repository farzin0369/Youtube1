name: No-key Persian spiritual preview (no publishing)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/no-key-spiritual-preview
    paths:
      - "scripts/no_key_spiritual_preview.py"
      - ".github/workflows/no-key-spiritual-preview.yml"

permissions:
  contents: read

concurrency:
  group: imamali-no-key-preview-v2
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install preview dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow edge-tts
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-extra
      - name: Verify Persian text layout support
        run: |
          python - <<'PY'
          from PIL import features
          print("RAQM:", features.check("raqm"))
          if not features.check("raqm"):
              raise SystemExit("Pillow RAQM is required for correct Persian text shaping.")
          PY
      - name: Render a Persian story without API keys
        run: python scripts/no_key_spiritual_preview.py
      - name: Validate MP4
        run: |
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of json output/no_key_preview/imamali110_no_key_preview.mp4
          python -c "import json; d=json.load(open('output/no_key_preview/preview_manifest.json', encoding='utf-8')); assert d['published'] is False; print('Preview validated; publishing is disabled.')"
      - name: Run hard technical quality gate
        run: python scripts/validate_preview.py
      - name: Upload preview, script, credits, and QC report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imamali110-no-key-preview-${{ github.run_id }}
          path: output/no_key_preview/
          retention-days: 7
          if-no-files-found: warn

      - name: Enforce visual quality gate (preview artifact is retained)
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("output/no_key_preview/quality_report.json")
          if not p.exists():
              print("QUALITY_GATE=FAIL: report missing")
              sys.exit(1)
          q = json.loads(p.read_text(encoding="utf-8"))
          print("QUALITY_GATE=" + q["status"])
          print(q["reason"])
          if q["status"] == "REJECTED_NOT_FOR_PUBLISHING":
              print("Preview artifact was retained for inspection; visual gate rejected this preview.")
              sys.exit(1)
          if q["status"] != "PASS_PREVIEW_ONLY":
              print("QUALITY_GATE=FAIL: unexpected status")
              sys.exit(1)
          print("PREVIEW_ONLY: technical preview may be reviewed; publishing approval remains false.")
          PY
