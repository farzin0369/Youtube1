name: BAMO — automated daily Shorts production and publishing

on:
  # Six daily Tehran publication slots: 07:00, 10:00, 12:00, 15:00, 18:00, 21:00.
  # GitHub schedule uses UTC: 03:30, 06:30, 08:30, 11:30, 14:30, 17:30.
  schedule:
    - cron: "30 3 * * *"
    - cron: "30 6 * * *"
    - cron: "30 8 * * *"
    - cron: "30 11 * * *"
    - cron: "30 14 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Upload and schedule publicly for the next configured Tehran slot
        required: true
        type: boolean
        default: false
      upload_private:
        description: Upload a private draft now (never publish publicly)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bamo-automated-daily
  cancel-in-progress: false

jobs:
  produce:
    if: github.event_name != 'schedule' || vars.BAMO_PRODUCTION_VISUALS_APPROVED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BAMO_PRODUCTION_VISUALS_APPROVED: ${{ vars.BAMO_PRODUCTION_VISUALS_APPROVED || 'false' }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
      BAMO_AGENT_CONCURRENCY: "4"
      BAMO_AGENT_TIMEOUT_SECONDS: "90"
      LLM_TIMEOUT_SECONDS: "180"
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TTS_PROVIDER: edge-tts
      TTS_VOICE: fa-IR-FaridNeural
      CHANNEL_BRAND: BAMO
      CHANNEL_HISTORY_PATH: state/history.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run automated regression tests before production
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
      - name: Install FFmpeg and Persian fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core blender
      - name: Restore bounded channel history and reply ledger
        uses: actions/cache@v4
        with:
          path: state/
          key: bamo-channel-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bamo-channel-state-
      - name: Initialize state files
        run: |
          mkdir -p state output logs
          test -f state/history.json || printf '{"recent": []}\n' > state/history.json
          test -f state/comment_replies.json || printf '{"replied": {}}\n' > state/comment_replies.json
      - name: Text model
        run: echo "Text uses free Groq when configured, otherwise anonymous Pollinations; paid gateways and local model services are disabled."
      - name: Verify YouTube credentials before any production work
        if: github.event_name == 'schedule' || inputs.publish == true || inputs.upload_private == true
        run: |
          python - <<'PY'
          from app.youtube_client import probe_youtube_auth
          result = probe_youtube_auth()
          if not result.get("ok"):
              print("YouTube OAuth preflight failed; no video will be rendered or uploaded.")
              raise SystemExit(1)
          print("YouTube OAuth preflight passed.")
          PY
      - name: Run BAMO CPU 3D motion-graphics pipeline
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$PUBLISH_INPUT" = "true" ]; then
            python scripts/daily_run.py --publish
          elif [ "${{ inputs.upload_private }}" = "true" ]; then
            python scripts/daily_run.py --upload-private
          else
            python scripts/daily_run.py --dry-run
          fi
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bamo-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/spiritual/
            state/
            logs/
          retention-days: 3
          if-no-files-found: warn
