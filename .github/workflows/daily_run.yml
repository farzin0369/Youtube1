name: Persian spiritual channel — daily Shorts

on:
  # Start at exactly 18:00 Tehran (14:30 UTC); generate the next day's 18:00 episode.
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Upload and schedule publicly for 18:00 Tehran
        required: true
        type: boolean
        default: false
      upload_private:
        description: Upload a private draft now (never publish publicly)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: persian-spiritual-daily
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_TIMEOUT_SECONDS: "180"
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      WEAVE_API_TOKEN: ${{ secrets.WEAVE_API_TOKEN }}
      WEAVE_TOOL_ID: ${{ vars.WEAVE_TOOL_ID }}
      WEAVE_AUTO_RUN: ${{ vars.WEAVE_AUTO_RUN || 'false' }}
      WEAVE_MAX_CREDIT_COST: ${{ vars.WEAVE_MAX_CREDIT_COST || '0' }}
      WEAVE_POLL_TIMEOUT_SECONDS: "600"
      WEAVE_POLL_INTERVAL_SECONDS: "5"
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'edge-tts' }}
      TTS_VOICE: fa-IR-FaridNeural
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID || 'eleven_v4' }}
      ELEVENLABS_STABILITY: ${{ vars.ELEVENLABS_STABILITY || '0.5' }}
      ELEVENLABS_SIMILARITY: ${{ vars.ELEVENLABS_SIMILARITY || '0.75' }}
      CHANNEL_BRAND: ImamAli110
      LOCAL_LLM_MODEL: qwen2.5:7b
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_TIMEOUT_SECONDS: "600"
      OLLAMA_NUM_PREDICT: "4096"
      OLLAMA_NUM_CTX: "4096"
      OLLAMA_KEEP_ALIVE: "1800"
      CHANNEL_HISTORY_PATH: state/history.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run automated regression tests before production
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
      - name: Install FFmpeg and Persian fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
      - name: Restore bounded channel history and reply ledger
        uses: actions/cache@v4
        with:
          path: state/
          key: persian-growth-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            persian-growth-state-
      - name: Initialize state files
        run: |
          mkdir -p state output logs
          test -f state/history.json || printf '{"recent": []}\n' > state/history.json
          test -f state/comment_replies.json || printf '{"replied": {}}\n' > state/comment_replies.json
      - name: Install and warm local free LLM fallback for API limits/outages
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > "${RUNNER_TEMP}/ollama.log" 2>&1 &)
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull "$LOCAL_LLM_MODEL"
      - name: Verify YouTube credentials before any production work
        if: github.event_name == 'schedule' || inputs.publish == true || inputs.upload_private == true
        run: |
          python - <<'PY'
          from app.youtube_client import probe_youtube_auth
          result = probe_youtube_auth()
          if not result.get("ok"):
              print("YouTube OAuth preflight failed; no video will be rendered or uploaded.")
              raise SystemExit(1)
          print("YouTube OAuth preflight passed.")
          PY
      - name: Run Persian spiritual video pipeline
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ] || [ "$PUBLISH_INPUT" = "true" ]; then
            python scripts/daily_run.py --publish
          elif [ "${{ inputs.upload_private }}" = "true" ]; then
            python scripts/daily_run.py --upload-private
          else
            python scripts/daily_run.py --dry-run
          fi
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persian-spiritual-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/spiritual/
            state/
            logs/
          retention-days: 3
          if-no-files-found: warn
