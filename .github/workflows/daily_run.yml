name: BAMO — daily production preview (approval required)

on:
  # Daily 18:00 Tehran production slot; scheduled runs create review artifacts only.
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: Explicitly approve uploading and scheduling this video publicly
        required: true
        type: boolean
        default: false
      upload_private:
        description: Upload a private draft now for review (never publish publicly)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bamo-daily-production
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_TIMEOUT_SECONDS: "180"
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'edge-tts' }}
      TTS_VOICE: fa-IR-FaridNeural
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
      ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID || 'eleven_v4' }}
      ELEVENLABS_STABILITY: ${{ vars.ELEVENLABS_STABILITY || '0.5' }}
      ELEVENLABS_SIMILARITY: ${{ vars.ELEVENLABS_SIMILARITY || '0.75' }}
      CHANNEL_BRAND: BAMO
      LOCAL_LLM_MODEL: qwen2.5:7b
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      OLLAMA_TIMEOUT_SECONDS: "600"
      OLLAMA_NUM_PREDICT: "4096"
      OLLAMA_NUM_CTX: "4096"
      OLLAMA_KEEP_ALIVE: "1800"
      CHANNEL_HISTORY_PATH: state/history.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run automated regression tests before production
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
      - name: Install FFmpeg and Persian fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
      - name: Restore bounded channel history and reply ledger
        uses: actions/cache@v4
        with:
          path: state/
          key: bamo-production-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bamo-production-state-
      - name: Initialize state files
        run: |
          mkdir -p state output logs
          test -f state/history.json || printf '{"recent": []}\n' > state/history.json
          test -f state/comment_replies.json || printf '{"replied": {}}\n' > state/comment_replies.json
      - name: Verify YouTube credentials only for an explicitly approved upload
        if: inputs.publish == true || inputs.upload_private == true
        run: |
          python - <<'PY'
          from app.youtube_client import probe_youtube_auth
          result = probe_youtube_auth()
          if not result.get("ok"):
              print("YouTube OAuth preflight failed; no video will be uploaded.")
              raise SystemExit(1)
          print("YouTube OAuth preflight passed.")
          PY
      - name: Run BAMO video pipeline
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
          PRIVATE_INPUT: ${{ inputs.upload_private }}
        run: |
          if [ "$PUBLISH_INPUT" = "true" ]; then
            python scripts/daily_run.py --publish
          elif [ "$PRIVATE_INPUT" = "true" ]; then
            python scripts/daily_run.py --upload-private
          else
            python scripts/daily_run.py --dry-run
          fi
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bamo-production-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/spiritual/
            state/
            logs/
          retention-days: 7
          if-no-files-found: warn
