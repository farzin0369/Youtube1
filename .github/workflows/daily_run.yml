name: LTX-Video production readiness (GPU rendering runs in Colab)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ltx-production-readiness
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg and Persian fonts for validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q
      - name: Report GPU availability without starting production
        run: |
          if command -v nvidia-smi >/dev/null 2>&1 && nvidia-smi -L; then
            echo "GPU detected. Production still requires the Colab GPU notebook or a configured GPU runner."
          else
            echo "::notice::GitHub-hosted runner has no CUDA GPU. No render or upload was attempted. Use colab/ImamAli110_Cinematic_Production.ipynb for LTX-Video."
          fi
