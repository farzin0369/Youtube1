name: Apply test duration fix
on:
  workflow_dispatch:
  push:
    branches: ["feat/openclaw-autonomous-manager-v2"]
    paths: ["scripts/patch_test_duration.py", ".github/workflows/apply-test-duration.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_test_duration.py
      - run: |
          git config user.name "openclaw-fix-bot"
          git config user.email "openclaw-fix-bot@users.noreply.github.com"
          git add tests/test_media_qa.py
          if git diff --cached --quiet; then echo noop; else git commit -m "test: duration floor 10s for 12-45 gate" && git push; fi
