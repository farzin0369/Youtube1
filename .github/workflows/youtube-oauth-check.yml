name: YouTube OAuth preflight (no publishing)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oauth-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OAuth probe dependencies
        run: python -m pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 PyYAML
      - name: Validate YouTube OAuth without uploading
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          from app.youtube_client import probe_youtube_auth

          names = ("YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN")
          values = {name: (os.environ.get(name) or "").strip() for name in names}
          missing = [name for name, value in values.items() if not value]
          if missing:
              print("::error::Missing required GitHub Actions secrets: " + ", ".join(missing))
              sys.exit(1)
          os.environ.update(values)
          result = probe_youtube_auth()
          if not result.get("ok"):
              message = str(result.get("error") or "unknown OAuth error")
              for value in values.values():
                  message = message.replace(value, "[REDACTED]")
              print("::error::YouTube OAuth preflight failed: " + message)
              sys.exit(1)
          print("YouTube OAuth preflight passed; authenticated channel: "
                + str(result.get("title") or "(title unavailable)")
                + " (" + str(result.get("channel_id") or "channel ID unavailable") + ")")
          print("No video was uploaded or published.")
          PY
