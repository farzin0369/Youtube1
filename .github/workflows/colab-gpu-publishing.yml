name: ImamAli110 autonomous Colab GPU publishing

on:
  schedule:
    # Asia/Tehran: 06:00, 09:00, 18:00 (Iran is UTC+03:30).
    - cron: "30 2 * * *"
    - cron: "30 5 * * *"
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imamali110-colab-gpu-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

jobs:
  cinematic-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Restore bounded agent memory
        uses: actions/cache@v4
        with:
          path: state/agent_memory.json
          key: imamali110-agent-memory-${{ github.run_id }}
          restore-keys: |
            imamali110-agent-memory-

      - name: Initialize memory when this is the first run
        run: |
          mkdir -p state
          if [ ! -s state/agent_memory.json ]; then
            printf '%s\n' '{"schema_version":1,"editorial_lessons":[],"runs":[]}' > state/agent_memory.json
          fi

      - name: Install Colab CLI
        run: python -m pip install --upgrade google-colab-cli

      - name: Configure Colab CLI account session
        env:
          COLAB_CLI_TOKEN_JSON: ${{ secrets.COLAB_CLI_TOKEN_JSON }}
        run: |
          if [ -z "$COLAB_CLI_TOKEN_JSON" ]; then
            echo "::error::Colab CLI OAuth is not configured. Add COLAB_CLI_TOKEN_JSON containing the authenticated Colab CLI token.json; the runner will not bypass Google sign-in."
            exit 1
          fi
          mkdir -p "$HOME/.config/colab-cli"
          printf '%s' "$COLAB_CLI_TOKEN_JSON" > "$HOME/.config/colab-cli/token.json"
          chmod 600 "$HOME/.config/colab-cli/token.json"
          colab sessions || true

      - name: Validate YouTube publishing credentials
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ -z "$YOUTUBE_CLIENT_ID" ] || [ -z "$YOUTUBE_CLIENT_SECRET" ] || [ -z "$YOUTUBE_REFRESH_TOKEN" ]; then
            echo "::error::The existing YouTube OAuth secrets are incomplete. No video will be generated or published."
            exit 1
          fi

      - name: Create a temporary protected credential payload
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PIPELINE_RUN_ID: short_${{ github.run_id }}_${{ github.run_attempt }}
          LOCAL_LLM_MODEL: llama3.2:3b
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          target = Path(os.environ["RUNNER_TEMP"]) / "imamali-secrets.json"
          payload = {key: os.environ.get(key, "") for key in (
              "YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN",
              "PIPELINE_RUN_ID", "LOCAL_LLM_MODEL"
          )}
          target.write_text(json.dumps(payload), encoding="utf-8")
          target.chmod(0o600)
          PY
          chmod 600 state/agent_memory.json

      - name: Provision Colab T4 GPU runtime
        env:
          SESSION: imamali-${{ github.run_id }}
        run: colab new --gpu T4 -s "$SESSION"

      - name: Transfer protected job inputs to the private runtime
        env:
          SESSION: imamali-${{ github.run_id }}
        run: |
          colab upload -s "$SESSION" "$RUNNER_TEMP/imamali-secrets.json" /content/.imamali110-secrets.json
          colab upload -s "$SESSION" state/agent_memory.json /content/.imamali110-agent-memory.json

      - name: Run local-model self-review and cinematic video pipeline on Colab GPU
        env:
          SESSION: imamali-${{ github.run_id }}
        run: colab exec -s "$SESSION" -f scripts/colab_agent_job.py

      - name: Retrieve result and updated agent memory
        if: always()
        env:
          SESSION: imamali-${{ github.run_id }}
        run: |
          colab download -s "$SESSION" /tmp/colab-result.json "$RUNNER_TEMP/colab-result.json" || true
          colab download -s "$SESSION" /tmp/agent-memory.json state/agent_memory.json || true
          if [ -f "$RUNNER_TEMP/colab-result.json" ]; then
            cat "$RUNNER_TEMP/colab-result.json"
          fi

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imamali110-colab-run-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/colab-result.json
            state/agent_memory.json
          if-no-files-found: warn
          retention-days: 30

      - name: Stop Colab GPU runtime
        if: always()
        env:
          SESSION: imamali-${{ github.run_id }}
        run: colab stop -s "$SESSION" || true
