name: Figma Weave integration tests

on:
  push:
    branches:
      - feat/figma-weave-media-integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run Weave adapter tests
        env:
          PYTHONPATH: ${{ github.workspace }}
          WEAVE_AUTO_RUN: "false"
          WEAVE_MAX_CREDIT_COST: "0"
        run: python -m pytest -q tests/test_weave_client.py
