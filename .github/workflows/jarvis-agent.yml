name: Jarvis Agent
on:
  push:
    branches:
      - feat/jarvis-chat-openrouter-integration
    paths:
      - 'jarvis/**'
      - '.github/workflows/jarvis-agent.yml'
  workflow_dispatch:
    inputs:
      prompt:
        description: "پیام برای Jarvis"
        required: true
        default: "سلام جارویس"
        type: string
      history:
        description: "سابقه گفتگو به JSON"
        required: false
        default: "[]"
        type: string
permissions:
  contents: read
  checks: write
concurrency:
  group: jarvis-chat-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: jarvis/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r jarvis/requirements.txt
      - name: Ask Jarvis
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROMPT: ${{ inputs.prompt }}
          HISTORY: ${{ inputs.history }}
        run: |
          set -euo pipefail
          python jarvis/main.py > response.txt
          test -s response.txt
          cat response.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Publish response for chat
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const response = fs.readFileSync('response.txt', 'utf8');
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Jarvis response',
              head_sha: context.sha,
              external_id: String(context.runId),
              status: 'completed',
              conclusion: 'success',
              output: { title: 'پاسخ Jarvis', summary: '## پاسخ Jarvis\n\n' + response }
            });
