name: Automation self-test

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Python syntax check
        run: python -m compileall -q app scripts
      - name: Run unit tests
        run: python -m pytest -q
      - name: Verify automation files
        run: |
          test -f app/pipeline.py
          test -f tests/test_news_research.py
          test -f tests/test_agent_guard.py
          test -f app/scene_plan.py
          test -f app/media_qa.py
          test -f app/video_render.py
          test -f app/youtube_client.py
          test -f app/channel_ops.py
          test -f scripts/daily_health_report.py
          test -f scripts/smoke_render.py
          test -f scripts/collect_news.py
          test -f .github/workflows/news-research-check.yml
          test -f scripts/repair_colab_cogvideox.py
          test -f .github/workflows/daily-youtube.yml
          test -f .github/workflows/channel-health.yml
          test -f .github/workflows/youtube-oauth-check.yml
          test -f config/channel.yaml
          echo "TT Khabar news automation structure OK"
