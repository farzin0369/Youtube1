name: Automation self-test

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux D-Bus and GObject introspection runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-glib-2.0 dbus-x11
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install compatible build tooling
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Python syntax check
        run: python -m compileall -q app scripts
      - name: Run unit tests
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: python -m pytest -q
      - name: Verify automation files
        run: |
          test -f app/llm_provider.py
          test -f app/spiritual_content.py
          test -f app/spiritual_tts.py
          test -f app/spiritual_video.py
          test -f app/spiritual_pipeline.py
          test -f app/spiritual_comments.py
          test -f tests/test_content_generation.py
          test -f tests/test_spiritual_pipeline.py
          test -f app/youtube_client.py
          test -f scripts/daily_run.py
          test -f .github/workflows/daily_run.yml
          test -f .github/workflows/youtube-oauth-check.yml
          test -f config/channel.yaml
          echo "Persian spiritual daily automation structure OK"
