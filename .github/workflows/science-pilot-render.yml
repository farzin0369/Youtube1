name: Science pilot render (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-science-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libcairo2-dev libpango1.0-dev pkg-config python3-dev build-essential

      - name: Install render and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install manim pytest

      - name: Test the isolated idea bank
        run: python -m pytest -q tests/test_science_engine.py

      - name: Render low-quality preview
        run: manim -ql --disable_caching science_engine/renderers/vector_pilot.py VectorPilot

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: science-vector-pilot-preview
          path: |
            media/videos/vector_pilot/480p15/VectorPilot.mp4
            science_engine/pilots/vector_addition.md
          if-no-files-found: error
          retention-days: 7
