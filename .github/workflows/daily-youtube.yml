name: ImamAli110 daily video (Qwen)

on:
  schedule:
    # 05:35 Tehran = 02:05 UTC | 20:30 Tehran = 17:00 UTC
    - cron: "5 2 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: short or long
        required: true
        default: short
        type: choice
        options: [short, long]
      dry_run:
        description: Skip YouTube upload
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: imamali110-qwen-${{ github.event.schedule || inputs.kind || github.event_name }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core imagemagick
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt piper-tts
      - name: Download free Persian Piper voice
        run: |
          mkdir -p "${RUNNER_TEMP}/piper"
          curl -L --fail --retry 3 -o "${RUNNER_TEMP}/piper/fa_IR-amir-medium.onnx" https://huggingface.co/rhasspy/piper-voices/resolve/main/fa/fa_IR/amir/medium/fa_IR-amir-medium.onnx
          curl -L --fail --retry 3 -o "${RUNNER_TEMP}/piper/fa_IR-amir-medium.onnx.json" https://huggingface.co/rhasspy/piper-voices/resolve/main/fa/fa_IR/amir/medium/fa_IR-amir-medium.onnx.json
      - name: Generate daily video
        env:
          AI_ENGINE: qwen
          VIDEO_ENGINE: cpu
          # Qwen (Alibaba DashScope) — primary LLM; local script fallback works without API credits.
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          QWEN_API_BASE: ${{ secrets.QWEN_API_BASE }}
          QWEN_MODEL: ${{ secrets.QWEN_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          # Free, locally generated Persian narration: no OpenAI TTS credits needed.
          TTS_PROVIDER: edge
          TTS_VOICE: fa-IR-FaridNeural
          PIPER_MODEL: ${{ runner.temp }}/piper/fa_IR-amir-medium.onnx
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          KIND="${{ github.event.inputs.kind }}"
          if [ -z "$KIND" ]; then
            if [ "${{ github.event.schedule }}" = "0 17 * * *" ]; then KIND=long; else KIND=short; fi
          fi
          export QWEN_MODEL="${QWEN_MODEL:-qwen-plus}"
          export QWEN_API_BASE="${QWEN_API_BASE:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}"
          EXTRA=""
          # Scheduled runs publish; only a manual run with dry_run=true skips upload.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then EXTRA="--dry-run"; fi
          python -m app.pipeline --kind "$KIND" --publish-mode private $EXTRA
      - name: Upload audit/output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-output-${{ github.run_id }}
          path: output/
          retention-days: 14
