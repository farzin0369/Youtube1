name: Daily YouTube content

on:
  schedule:
    - cron: '30 2 * * *'
    - cron: '00 17 * * *'
  workflow_dispatch:
    inputs:
      kind:
        description: short or long
        required: true
        default: short
        type: choice
        options: [short, long]
      dry_run:
        description: Skip YouTube upload
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: youtube-content-${{ github.event.schedule || inputs.kind || 'manual' }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Generate content
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          TTS_PROVIDER: ${{ secrets.TTS_PROVIDER }}
          TTS_VOICE: ${{ secrets.TTS_VOICE }}
          TTS_MODEL: ${{ secrets.TTS_MODEL }}
        run: |
          KIND="${{ github.event.inputs.kind }}"
          if [ -z "$KIND" ]; then
            if [ "${{ github.event.schedule }}" = "30 2 * * *" ]; then KIND=short; else KIND=long; fi
          fi
          EXTRA=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then EXTRA="--dry-run"; fi
          python -m app.pipeline --kind "$KIND" --publish-mode private $EXTRA
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-output-${{ github.run_id }}
          path: output/
          retention-days: 14
