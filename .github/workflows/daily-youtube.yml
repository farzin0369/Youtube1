name: ImamAli110 manual CPU preview (not production)

on:
  workflow_dispatch:
    inputs:
      kind:
        description: short or long
        required: true
        default: short
        type: choice
        options: [short, long]
      dry_run:
        description: Skip YouTube upload
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: imamali110-manual-cpu-preview-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core imagemagick
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt piper-tts
      - name: Download free Persian Piper voice
        run: |
          mkdir -p "${RUNNER_TEMP}/piper"
          curl -L --fail --retry 3 -o "${RUNNER_TEMP}/piper/fa_IR-amir-medium.onnx" https://huggingface.co/rhasspy/piper-voices/resolve/main/fa/fa_IR/amir/medium/fa_IR-amir-medium.onnx
          curl -L --fail --retry 3 -o "${RUNNER_TEMP}/piper/fa_IR-amir-medium.onnx.json" https://huggingface.co/rhasspy/piper-voices/resolve/main/fa/fa_IR/amir/medium/fa_IR-amir-medium.onnx.json
      - name: Generate diagnostic preview
        env:
          AI_ENGINE: local
          LOCAL_LLM_MODEL: llama3.2:3b
          VIDEO_ENGINE: cpu
          TTS_PROVIDER: edge
          TTS_VOICE: fa-IR-FaridNeural
          PIPER_MODEL: ${{ runner.temp }}/piper/fa_IR-amir-medium.onnx
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          KIND="${{ github.event.inputs.kind }}"
          if [ -z "$KIND" ]; then KIND=short; fi
          EXTRA=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then EXTRA="--dry-run"; fi
          python -m app.pipeline --kind "$KIND" --publish-mode private $EXTRA
      - name: Upload audit/output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-cpu-diagnostic-${{ github.run_id }}
          path: output/
          retention-days: 14
