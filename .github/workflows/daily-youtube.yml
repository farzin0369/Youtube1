name: ImamAli110 cloud-free production

on:
  schedule:
    - cron: "5 2 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: short or long
        required: true
        default: short
        type: choice
        options: [short, long]
      dry_run:
        description: Skip YouTube upload
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: imamali110-cloud-${{ github.event.schedule || inputs.kind || github.event_name }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-core imagemagick
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Generate (quality path)
        env:
          AI_ENGINE: quality
          VIDEO_ENGINE: cpu
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o
          TTS_VOICE: onyx
          TTS_MODEL: tts-1-hd
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          KIND="${{ github.event.inputs.kind }}"
          if [ -z "$KIND" ]; then
            if [ "${{ github.event.schedule }}" = "0 17 * * *" ]; then KIND=long; else KIND=short; fi
          fi
          EXTRA=""
          if [ "${{ github.event.inputs.dry_run }}" != "false" ]; then EXTRA="--dry-run"; fi
          python -m app.pipeline --kind "$KIND" --publish-mode private $EXTRA
      - name: Upload audit/output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-output-${{ github.run_id }}
          path: output/
          retention-days: 14
