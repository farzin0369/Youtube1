name: ImamAli110 local AI production

on:
  schedule:
    - cron: "5 2 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: short or long
        required: true
        default: short
        type: choice
        options: [short, long]
      dry_run:
        description: Skip YouTube upload
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: imamali110-local-${{ github.event.schedule || inputs.kind || github.event_name }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify local AI stack
        run: |
          nvidia-smi
          command -v piper
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          test -n "${{ vars.PIPER_MODEL }}"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-local.txt
      - name: Generate and publish
        env:
          AI_ENGINE: local
          LOCAL_VIDEO_MODEL: THUDM/CogVideoX-2b
          LOCAL_LLM_MODEL: qwen2.5:7b
          PIPER_MODEL: ${{ vars.PIPER_MODEL }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          KIND="${{ github.event.inputs.kind }}"
          if [ -z "$KIND" ]; then
            if [ "${{ github.event.schedule }}" = "0 17 * * *" ]; then KIND=long; else KIND=short; fi
          fi
          EXTRA=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then EXTRA="--dry-run"; fi
          python -m app.pipeline --kind "$KIND" --publish-mode public $EXTRA
      - name: Upload audit/output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-output-${{ github.run_id }}
          path: output/
          retention-days: 14
