name: ImamAli110 cloud-free production

on:
  schedule:
    - cron: "5 2 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: short or long
        required: true
        default: short
        type: choice
        options: [short, long]
      dry_run:
        description: Skip YouTube upload
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: imamali110-cloud-${{ github.event.schedule || inputs.kind || github.event_name }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install free CPU AI stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt piper-tts
          mkdir -p "${RUNNER_TEMP}/piper"
          curl -L --fail --retry 3 -o "${RUNNER_TEMP}/piper/fa_IR-amir-medium.onnx" https://huggingface.co/rhasspy/piper-voices/resolve/main/fa/fa_IR/amir/medium/fa_IR-amir-medium.onnx
          curl -L --fail --retry 3 -o "${RUNNER_TEMP}/piper/fa_IR-amir-medium.onnx.json" https://huggingface.co/rhasspy/piper-voices/resolve/main/fa/fa_IR/amir/medium/fa_IR-amir-medium.onnx.json
          piper --help >/dev/null
          ffmpeg -version >/dev/null
      - name: Verify runner
        run: |
          echo "Runner: $RUNNER_NAME"
          python --version
          ffmpeg -version | head -1
      - name: Generate and publish
        env:
          AI_ENGINE: local
          VIDEO_ENGINE: cpu
          LOCAL_LLM_MODEL: qwen2.5:7b
          PIPER_MODEL: ${{ runner.temp }}/piper/fa_IR-amir-medium.onnx
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          KIND="${{ github.event.inputs.kind }}"
          if [ -z "$KIND" ]; then
            if [ "${{ github.event.schedule }}" = "0 17 * * *" ]; then KIND=long; else KIND=short; fi
          fi
          EXTRA=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then EXTRA="--dry-run"; fi
          python -m app.pipeline --kind "$KIND" --publish-mode public $EXTRA
      - name: Upload audit/output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-output-${{ github.run_id }}
          path: output/
          retention-days: 14
