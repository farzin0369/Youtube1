name: Daily YouTube content

on:
  schedule:
    # GitHub cron is UTC. Iran is UTC+3:30 year-round.
    - cron: '30 2 * * *'   # nominal 06:00 Asia/Tehran
    - cron: '00 17 * * *'  # nominal 20:30 Asia/Tehran
  workflow_dispatch:
    inputs:
      kind:
        description: short or long
        required: true
        default: short
        type: choice
        options: [short, long]

permissions:
  contents: read

concurrency:
  group: youtube-content-${{ github.event.schedule || inputs.kind || 'manual' }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate and upload as private/unlisted
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          TTS_PROVIDER: ${{ secrets.TTS_PROVIDER }}
        run: python -m app.pipeline --kind "${{ github.event.inputs.kind || (github.event.schedule == '30 2 * * *' && 'short' || 'long') }}" --publish-mode private
