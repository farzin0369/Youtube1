name: Deploy mobile assistant preview

on:
  workflow_dispatch:
  push:
    branches:
      - feat/atlas-ai-mobile-assistant-clean
    paths:
      - "mobile-assistant/**"
      - ".github/workflows/deploy-mobile-assistant.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mobile-assistant-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload mobile app
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile-assistant
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
