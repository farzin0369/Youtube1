name: "Deprecated MoneyPrinterTurbo video engine — disabled; use LTX-Video"

on:
  workflow_dispatch:
    inputs:
      upload_private:
        description: "Upload the generated video to YouTube as PRIVATE (never public)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mpt-private-video
  cancel-in-progress: false

jobs:
  generate-and-upload:
    if: false # Disabled: only LTX-Video is allowed in the production channel pipeline.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout channel pipeline
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
      - name: Check required secrets without revealing them
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys
          required = ["PEXELS_API_KEY"]
          if "${{ inputs.upload_private }}" == "true":
              required += ["YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN"]
          missing = [key for key in required if not os.getenv(key, "").strip()]
          if missing:
              print("Missing required GitHub Actions secrets: " + ", ".join(missing))
              sys.exit(1)
          print("Required secret presence check passed; values were not printed.")
          PY
      - name: Checkout MoneyPrinterTurbo
        uses: actions/checkout@v4
        with:
          repository: harry0703/MoneyPrinterTurbo
          ref: main
          path: MoneyPrinterTurbo
      - name: Install MoneyPrinterTurbo dependencies
        working-directory: MoneyPrinterTurbo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Configure MoneyPrinterTurbo at runtime (no credentials committed)
        working-directory: MoneyPrinterTurbo
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          cp config.example.toml config.toml
          python - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("config.toml")
          s = p.read_text(encoding="utf-8")
          key = os.environ["PEXELS_API_KEY"].strip()
          s, n = re.subn(r'(?m)^pexels_api_keys\s*=\s*\[\s*\]', 'pexels_api_keys = ["' + key.replace('\\', '\\\\').replace('"', '\\"') + '"]', s, count=1)
          if n != 1:
              raise SystemExit("Could not safely configure Pexels in MoneyPrinterTurbo config")
          p.write_text(s, encoding="utf-8")
          print("Runtime config prepared; secret value not printed.")
          PY
      - name: Generate Persian video using MoneyPrinterTurbo
        working-directory: MoneyPrinterTurbo
        run: |
          set -o pipefail
          python cli.py \
            --video-script "گاهی فکر می‌کنیم برای تغییر زندگی باید منتظر یک معجزه بزرگ بمانیم. اما شاید اولین نشانه لطف خدا، همان فرصت کوچکی باشد که امروز در اختیار توست. اگر می‌خواهی مسیرت عوض شود، از یک تصمیم روشن شروع کن: به جای ترس، توکل؛ به جای بهانه، عمل؛ و به جای مقایسه، رشد. توکل یعنی قدم برداشتن با دل آرام، نه دست روی دست گذاشتن. هر روز یک کار کوچک انجام بده که تو را به انسان بهتر، آگاه‌تر و مسئول‌تری تبدیل کند. رزق فقط پول نیست؛ آرامش، سلامتی، دانایی و آدم‌های درست هم نعمت‌اند. برای رشد مالی، ارزش واقعی خلق کن، مهارت بیاموز، خرجت را بشناس و با صبر ادامه بده. نتیجه همه چیز در اختیار ما نیست، اما نیت و تلاش امروزمان در اختیار ماست. همین امروز شروع کن؛ شاید همان قدم کوچک، آغاز فصل تازه‌ای باشد. اگر این پیام به دلت نشست، کانال ImamAli110 را دنبال کن و این یادآوری را با کسی که به آن نیاز دارد به اشتراک بگذار." \
            --video-source pexels \
            --video-language Persian \
            --video-aspect 9:16 \
            --video-clip-duration 4 \
            --voice-name fa-IR-FaridNeural \
            --subtitle-enabled \
            --subtitle-position bottom \
            --bgm-type random \
            --stop-at video 2>&1 | tee ../mpt-generation.log
      - name: Validate generated MP4
        run: |
          set -euo pipefail
          VIDEO="$(find MoneyPrinterTurbo/storage/tasks -type f -name '*.mp4' -size +100k -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$VIDEO" || { echo "MoneyPrinterTurbo did not produce a non-empty MP4"; exit 1; }
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$VIDEO"
          python scripts/validate_video_dimensions.py "$VIDEO" --format shorts
          mkdir -p output
          cp "$VIDEO" output/imamali110-private-test.mp4
          TASK_DIR="$(dirname "$VIDEO")"
          find "$TASK_DIR" -maxdepth 2 -type f \( -iname '*.srt' -o -iname '*.ass' \) -print -quit | while read -r SUB; do cp "$SUB" output/captions.srt; done
          test -s output/captions.srt || { echo "MoneyPrinterTurbo did not produce an SRT caption file"; exit 1; }
          python scripts/validate_srt.py output/captions.srt --video "$VIDEO"
          echo "VIDEO_PATH=output/imamali110-private-test.mp4" >> "$GITHUB_ENV"
      - name: Upload as private YouTube draft
        if: ${{ inputs.upload_private }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CONTAINS_SYNTHETIC_MEDIA: "true"
        run: |
          set -euo pipefail
          python -m pip install 'google-api-python-client>=2.150.0'
          python -m pip install -r requirements-local.txt
          python - <<'PY'
          import json, os
          from pathlib import Path
          from app.youtube_client import probe_youtube_auth, upload_video
          auth = probe_youtube_auth()
          if not auth.get("ok"):
              raise SystemExit("YouTube OAuth preflight failed: " + str(auth.get("error", "unknown error")))
          print("YouTube OAuth preflight passed for channel: " + str(auth.get("title", "(title unavailable)")))
          video = Path("output/imamali110-private-test.mp4")
          result = upload_video(
              video_path=video,
              title="توکل، تلاش و رشد | ImamAli110",
              description="یک یادآوری کوتاه درباره توکل به خدا، رشد فردی و ساختن عادت‌های مالی بهتر.\n\nImamAli110 | پیام را مقدم بدان؛ الگوریتم خودش دنبال می‌آید.",
              tags=["ImamAli110", "توکل به خدا", "رشد فردی", "انگیزشی", "آرامش", "رشد مالی"],
              privacy="private",
          )
          safe = {k: result.get(k) for k in ("ok", "video_id", "url", "privacy", "captions_set", "thumbnail_set")}
          print(json.dumps(safe, ensure_ascii=False))
          if not result.get("ok"):
              raise SystemExit("YouTube upload failed: " + str(result.get("error", "unknown error")))
          Path("output/youtube-upload-result.json").write_text(json.dumps(safe, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - name: Preserve logs and private video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpt-persian-private-video-test
          path: |
            output/
            mpt-generation.log
          if-no-files-found: warn
          retention-days: 7
