name: MoneyPrinterTurbo Persian private video test

on:
  push:
    branches: ["fix/mpt-local-materials-private-test"]
  workflow_dispatch:
    inputs:
      upload_private:
        description: "Upload the generated video to YouTube as PRIVATE (never public)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: mpt-private-video
  cancel-in-progress: false

jobs:
  generate-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout channel pipeline
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra espeak-ng
      - name: Check YouTube secrets without revealing values
        if: ${{ github.event_name == 'push' || inputs.upload_private }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys
          required = ["YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN"]
          missing = [key for key in required if not os.getenv(key, "").strip()]
          if missing:
              print("Missing required YouTube OAuth secrets: " + ", ".join(missing))
              sys.exit(1)
          print("YouTube OAuth secret presence check passed; values were not printed.")
          PY
      - name: Checkout MoneyPrinterTurbo
        uses: actions/checkout@v4
        with:
          repository: harry0703/MoneyPrinterTurbo
          ref: main
          path: MoneyPrinterTurbo
      - name: Create original cinematic visual clips (no stock API key required)
        run: |
          set -euo pipefail
          mkdir -p MoneyPrinterTurbo/storage/local_videos
          for spec in "0x071426:0x0f766e" "0x10172f:0x6d28d9" "0x111827:0xb45309" "0x071a2b:0x1d4ed8"; do
            bg="${spec%%:*}"
            glow="${spec##*:}"
            out="MoneyPrinterTurbo/storage/local_videos/scene-${bg#0x}.mp4"
            ffmpeg -hide_banner -loglevel error -y \
              -f lavfi -i "color=c=${bg}:s=720x1280:r=24:d=6" \
              -vf "drawbox=x=180:y=300:w=360:h=600:color=${glow}@0.40:t=fill,gblur=sigma=65,drawbox=x=358:y=0:w=4:h=ih:color=white@0.04:t=fill,zoompan=z='min(zoom+0.0008,1.08)':d=1:s=720x1280:fps=24,format=yuv420p" \
              -an -c:v libx264 -preset ultrafast -crf 25 -movflags +faststart "$out"
          done
          test "$(find MoneyPrinterTurbo/storage/local_videos -maxdepth 1 -name '*.mp4' | wc -l)" -ge 4
          echo "Created four original animated abstract visual clips locally; no external stock provider or paid video API was called."
      - name: Install MoneyPrinterTurbo dependencies
        working-directory: MoneyPrinterTurbo
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Configure MoneyPrinterTurbo for local materials
        working-directory: MoneyPrinterTurbo
        run: |
          cp config.example.toml config.toml
          python - <<'PY'
          from pathlib import Path
          p = Path("config.toml")
          s = p.read_text(encoding="utf-8")
          s = s.replace('video_source = "pexels"', 'video_source = "local"', 1)
          s = s.replace('subtitle_provider = "edge"', 'subtitle_provider = "whisper"', 1)
          p.write_text(s, encoding="utf-8")
          print("Runtime config set to local materials and Whisper subtitles; no stock or Edge TTS credentials required.")
          PY
      - name: Generate Persian narration with free TTS fallback
        working-directory: MoneyPrinterTurbo
        run: |
          set -euo pipefail
          mkdir -p storage
          cat > storage/narration-fa.txt <<'TEXT'
          گاهی فکر می‌کنیم برای تغییر زندگی باید منتظر یک معجزه بزرگ بمانیم. اما شاید اولین نشانه لطف خدا، همان فرصت کوچکی باشد که امروز در اختیار توست. اگر می‌خواهی مسیرت عوض شود، از یک تصمیم روشن شروع کن: به جای ترس، توکل؛ به جای بهانه، عمل؛ و به جای مقایسه، رشد. توکل یعنی قدم برداشتن با دل آرام، نه دست روی دست گذاشتن. هر روز یک کار کوچک انجام بده که تو را به انسان بهتر، آگاه‌تر و مسئول‌تری تبدیل کند. رزق فقط پول نیست؛ آرامش، سلامتی، دانایی و آدم‌های درست هم نعمت‌اند. برای رشد مالی، ارزش واقعی خلق کن، مهارت بیاموز، خرجت را بشناس و با صبر ادامه بده. نتیجه همه چیز در اختیار ما نیست، اما نیت و تلاش امروزمان در اختیار ماست. همین امروز شروع کن؛ شاید همان قدم کوچک، آغاز فصل تازه‌ای باشد. اگر این پیام به دلت نشست، کانال ImamAli110 را دنبال کن و این یادآوری را با کسی که به آن نیاز دارد به اشتراک بگذار.
          TEXT
          if ! command -v espeak-ng >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y espeak-ng; fi
          espeak-ng --voices=fa
          espeak-ng -v fa -s 145 -f storage/narration-fa.txt -w storage/narration-fa.wav
          ffmpeg -hide_banner -loglevel error -y -i storage/narration-fa.wav -codec:a libmp3lame -q:a 4 storage/narration-fa.mp3
          test -s storage/narration-fa.mp3
          echo "Persian narration generated using the free local Persian speech engine."
      - name: Generate Persian video using MoneyPrinterTurbo
        working-directory: MoneyPrinterTurbo
        run: |
          set -o pipefail
          python cli.py \
            --video-script "گاهی فکر می‌کنیم برای تغییر زندگی باید منتظر یک معجزه بزرگ بمانیم. اما شاید اولین نشانه لطف خدا، همان فرصت کوچکی باشد که امروز در اختیار توست. اگر می‌خواهی مسیرت عوض شود، از یک تصمیم روشن شروع کن: به جای ترس، توکل؛ به جای بهانه، عمل؛ و به جای مقایسه، رشد. توکل یعنی قدم برداشتن با دل آرام، نه دست روی دست گذاشتن. هر روز یک کار کوچک انجام بده که تو را به انسان بهتر، آگاه‌تر و مسئول‌تری تبدیل کند. رزق فقط پول نیست؛ آرامش، سلامتی، دانایی و آدم‌های درست هم نعمت‌اند. برای رشد مالی، ارزش واقعی خلق کن، مهارت بیاموز، خرجت را بشناس و با صبر ادامه بده. نتیجه همه چیز در اختیار ما نیست، اما نیت و تلاش امروزمان در اختیار ماست. همین امروز شروع کن؛ شاید همان قدم کوچک، آغاز فصل تازه‌ای باشد. اگر این پیام به دلت نشست، کانال ImamAli110 را دنبال کن و این یادآوری را با کسی که به آن نیاز دارد به اشتراک بگذار." \
            --video-source local \
            --video-materials "storage/local_videos/scene-071426.mp4,storage/local_videos/scene-10172f.mp4,storage/local_videos/scene-111827.mp4,storage/local_videos/scene-071a2b.mp4" \
            --video-language Persian \
            --video-aspect 9:16 \
            --video-clip-duration 4 \
            --custom-audio-file storage/narration-fa.mp3 \
            --subtitle-enabled \
            --subtitle-position bottom \
            --bgm-type random \
            --stop-at video 2>&1 | tee ../mpt-generation.log
      - name: Validate generated MP4
        run: |
          set -euo pipefail
          VIDEO="$(find MoneyPrinterTurbo/storage/tasks -type f -name '*.mp4' -size +100k -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$VIDEO" || { echo "MoneyPrinterTurbo did not produce a non-empty MP4"; exit 1; }
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$VIDEO"
          mkdir -p output
          cp "$VIDEO" output/imamali110-private-test.mp4
          TASK_DIR="$(dirname "$VIDEO")"
          find "$TASK_DIR" -maxdepth 2 -type f \( -iname '*.srt' -o -iname '*.ass' \) -print -quit | while read -r SUB; do cp "$SUB" output/captions.srt; done
          echo "VIDEO_PATH=output/imamali110-private-test.mp4" >> "$GITHUB_ENV"
      - name: Upload as private YouTube draft
        if: ${{ github.event_name == 'push' || inputs.upload_private }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CONTAINS_SYNTHETIC_MEDIA: "true"
        run: |
          set -euo pipefail
          python -m pip install -r requirements-local.txt
          python - <<'PY'
          import json, os
          from pathlib import Path
          from app.youtube_client import probe_youtube_auth, upload_video
          auth = probe_youtube_auth()
          if not auth.get("ok"):
              raise SystemExit("YouTube OAuth preflight failed: " + str(auth.get("error", "unknown error")))
          print("YouTube OAuth preflight passed for channel: " + str(auth.get("title", "(title unavailable)")))
          video = Path("output/imamali110-private-test.mp4")
          result = upload_video(
              video_path=video,
              title="توکل، تلاش و رشد | ImamAli110",
              description="یک یادآوری کوتاه درباره توکل به خدا، رشد فردی و ساختن عادت‌های مالی بهتر.\n\nImamAli110 | پیام را مقدم بدان؛ الگوریتم خودش دنبال می‌آید.",
              tags=["ImamAli110", "توکل به خدا", "رشد فردی", "انگیزشی", "آرامش", "رشد مالی"],
              privacy="private",
          )
          safe = {k: result.get(k) for k in ("ok", "video_id", "url", "privacy", "captions_set", "thumbnail_set")}
          print(json.dumps(safe, ensure_ascii=False))
          if not result.get("ok"):
              raise SystemExit("YouTube upload failed: " + str(result.get("error", "unknown error")))
          Path("output/youtube-upload-result.json").write_text(json.dumps(safe, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
      - name: Preserve logs and private video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpt-persian-private-video-test
          path: |
            output/
            mpt-generation.log
          if-no-files-found: warn
          retention-days: 7
