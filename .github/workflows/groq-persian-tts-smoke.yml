name: Verify Groq and Persian CPU TTS

on:
  workflow_dispatch:
  push:
    branches:
      - feat/persian-piper-tts

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-20b' }}
      LLM_REQUIRE_CLOUD: "false"
      LLM_TIMEOUT_SECONDS: "90"
      # Male neural Persian narrator (channel default)
      TTS_PROVIDER: edge
      TTS_VOICE: fa-IR-FaridNeural
      TTS_RATE: "-7%"
      TTS_PITCH: "-2Hz"
      TTS_VOLUME: "+0%"
      TTS_ALLOW_FALLBACK: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest -q

      - name: Optional Groq text generation (skip if secret missing)
        id: groq
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p output/tts-smoke
          if [ -z "${GROQ_API_KEY:-}" ]; then
            echo "GROQ_API_KEY not set; skipping Groq text step (TTS will still run)."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import os
          from app.llm_provider import generate_text

          text, provider = generate_text(
              "You are a concise Persian narrator. Return only one natural Persian sentence.",
              "یک جمله کوتاه فارسی درباره امید بنویس.",
              max_tokens=120,
              temperature=0.4,
              timeout=90,
          )
          if not text.strip():
              raise SystemExit("Groq returned empty text")
          print(f"Groq completion passed; provider selected: {provider}")
          print(f"Persian text length: {len(text)} characters")
          PY
          echo "skipped=false" >> "$GITHUB_OUTPUT"

      - name: Male Farid natural Persian TTS sample
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p output/tts-smoke
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          from app.tts import synthesize

          # Real spiritual narration; punctuation keeps natural pauses for Farid.
          SAMPLE = (
              "گاهی زندگی مثل جاده‌ای تاریک به نظر می‌رسد، و قدم برداشتن سخت می‌شود. "
              "اما همان لحظه‌ای که تصمیم می‌گیری یک قدم کوچک برداری، نور کوچکی در دلت روشن می‌شود. "
              "توکل یعنی این‌که با وجود ابهام، به مسیر ادامه بدهی و امید را رها نکنی. "
              "هر روز یک عادت آرام بساز: چند دقیقه سکوت، یک نفس عمیق، و یادآوری این‌که ارزش تو به نتیجهٔ فوری وابسته نیست. "
              "اگر امروز فقط یک کار کوچک برای رشد خودت انجام دادی، همان کافی است. "
              "فردا دوباره شروع کن. مسیر طولانی، از همین قدم‌های کوتاه ساخته می‌شود."
          )

          out_dir = Path("output/tts-smoke")
          out_dir.mkdir(parents=True, exist_ok=True)
          script_path = out_dir / "persian-tts-script.txt"
          script_path.write_text(SAMPLE, encoding="utf-8")

          report_lines = []
          report_lines.append("Persian TTS smoke report (male natural Farid)")
          report_lines.append(f"script_chars={len(SAMPLE)}")
          report_lines.append(f"script_words≈{len(SAMPLE.split())}")

          try:
              result = synthesize(SAMPLE, out_dir / "persian-tts-sample")
          except Exception as exc:
              report_lines.append(f"STATUS=FAIL synthesize error: {type(exc).__name__}: {exc}")
              (out_dir / "tts-test-report.txt").write_text("\n".join(report_lines) + "\n", encoding="utf-8")
              print("\n".join(report_lines))
              sys.exit(1)

          audio_path = Path(result["path"])
          size = audio_path.stat().st_size if audio_path.exists() else 0
          report_lines.append(f"provider={result.get('provider')}")
          report_lines.append(f"voice={result.get('voice')}")
          report_lines.append(f"model={result.get('model')}")
          report_lines.append(f"gender={result.get('gender', 'n/a')}")
          report_lines.append(f"rate={result.get('rate', 'n/a')}")
          report_lines.append(f"pitch={result.get('pitch', 'n/a')}")
          report_lines.append(f"audio_path={audio_path}")
          report_lines.append(f"audio_bytes={size}")

          if not audio_path.exists() or size < 2048:
              report_lines.append("STATUS=FAIL audio missing or too small")
              (out_dir / "tts-test-report.txt").write_text("\n".join(report_lines) + "\n", encoding="utf-8")
              print("\n".join(report_lines))
              sys.exit(1)

          preferred = out_dir / ("persian-tts-sample" + audio_path.suffix)
          if audio_path.resolve() != preferred.resolve():
              preferred.write_bytes(audio_path.read_bytes())
              audio_path = preferred
              report_lines.append(f"normalized_path={audio_path}")

          duration = 0.0
          try:
              probe = subprocess.run(
                  [
                      "ffprobe", "-v", "error",
                      "-show_entries", "format=duration:stream=sample_rate,channels,codec_name",
                      "-of", "json",
                      str(audio_path),
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
                  timeout=30,
              )
              meta = json.loads(probe.stdout)
              duration = float((meta.get("format") or {}).get("duration") or 0)
              streams = meta.get("streams") or []
              if streams:
                  report_lines.append(f"codec={streams[0].get('codec_name')}")
                  report_lines.append(f"sample_rate={streams[0].get('sample_rate')}")
                  report_lines.append(f"channels={streams[0].get('channels')}")
              report_lines.append(f"duration_seconds={duration:.3f}")
          except Exception as exc:
              report_lines.append(f"ffprobe_error={type(exc).__name__}: {exc}")

          if duration <= 0.5:
              report_lines.append("STATUS=FAIL duration not positive / too short")
              (out_dir / "tts-test-report.txt").write_text("\n".join(report_lines) + "\n", encoding="utf-8")
              print("\n".join(report_lines))
              sys.exit(1)

          report_lines.append("STATUS=PASS")
          report = "\n".join(report_lines) + "\n"
          (out_dir / "tts-test-report.txt").write_text(report, encoding="utf-8")
          print(report)
          PY

      - name: Experimental KittenTTS Persian compatibility test
        id: kitten_tts
        continue-on-error: true
        run: |
          mkdir -p output/tts-smoke/kitten
          python -m pip install "https://github.com/KittenML/KittenTTS/releases/download/0.8.1/kittentts-0.8.1-py3-none-any.whl"
          python - <<'PY'
          import json
          import subprocess
          import traceback
          from pathlib import Path

          out = Path("output/tts-smoke/kitten")
          out.mkdir(parents=True, exist_ok=True)
          script = (
              "گاهی زندگی سخت می‌شود، اما امید می‌تواند چراغی در مسیر ما باشد. "
              "هر روز با یک قدم کوچک، به سوی آرامش و رشد حرکت کن."
          )
          (out / "kitten-persian-script.txt").write_text(script, encoding="utf-8")
          report = [
              "KittenTTS Persian compatibility experiment",
              "Purpose: test actual official KittenTTS 0.8.1 API with Persian text.",
              "Important: a valid WAV file does not prove Persian-language support or intelligible Persian pronunciation.",
              f"script_chars={len(script)}",
          ]
          wav = out / "kitten-persian-sample.wav"
          try:
              from kittentts import KittenTTS
              model = KittenTTS("KittenML/kitten-tts-mini-0.8")
              voices = list(getattr(model, "available_voices", []))
              report.append("model_loaded=true")
              report.append("available_voices=" + ",".join(map(str, voices)))
              voice = next((v for v in ("Jasper", "Bruno", "Luna", "Bella") if v in voices), None)
              if voice is None:
                  raise RuntimeError("No documented default voice was found in available_voices")
              model.generate_to_file(script, str(wav), voice=voice)
              if not wav.exists() or wav.stat().st_size < 2048:
                  raise RuntimeError("KittenTTS did not create a non-empty WAV file")
              probe = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration",
                   "-of", "json", str(wav)],
                  check=True, capture_output=True, text=True, timeout=30,
              )
              duration = float(json.loads(probe.stdout)["format"]["duration"])
              report.append(f"voice={voice}")
              report.append(f"audio_bytes={wav.stat().st_size}")
              report.append(f"duration_seconds={duration:.3f}")
              report.append("STATUS=GENERATED_BUT_PERSIAN_UNVERIFIED")
              report.append("Human listening/native-speaker review is required before treating this as usable Persian narration.")
          except Exception as exc:
              report.append(f"STATUS=FAILED")
              report.append(f"error={type(exc).__name__}: {exc}")
              report.append(traceback.format_exc())
          finally:
              (out / "kitten-test-report.txt").write_text("\n".join(report) + "\n", encoding="utf-8")
              print("\n".join(report))
          PY

      - name: Upload Persian sample audio and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groq-persian-tts-smoke-${{ github.run_id }}
          path: output/tts-smoke/
          if-no-files-found: warn
          retention-days: 14
