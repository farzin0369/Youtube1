name: Channel health and daily report

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imamali110-channel-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run regression tests
        id: tests
        run: |
          mkdir -p output
          python -m compileall -q app scripts
          python -m pytest -q 2>&1 | tee output/tests.log
      - name: Restore comment reply ledger
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: output/comment_reply_ledger.json
          key: imamali110-comment-ledger-${{ github.run_id }}
          restore-keys: |
            imamali110-comment-ledger-
      - name: Generate daily health report
        if: always()
        env:
          AI_ENGINE: qwen
          ENABLE_AUTO_COMMENT_REPLIES: "true"
          TEST_STATUS: ${{ steps.tests.outcome }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_API_BASE: ${{ secrets.QWEN_API_BASE }}
          QWEN_MODEL: ${{ secrets.QWEN_MODEL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python scripts/daily_health_report.py --test-status "${TEST_STATUS}"
      - name: Save comment reply ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: output/comment_reply_ledger.json
          key: imamali110-comment-ledger-${{ github.run_id }}
      - name: Upload daily report and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imamali110-daily-health-${{ github.run_id }}
          path: |
            output/daily_health_report.md
            output/daily_health_report.json
            output/tests.log
            output/pending_replies.json
          retention-days: 30
