name: Channel health

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Run channel health check
        env:
          AI_ENGINE: local
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json
          from app.channel_ops import channel_health
          result = channel_health()
          print(json.dumps(result, ensure_ascii=False, indent=2))
          if not result.get('youtube'):
              raise SystemExit('YouTube OAuth failed — check CLIENT_ID/SECRET/REFRESH_TOKEN')
          print('OK: YouTube credentials work')
          PY
