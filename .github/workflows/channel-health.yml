name: Channel health and daily report

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imamali110-channel-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Run regression tests
        id: tests
        run: |
          mkdir -p output
          python -m compileall -q app scripts
          python -m pytest -q 2>&1 | tee output/tests.log
      - name: Prepare persistent moderation state
        if: always()
        run: |
          mkdir -p output
          if [ ! -f output/comment_reply_ledger.json ]; then printf '{"replied":{}}\\n' > output/comment_reply_ledger.json; fi
          if [ ! -f output/pending_replies.json ]; then printf '{"pending":[]}\\n' > output/pending_replies.json; fi
      - name: Restore comment reply ledger
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: |
            output/comment_reply_ledger.json
            output/pending_replies.json
          key: imamali110-comment-ledger-${{ github.run_id }}
          restore-keys: |
            imamali110-comment-ledger-
      - name: Install local Ollama model for bounded comment replies
        if: steps.tests.outcome == 'success'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &)
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break || sleep 2; done
          ollama pull llama3.2:3b
      - name: Generate daily health report
        if: always()
        env:
          AI_ENGINE: local
          LOCAL_LLM_MODEL: llama3.2:3b
          OLLAMA_KEEP_ALIVE: 5m
          MAX_COMMENT_VIDEOS: "1"
          MAX_COMMENTS_PER_VIDEO: "5"
          ENABLE_AUTO_COMMENT_REPLIES: ${{ steps.tests.outcome == 'success' && 'true' || 'false' }}
          TEST_STATUS: ${{ steps.tests.outcome }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/daily_health_report.py --test-status "${TEST_STATUS}"
      - name: Save comment reply ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            output/comment_reply_ledger.json
            output/pending_replies.json
          key: imamali110-comment-ledger-${{ github.run_id }}
      - name: Upload daily report and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imamali110-daily-health-${{ github.run_id }}
          path: |
            output/daily_health_report.md
            output/daily_health_report.json
            output/tests.log
            output/pending_replies.json
          retention-days: 30
