name: BAMO studio proof (3 topics, CPU, no publishing)
on:
  push:
    branches: ["feat/bamo-studio-engine-v1"]
    paths:
      - ".github/workflows/bamo_studio_proof.yml"
      - "scripts/render_studio_proof.py"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bamo-studio-proof
  cancel-in-progress: false
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bamo-studio-engine-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core blender
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Unit tests (planner, prefabs, director extension)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest -q \
            tests/test_bamo_topic_planner.py \
            tests/test_bamo_prefabs.py \
            tests/test_bamo_prefab_director.py \
            tests/test_bamo_scene_kit.py
      - name: Cache local Qwen weights
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-qwen2.5-7b-v1-${{ runner.os }}
      - name: Start local CPU language model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          (ollama serve > /tmp/bamo-ollama.log 2>&1 &)
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5:7b
      - name: Render three different topics
        env:
          PYTHONPATH: ${{ github.workspace }}
          CHANNEL_BRAND: BAMO
          USE_LOCAL_LLM: "1"
          BAMO_PREFER_LOCAL_LLM: "1"
          LOCAL_LLM_MODEL: qwen2.5:7b
          LLM_TIMEOUT_SECONDS: "900"
          OLLAMA_TIMEOUT_SECONDS: "900"
          OLLAMA_NUM_CTX: "4096"
          OLLAMA_NUM_PREDICT: "4096"
          TTS_PROVIDER: edge-tts
          TTS_VOICE: fa-IR-FaridNeural
          BAMO_BLENDER_SAMPLES: "4"
          BAMO_BLENDER_RESOLUTION_PERCENTAGE: "35"
          BAMO_BLENDER_THREADS: "2"
          BAMO_BLENDER_DENOISE: "false"
          BAMO_BLENDER_MOTION_BLUR: "false"
          BAMO_BLENDER_CA: "0"
          BAMO_BLENDER_FILM_GRAIN: "0"
          BAMO_CINEMATIC_EFFECTS: "true"
        run: python scripts/render_studio_proof.py 2>&1 | tee /tmp/bamo-studio-proof.log
      - name: Upload videos, frames and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BAMO-studio-proof-${{ github.run_id }}
          path: |
            output/bamo-studio-proof/
            /tmp/bamo-studio-proof.log
          retention-days: 14
