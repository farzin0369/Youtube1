name: BAMO Daily Science Short - Saturn Rings
on:
  workflow_dispatch:
  push:
    branches:
      - feat/bamo-html-only-engine-sample
    paths:
      - "preview/bamo-engine-pipeline.html"
      - "scripts/render_bamo_daily_*.py"
      - ".github/workflows/bamo-html-engine-sample.yml"
  pull_request:
    branches:
      - main
permissions:
  contents: read
  actions: read
jobs:
  render-html-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Playwright and Persian TTS
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright edge-tts
          python -m playwright install --with-deps chromium
      - name: Render today's short with the HTML/WebGL engine
        env:
          PYTHONPATH: .
          BAMO_RENDER_SCALE: "1.0"
          BAMO_RENDER_FPS: "24"
        run: python scripts/render_bamo_daily_20261109.py
      - name: Upload MP4, subtitles and QA report
        uses: actions/upload-artifact@v4
        with:
          name: bamo-science-short-20261109
          path: |
            artifacts/bamo-science-short-20261109.mp4
            artifacts/bamo-science-short-20261109.srt
            artifacts/bamo-science-short-20261109-qa.json
            artifacts/bamo-science-short-20261109-review.jpg
          if-no-files-found: error
          retention-days: 14
