name: BAMO Full-Quality WebGL Render
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
permissions:
  contents: read
  actions: read
jobs:
  render-html-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright edge-tts
          python -m playwright install --with-deps chromium
      - name: Render sample using HTML engine only
        run: PYTHONPATH=. python scripts/render_html_engine_sample.py
      - name: Upload MP4 sample
        uses: actions/upload-artifact@v4
        with:
          name: bamo-atom-structure-full-quality
          path: artifacts/bamo-html-engine-sample.mp4
          if-no-files-found: error
          retention-days: 14
