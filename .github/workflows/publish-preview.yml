name: Publish reviewed YouTube preview

on:
  workflow_dispatch:
    inputs:
      preview_run_id:
        description: Successful non-publishing preview run ID
        required: true
        type: string
      preview_attempt:
        description: Preview run attempt number
        required: true
        default: "1"
        type: string
      publish_at:
        description: Exact approved UTC publication time (ISO-8601)
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: youtube-reviewed-preview-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install publishing and QA dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
      - name: Verify the source run is a successful manual preview from this repository
        uses: actions/github-script@v7
        with:
          script: |
            const runId = Number("${{ inputs.preview_run_id }}");
            const attempt = Number("${{ inputs.preview_attempt }}");
            if (!Number.isSafeInteger(runId) || !Number.isSafeInteger(attempt) || attempt < 1) {
              core.setFailed("Invalid preview run ID or attempt.");
              return;
            }
            const { data: run } = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const repoName = `${context.repo.owner}/${context.repo.repo}`.toLowerCase();
            if (run.event !== "workflow_dispatch" || run.name !== "Persian spiritual channel — daily video" ||
                run.status !== "completed" || run.conclusion !== "success" ||
                run.run_attempt !== attempt || !run.head_repository ||
                run.head_repository.full_name.toLowerCase() !== repoName) {
              core.setFailed("The source run is not a successful manual preview from this repository.");
            }
      - name: Download the exact reviewed preview artifact
        uses: actions/download-artifact@v4
        with:
          name: persian-spiritual-production-${{ inputs.preview_run_id }}-${{ inputs.preview_attempt }}
          run-id: ${{ inputs.preview_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _reviewed_preview
      - name: Publish the reviewed artifact and schedule it
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PUBLISH_AT: ${{ inputs.publish_at }}
        run: >-
          python scripts/publish_preview.py
          --artifact-dir _reviewed_preview
          --publish-at "$PUBLISH_AT"
          --publish
