name: BAMO Blender multi-domain scene-graph proof

on:
  push:
    branches:
      - feat/bamo-visual-review-and-scene-fidelity
    paths:
      - app/bamo_motion_engine.py
      - scripts/bamo_blender_scene.py
      - scripts/test_bamo_scene_variety.py
      - .github/workflows/bamo_blender_scene_variety.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bamo-blender-variety-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  render-varied-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}
      BAMO_BLENDER_SAMPLES: "8"
      BAMO_BLENDER_RESOLUTION_PERCENTAGE: "50"
      BAMO_BLENDER_THREADS: "2"
      BAMO_BLENDER_DENOISE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Blender and media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender ffmpeg fonts-noto-core
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Render three independent semantic fixtures
        run: python scripts/test_bamo_scene_variety.py
      - name: Upload MP4 and render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BAMO-three-domain-renderer-proof-${{ github.run_id }}
          path: output/bamo-scene-variety/
          retention-days: 7
          if-no-files-found: error
