name: Colab CLI GPU cinematic render

# Required GitHub Actions secret: COLAB_CLI_TOKEN_JSON
on:
  workflow_dispatch:
  workflow_call:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Check Colab CLI token secret
        id: check
        env:
          COLAB_CLI_TOKEN_JSON: ${{ secrets.COLAB_CLI_TOKEN_JSON }}
        run: |
          if [ -n "$COLAB_CLI_TOKEN_JSON" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail clearly when Colab token is missing
        if: steps.check.outputs.ok != 'true'
        run: |
          echo "::error::Required secret COLAB_CLI_TOKEN_JSON is not available to this workflow."
          exit 1

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Install render and QA tools
        if: steps.check.outputs.ok == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -q google-colab-cli edge-tts

      - name: Restore Colab CLI token
        if: steps.check.outputs.ok == 'true'
        env:
          COLAB_CLI_TOKEN_JSON: ${{ secrets.COLAB_CLI_TOKEN_JSON }}
        run: |
          mkdir -p ~/.config/colab-cli
          printf '%s' "$COLAB_CLI_TOKEN_JSON" > ~/.config/colab-cli/token.json
          chmod 600 ~/.config/colab-cli/token.json
          unset COLAB_CLI_TOKEN_JSON

      - name: Record existing Colab sessions without stopping unrelated sessions
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        run: |
          mkdir -p output/colab_cli
          colab sessions 2>&1 | tee output/colab_cli/sessions_before.txt || true
          echo "Existing sessions are recorded only; this workflow will not stop sessions it did not create."

      - name: Allocate Colab T4 and render LTX video
        if: steps.check.outputs.ok == 'true'
        id: gpu
        env:
          VIDEO_FRAMES: "49"
          VIDEO_STEPS: "30"
          VIDEO_H: "512"
          VIDEO_W: "768"
        run: |
          set -Eeuo pipefail
          mkdir -p output/colab_cli
          SESSION="imamali-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'SESSION=%s\n' "$SESSION" | tee -a output/colab_cli/run.log

          allocated=0
          for attempt in 1 2 3; do
            echo "Colab allocation attempt $attempt/3" | tee -a output/colab_cli/run.log
            if colab new -s "$SESSION" --gpu T4 2>&1 | tee -a output/colab_cli/run.log; then
              allocated=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 30
              SESSION="imamali-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}"
            fi
          done

          if [ "$allocated" != "1" ]; then
            echo "::error::Colab could not allocate a T4 after three attempts. This usually requires available Colab quota/capacity; retrying cannot bypass account limits."
            exit 1
          fi

          cleanup() {
            colab stop -s "$SESSION" 2>&1 | tee -a output/colab_cli/run.log || true
          }
          trap cleanup EXIT

          echo 'import subprocess,sys; subprocess.check_call([sys.executable,"-m","pip","install","-q","diffusers>=0.32.0","transformers","accelerate","imageio-ffmpeg","sentencepiece"])' \
            | colab exec -s "$SESSION" 2>&1 | tee -a output/colab_cli/run.log

          if ! colab exec -s "$SESSION" -f scripts/colab_render_minimal.py 2>&1 | tee -a output/colab_cli/run.log; then
            echo "::error::LTX render script failed on the Colab runtime."
            exit 1
          fi

          if ! colab download -s "$SESSION" /content/video_raw.mp4 output/colab_cli/video_raw.mp4 2>&1 | tee -a output/colab_cli/run.log; then
            echo "::error::Could not download video_raw.mp4 from Colab."
            exit 1
          fi

          test -s output/colab_cli/video_raw.mp4
          ls -lh output/colab_cli/video_raw.mp4

      - name: Quality gate raw GPU video
        if: steps.check.outputs.ok == 'true'
        run: python scripts/validate_video_quality.py output/colab_cli/video_raw.mp4

      - name: Finish short with Persian TTS and captions
        if: steps.check.outputs.ok == 'true'
        run: |
          python scripts/finish_gpu_short.py output/colab_cli
          test -s output/colab_cli/final_short.mp4

      - name: Quality gate final MP4
        if: steps.check.outputs.ok == 'true'
        run: python scripts/validate_video_quality.py output/colab_cli/final_short.mp4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colab-cli-render
          path: output/colab_cli/
          if-no-files-found: warn
