name: Colab CLI GPU cinematic render

# Uses GitHub Actions secret COLAB_CLI_TOKEN_JSON. Never print token contents.

on:
  workflow_dispatch:
  workflow_call:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Check Colab token secret
        id: check
        env:
          COLAB_CLI_TOKEN_JSON: ${{ secrets.COLAB_CLI_TOKEN_JSON }}
        run: |
          if [ -n "$COLAB_CLI_TOKEN_JSON" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::error::COLAB_CLI_TOKEN_JSON secret is empty or unavailable to this workflow."
            exit 1
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Install Colab CLI
        if: steps.check.outputs.ok == 'true'
        run: pip install -q google-colab-cli edge-tts

      - name: Restore Colab CLI token
        if: steps.check.outputs.ok == 'true'
        env:
          COLAB_CLI_TOKEN_JSON: ${{ secrets.COLAB_CLI_TOKEN_JSON }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          raw = os.environ["COLAB_CLI_TOKEN_JSON"]
          data = json.loads(raw)
          if not isinstance(data, dict) or not data:
              raise SystemExit("Colab token JSON must be a non-empty JSON object")
          target = Path.home() / ".config" / "colab-cli" / "token.json"
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(raw, encoding="utf-8")
          target.chmod(0o600)
          print("Colab token JSON validated and stored securely (contents hidden).")
          PY

      - name: Inspect existing Colab sessions without stopping them
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        run: |
          mkdir -p output/colab_cli
          colab sessions 2>&1 | tee output/colab_cli/sessions_before.txt || true
          echo "Existing sessions are preserved; this workflow will not stop unrelated sessions."

      - name: Allocate a dedicated Colab T4 session
        if: steps.check.outputs.ok == 'true'
        id: gpu
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          mkdir -p output/colab_cli
          SESSION="imamali-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "SESSION=$SESSION" | tee -a output/colab_cli/run.log
          ok=0
          # Colab can return transient 503/Service Unavailable when T4 capacity is busy.
          # Retry with increasing waits and a fresh unique session name each time.
          for attempt in 1 2 3 4 5; do
            SESSION="imamali-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$attempt"
            echo "GPU allocation attempt $attempt/5 for $SESSION" | tee -a output/colab_cli/run.log
            if colab new -s "$SESSION" --gpu T4 2>&1 | tee -a output/colab_cli/run.log; then
              ok=1
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              wait_seconds=$((attempt * 45))
              echo "Allocation unavailable; waiting ${wait_seconds}s before retry." | tee -a output/colab_cli/run.log
              sleep "$wait_seconds"
            fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Colab did not allocate a T4 GPU after 5 attempts. No video was rendered; downstream video steps will be skipped. This is a Colab capacity/service response, not a YouTube credential error. Retry later or use an already-connected Colab runtime." | tee -a output/colab_cli/run.log
            exit 1
          fi
          echo "session=$SESSION" >> "$GITHUB_OUTPUT"

      - name: Install video dependencies in Colab
        if: steps.check.outputs.ok == 'true' && steps.gpu.outcome == 'success'
        env:
          SESSION: ${{ steps.gpu.outputs.session }}
        run: |
          set -euo pipefail
          echo 'import subprocess,sys; subprocess.check_call([sys.executable,"-m","pip","install","-q","diffusers>=0.32.0","transformers","accelerate","imageio-ffmpeg","sentencepiece"])' \
            | colab exec -s "$SESSION" 2>&1 | tee -a output/colab_cli/run.log

      - name: Generate video on Colab GPU
        if: steps.check.outputs.ok == 'true' && steps.gpu.outcome == 'success'
        env:
          SESSION: ${{ steps.gpu.outputs.session }}
        run: |
          set -euo pipefail
          colab exec -s "$SESSION" -f scripts/colab_render_minimal.py 2>&1 | tee -a output/colab_cli/run.log

      - name: Download generated video
        if: steps.check.outputs.ok == 'true' && steps.gpu.outcome == 'success'
        env:
          SESSION: ${{ steps.gpu.outputs.session }}
        run: |
          set -euo pipefail
          colab download -s "$SESSION" /content/video_raw.mp4 output/colab_cli/video_raw.mp4 2>&1 | tee -a output/colab_cli/run.log
          test -s output/colab_cli/video_raw.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/colab_cli/video_raw.mp4 | tee output/colab_cli/video_probe.txt

      - name: Finish short (natural TTS + captions)
        if: steps.check.outputs.ok == 'true' && steps.gpu.outcome == 'success'
        run: |
          set -euo pipefail
          python scripts/finish_gpu_short.py output/colab_cli
          ls -lah output/colab_cli/

      - name: Stop only this workflow's Colab session
        if: always() && steps.gpu.outputs.session != ''
        env:
          SESSION: ${{ steps.gpu.outputs.session }}
        run: colab stop -s "$SESSION" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colab-cli-render
          path: output/colab_cli/
          if-no-files-found: warn
          retention-days: 7
