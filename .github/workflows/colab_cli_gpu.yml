name: Colab CLI GPU cinematic render

# Needs secret COLAB_CLI_TOKEN_JSON (token.json from colab --auth=oauth2 whoami)

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      has_video:
        description: whether video_raw was produced
        value: ${{ jobs.render.outputs.has_video }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      has_video: ${{ steps.done.outputs.has_video }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Colab token secret
        id: check
        run: |
          if [ -n "${{ secrets.COLAB_CLI_TOKEN_JSON }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "Missing secret COLAB_CLI_TOKEN_JSON"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Install Colab CLI
        if: steps.check.outputs.ok == 'true'
        run: |
          pip install -q google-colab-cli
          colab version || true

      - name: Restore Colab CLI token
        if: steps.check.outputs.ok == 'true'
        env:
          COLAB_CLI_TOKEN_JSON: ${{ secrets.COLAB_CLI_TOKEN_JSON }}
        run: |
          mkdir -p ~/.config/colab-cli
          printf '%s' "$COLAB_CLI_TOKEN_JSON" > ~/.config/colab-cli/token.json
          chmod 600 ~/.config/colab-cli/token.json
          echo "token restored ($(wc -c < ~/.config/colab-cli/token.json) bytes)"

      - name: Render on Colab T4 + download
        if: steps.check.outputs.ok == 'true'
        id: run
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p output/colab_cli
          SESSION="imamali-$(date +%s)"
          echo "SESSION=$SESSION"

          # Keep session alive so we can download even if exec times out on client
          colab new -s "$SESSION" --gpu T4 2>&1 | tee -a output/colab_cli/run.log

          # Install deps on VM first (fast)
          echo 'import subprocess,sys; subprocess.check_call([sys.executable,"-m","pip","install","-q","diffusers","transformers","accelerate","imageio-ffmpeg"])' \
            | colab exec -s "$SESSION" 2>&1 | tee -a output/colab_cli/run.log || true

          # Run renderer (may client-timeout after SUCCESS; video stays on VM)
          set +e
          colab exec -s "$SESSION" -f scripts/colab_render_minimal.py 2>&1 | tee -a output/colab_cli/run.log
          EXEC_RC=${PIPESTATUS[0]}
          set -e
          echo "exec_rc=$EXEC_RC" | tee -a output/colab_cli/run.log

          # Always try download
          colab download -s "$SESSION" /content/video_raw.mp4 output/colab_cli/video_raw.mp4 2>&1 | tee -a output/colab_cli/run.log || true
          colab download -s "$SESSION" /content/scene_00.mp4 output/colab_cli/scene_00.mp4 2>&1 | tee -a output/colab_cli/run.log || true
          colab download -s "$SESSION" /content/scene_01.mp4 output/colab_cli/scene_01.mp4 2>&1 | tee -a output/colab_cli/run.log || true

          colab stop -s "$SESSION" 2>&1 | tee -a output/colab_cli/run.log || true

          if [ -f output/colab_cli/video_raw.mp4 ]; then
            ls -la output/colab_cli/video_raw.mp4
          else
            echo "download missed video_raw"
            ls -la output/colab_cli/ || true
          fi

      - name: Mark result
        id: done
        run: |
          if [ -f output/colab_cli/video_raw.mp4 ] && [ "$(stat -c%s output/colab_cli/video_raw.mp4)" -gt 1000 ]; then
            echo "has_video=true" >> "$GITHUB_OUTPUT"
            ls -la output/colab_cli/video_raw.mp4
          else
            echo "has_video=false" >> "$GITHUB_OUTPUT"
            echo "No video. Tail log:"
            tail -n 60 output/colab_cli/run.log 2>/dev/null || true
          fi

      - uses: actions/upload-artifact@v4
        if: always() && steps.check.outputs.ok == 'true'
        with:
          name: colab-cli-render
          path: output/colab_cli/
          if-no-files-found: warn
