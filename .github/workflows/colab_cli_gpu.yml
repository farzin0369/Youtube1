name: Colab CLI GPU cinematic render

# Secret: COLAB_CLI_TOKEN_JSON
# Public Hugging Face model download is bounded; no token is printed or fetched
# from Colab's UI-only secret vault.

on:
  workflow_dispatch:
  workflow_call:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Check Colab token secret
        id: check
        run: |
          if [ -n "${{ secrets.COLAB_CLI_TOKEN_JSON }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Install Colab CLI
        if: steps.check.outputs.ok == 'true'
        timeout-minutes: 5
        run: pip install -q google-colab-cli edge-tts

      - name: Restore Colab CLI token
        if: steps.check.outputs.ok == 'true'
        env:
          COLAB_CLI_TOKEN_JSON: ${{ secrets.COLAB_CLI_TOKEN_JSON }}
        run: |
          mkdir -p ~/.config/colab-cli
          printf '%s' "$COLAB_CLI_TOKEN_JSON" > ~/.config/colab-cli/token.json
          chmod 600 ~/.config/colab-cli/token.json

      - name: Inspect Colab sessions (do not stop unrelated sessions)
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        timeout-minutes: 2
        run: |
          mkdir -p output/colab_cli
          timeout 60s colab sessions 2>&1 | tee output/colab_cli/sessions_before.txt || true

      - name: GPU render on Colab T4 (LTX)
        if: steps.check.outputs.ok == 'true'
        id: gpu
        continue-on-error: true
        timeout-minutes: 40
        env:
          HF_HUB_DOWNLOAD_TIMEOUT: "30"
          HF_HUB_ETAG_TIMEOUT: "15"
        run: |
          set -euo pipefail
          mkdir -p output/colab_cli
          SESSION="imamali-$(date +%s)"
          echo "SESSION=$SESSION" | tee -a output/colab_cli/run.log

          # Bound each allocation attempt so the job cannot wait forever.
          ok=0
          for attempt in 1 2 3; do
            echo "allocate attempt $attempt" | tee -a output/colab_cli/run.log
            if timeout 5m colab new -s "$SESSION" --gpu T4 2>&1 | tee -a output/colab_cli/run.log; then
              ok=1
              break
            fi
            sleep 10
            SESSION="imamali-$(date +%s)-$attempt"
          done
          if [ "$ok" != "1" ]; then
            echo "GPU allocation failed or timed out after 3 attempts" | tee -a output/colab_cli/run.log
            exit 1
          fi

          echo "Installing render dependencies (max 8 minutes)" | tee -a output/colab_cli/run.log
          if ! printf '%s\n' 'import subprocess,sys; subprocess.check_call([sys.executable,"-m","pip","install","-q","diffusers>=0.32.0","transformers","accelerate","imageio-ffmpeg","sentencepiece"])' | timeout 8m colab exec -s "$SESSION" 2>&1 | tee -a output/colab_cli/run.log; then
            echo "Remote dependency installation failed or timed out" | tee -a output/colab_cli/run.log
            exit 1
          fi

          echo "Starting LTX render (max 22 minutes)" | tee -a output/colab_cli/run.log
          set +e
          timeout 22m colab exec -s "$SESSION" -f scripts/colab_render_minimal.py 2>&1 | tee -a output/colab_cli/run.log
          render_rc=${PIPESTATUS[0]}
          set -e
          if [ "$render_rc" -ne 0 ]; then
            echo "LTX render failed or timed out (exit $render_rc)" | tee -a output/colab_cli/run.log
          fi

          echo "Downloading output (max 4 minutes)" | tee -a output/colab_cli/run.log
          timeout 4m colab download -s "$SESSION" /content/video_raw.mp4 output/colab_cli/video_raw.mp4 2>&1 | tee -a output/colab_cli/run.log || true
          timeout 2m colab stop -s "$SESSION" 2>&1 | tee -a output/colab_cli/run.log || true
          ls -la output/colab_cli/ || true
          if [ ! -s output/colab_cli/video_raw.mp4 ]; then
            echo "No video downloaded; last render log lines follow" | tee -a output/colab_cli/run.log
            tail -n 80 output/colab_cli/run.log || true
            exit 1
          fi

      - name: Finish short (natural TTS + captions)
        if: steps.check.outputs.ok == 'true'
        timeout-minutes: 10
        run: |
          if [ -f output/colab_cli/video_raw.mp4 ]; then
            python scripts/finish_gpu_short.py output/colab_cli
            ls -la output/colab_cli/
          else
            echo "No video_raw"
            tail -n 80 output/colab_cli/run.log || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always() && steps.check.outputs.ok == 'true'
        with:
          name: colab-cli-render
          path: output/colab_cli/
          if-no-files-found: warn
