name: Colab CLI GPU cinematic render

# Secret: COLAB_CLI_TOKEN_JSON

on:
  workflow_dispatch:
  workflow_call:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Check Colab token secret
        id: check
        run: |
          if [ -n "${{ secrets.COLAB_CLI_TOKEN_JSON }}" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - name: Install Colab CLI
        if: steps.check.outputs.ok == 'true'
        run: pip install -q google-colab-cli edge-tts

      - name: Restore Colab CLI token
        if: steps.check.outputs.ok == 'true'
        env:
          COLAB_CLI_TOKEN_JSON: ${{ secrets.COLAB_CLI_TOKEN_JSON }}
        run: |
          mkdir -p ~/.config/colab-cli
          printf '%s' "$COLAB_CLI_TOKEN_JSON" > ~/.config/colab-cli/token.json
          chmod 600 ~/.config/colab-cli/token.json

      - name: Free stuck Colab sessions
        if: steps.check.outputs.ok == 'true'
        continue-on-error: true
        run: |
          mkdir -p output/colab_cli
          colab sessions 2>&1 | tee output/colab_cli/sessions_before.txt || true
          # Stop every listed session name (best-effort)
          colab sessions 2>/dev/null | awk '{print $1}' | while read -r s; do
            case "$s" in
              SESSION|Name|----*|"") continue ;;
            esac
            echo "Stopping $s"
            colab stop -s "$s" 2>&1 || true
          done
          sleep 15
          colab sessions 2>&1 | tee output/colab_cli/sessions_after.txt || true

      - name: GPU render on Colab T4 (LTX)
        if: steps.check.outputs.ok == 'true'
        id: gpu
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p output/colab_cli
          SESSION="imamali-$(date +%s)"
          echo "SESSION=$SESSION" | tee -a output/colab_cli/run.log

          # Retry allocate up to 3 times (quota / capacity)
          ok=0
          for attempt in 1 2 3; do
            echo "allocate attempt $attempt" | tee -a output/colab_cli/run.log
            if colab new -s "$SESSION" --gpu T4 2>&1 | tee -a output/colab_cli/run.log; then
              ok=1
              break
            fi
            sleep 30
            SESSION="imamali-$(date +%s)-$attempt"
          done
          if [ "$ok" != "1" ]; then
            echo "GPU allocate failed after retries" | tee -a output/colab_cli/run.log
            exit 1
          fi

          echo 'import subprocess,sys; subprocess.check_call([sys.executable,"-m","pip","install","-q","diffusers>=0.32.0","transformers","accelerate","imageio-ffmpeg","sentencepiece"])' \
            | colab exec -s "$SESSION" 2>&1 | tee -a output/colab_cli/run.log || true

          set +e
          colab exec -s "$SESSION" -f scripts/colab_render_minimal.py 2>&1 | tee -a output/colab_cli/run.log
          set -e

          colab download -s "$SESSION" /content/video_raw.mp4 output/colab_cli/video_raw.mp4 2>&1 | tee -a output/colab_cli/run.log || true
          colab stop -s "$SESSION" 2>&1 | tee -a output/colab_cli/run.log || true
          ls -la output/colab_cli/ || true

      - name: Finish short (natural TTS + captions)
        if: steps.check.outputs.ok == 'true'
        run: |
          if [ -f output/colab_cli/video_raw.mp4 ]; then
            python scripts/finish_gpu_short.py output/colab_cli
            ls -la output/colab_cli/
          else
            echo "No video_raw"
            tail -n 50 output/colab_cli/run.log || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always() && steps.check.outputs.ok == 'true'
        with:
          name: colab-cli-render
          path: output/colab_cli/
          if-no-files-found: warn
