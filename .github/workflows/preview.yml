name: Generate local AI preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify local stack
        run: |
          nvidia-smi
          command -v piper
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-local.txt
      - name: Generate local preview
        env:
          AI_ENGINE: local
          LOCAL_VIDEO_MODEL: THUDM/CogVideoX-2b
          LOCAL_LLM_MODEL: qwen2.5:7b
          PIPER_MODEL: ${{ vars.PIPER_MODEL }}
        run: python -m app.pipeline --kind short --dry-run
      - name: Package preview
        run: |
          mkdir -p preview
          find output -type f \( -name '*.mp4' -o -name '*.jpg' -o -name '*.srt' -o -name 'script.txt' \) -exec cp {} preview/ \;
          ls -lh preview
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube1-local-preview
          path: preview/
          retention-days: 7
