name: Generate preview video

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate 1 Short preview
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TTS_VOICE: onyx
        run: |
          test -n "$OPENAI_API_KEY"
          python -m app.pipeline --kind short --dry-run

      - name: Package generated preview
        run: |
          mkdir -p preview
          find output -type f \( -name '*.mp4' -o -name '*.jpg' -o -name '*.srt' -o -name 'script.txt' \) -exec cp {} preview/ \;
          ls -lh preview

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube1-preview
          path: preview/
          retention-days: 7
