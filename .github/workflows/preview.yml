name: Generate local AI preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install free CPU AI stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt piper-tts
          mkdir -p "${RUNNER_TEMP}/piper"
          curl -L --fail --retry 3 -o "${RUNNER_TEMP}/piper/fa_IR-amir-medium.onnx" https://huggingface.co/rhasspy/piper-voices/resolve/main/fa/fa_IR/amir/medium/fa_IR-amir-medium.onnx
          curl -L --fail --retry 3 -o "${RUNNER_TEMP}/piper/fa_IR-amir-medium.onnx.json" https://huggingface.co/rhasspy/piper-voices/resolve/main/fa/fa_IR/amir/medium/fa_IR-amir-medium.onnx.json
      - name: Generate local preview
        env:
          AI_ENGINE: local
          VIDEO_ENGINE: cpu
          LOCAL_LLM_MODEL: qwen2.5:7b
          PIPER_MODEL: ${{ runner.temp }}/piper/fa_IR-amir-medium.onnx
        run: python -m app.pipeline --kind short --dry-run
      - name: Package preview
        run: |
          mkdir -p preview
          find output -type f \( -name '*.mp4' -o -name '*.jpg' -o -name '*.srt' -o -name 'script.txt' \) -exec cp {} preview/ \;
          ls -lh preview
      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube1-local-preview
          path: preview/
          retention-days: 7
