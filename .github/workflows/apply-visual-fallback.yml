name: Apply Shorts visual fallback
on:
  workflow_dispatch:
  push:
    branches: ["feat/openclaw-autonomous-manager-v2"]
    paths:
      - "scripts/patch_shorts_visual_fallback.py"
      - "scripts/patch_pollinations_visuals.py"
      - ".github/workflows/apply-visual-fallback.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual patches
        run: |
          set -euo pipefail
          [ -f scripts/patch_shorts_visual_fallback.py ] && python3 scripts/patch_shorts_visual_fallback.py || true
          python3 scripts/patch_pollinations_visuals.py
          grep -q "fetch_pollinations_stills" app/spiritual_video.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "openclaw-fix-bot"
          git config user.email "openclaw-fix-bot@users.noreply.github.com"
          git add app/spiritual_video.py
          if git diff --cached --quiet; then echo noop; else git commit -m "feat: free Pollinations visuals without Pexels account" && git push; fi
