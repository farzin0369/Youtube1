name: Apply Shorts visual fallback
on:
  workflow_dispatch:
  push:
    branches: ["feat/openclaw-autonomous-manager-v2"]
    paths:
      - "scripts/patch_shorts_visual_fallback.py"
      - ".github/workflows/apply-visual-fallback.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply visual fallback patch
        run: |
          set -euo pipefail
          python3 scripts/patch_shorts_visual_fallback.py
          grep -q "auto-generated abstract stills\|generating abstract stills" app/spiritual_video.py
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "openclaw-fix-bot"
          git config user.email "openclaw-fix-bot@users.noreply.github.com"
          git add app/spiritual_video.py
          if git diff --cached --quiet; then echo noop; else git commit -m "fix: abstract stills fallback when Pexels/GPU missing" && git push; fi
