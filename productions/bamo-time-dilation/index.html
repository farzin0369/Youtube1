<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg0: #02040a;
        --ink: #f8fafc;
        --accent: #2dd4bf;
        --accent2: #38bdf8;
        --muted: #94a3b8;
        --font: "Inter", system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--bg0); font-family: var(--font);
      }
      #root {
        position: relative; width: 1080px; height: 1920px;
        background:
          radial-gradient(ellipse 90% 55% at 50% 18%, #132044 0%, transparent 55%),
          radial-gradient(ellipse 70% 40% at 50% 85%, #0b1b2e 0%, transparent 50%),
          linear-gradient(180deg, #050814 0%, #02040a 100%);
        overflow: hidden;
      }
      .stars {
        position: absolute; inset: 0; pointer-events: none;
        background-image:
          radial-gradient(2px 2px at 120px 200px, rgba(255,255,255,0.9), transparent),
          radial-gradient(1.5px 1.5px at 400px 520px, rgba(255,255,255,0.7), transparent),
          radial-gradient(2px 2px at 820px 300px, rgba(255,255,255,0.85), transparent),
          radial-gradient(1px 1px at 260px 900px, rgba(255,255,255,0.6), transparent),
          radial-gradient(2px 2px at 700px 1100px, rgba(255,255,255,0.75), transparent),
          radial-gradient(1.5px 1.5px at 180px 1400px, rgba(255,255,255,0.65), transparent),
          radial-gradient(2px 2px at 900px 1600px, rgba(255,255,255,0.8), transparent),
          radial-gradient(1px 1px at 500px 1700px, rgba(255,255,255,0.55), transparent);
        opacity: 0.85;
      }
      .nebula {
        position: absolute; width: 900px; height: 900px; border-radius: 50%;
        left: 50%; top: 42%; transform: translate(-50%, -50%);
        background: radial-gradient(circle, rgba(45,212,191,0.18) 0%, rgba(56,189,248,0.08) 35%, transparent 68%);
        filter: blur(8px); pointer-events: none;
      }
      .bh {
        position: absolute; width: 220px; height: 220px; border-radius: 50%;
        left: 50%; top: 42%; transform: translate(-50%, -50%);
        background: radial-gradient(circle at 40% 35%, #1e293b 0%, #020617 55%, #000 100%);
        box-shadow:
          0 0 0 3px rgba(45,212,191,0.35),
          0 0 40px 8px rgba(45,212,191,0.25),
          0 0 120px 30px rgba(56,189,248,0.15);
        pointer-events: none; opacity: 0;
      }
      .ring {
        position: absolute; border-radius: 50%; border-style: solid; pointer-events: none;
        left: 50%; top: 42%; transform: translate(-50%, -50%);
      }
      .ring.r1 { width: 340px; height: 340px; border-width: 2px; border-color: rgba(45,212,191,0.35); }
      .ring.r2 { width: 480px; height: 480px; border-width: 2px; border-color: rgba(56,189,248,0.22); }
      .ring.r3 { width: 640px; height: 640px; border-width: 1.5px; border-color: rgba(148,163,184,0.18); }
      .orbit {
        position: absolute; width: 14px; height: 14px; border-radius: 50%;
        background: var(--accent); box-shadow: 0 0 20px 6px rgba(45,212,191,0.7);
        left: 50%; top: 42%; margin-left: -7px; margin-top: -7px;
        pointer-events: none; opacity: 0;
      }
      .scene {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 140px 72px; text-align: center; opacity: 0;
      }
      .kicker {
        font-size: 28px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase;
        color: var(--accent2); margin-bottom: 28px;
      }
      .hook {
        font-size: 76px; font-weight: 900; line-height: 1.12; color: var(--ink);
        letter-spacing: -0.035em; text-shadow: 0 8px 40px rgba(0,0,0,0.45);
      }
      .hook em { font-style: normal; color: var(--accent); text-shadow: 0 0 24px rgba(45,212,191,0.45); }
      .body {
        font-size: 54px; font-weight: 700; line-height: 1.22; color: var(--ink);
        letter-spacing: -0.025em; text-shadow: 0 6px 28px rgba(0,0,0,0.4);
      }
      .body em { font-style: normal; color: var(--accent); }
      .sub { margin-top: 32px; font-size: 34px; font-weight: 500; color: var(--muted); }
      .brand-wrap { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .brand {
        font-size: 92px; font-weight: 900; letter-spacing: 0.12em; color: var(--ink);
        text-shadow: 0 0 40px rgba(45,212,191,0.35);
      }
      .handle { font-size: 42px; font-weight: 700; color: var(--accent); }
      .bar {
        position: absolute; left: 90px; right: 90px; bottom: 120px; height: 4px;
        background: rgba(148,163,184,0.2); border-radius: 4px; overflow: hidden;
      }
      .bar > i {
        display: block; height: 100%; width: 0%;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        border-radius: 4px;
      }
      audio.clip { display: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="21" data-width="1080" data-height="1920" data-fps="30">
      <audio id="narration" class="clip" data-start="0" data-duration="20.4" data-track-index="1" data-has-audio="true" src="assets/narration.mp3" preload="auto"></audio>
      <div class="stars" id="stars"></div>
      <div class="nebula" id="nebula"></div>
      <div class="bh" id="bh"></div>
      <div class="ring r1" id="r1"></div>
      <div class="ring r2" id="r2"></div>
      <div class="ring r3" id="r3"></div>
      <div class="orbit" id="orbit"></div>
      <div id="s1" class="scene clip" data-start="0" data-duration="4.1" data-track-index="0">
        <div class="kicker">Physics · 21s</div>
        <div class="hook">Time is <em>not</em><br/>the same<br/>for everyone.</div>
      </div>
      <div id="s2" class="scene clip" data-start="3.9" data-duration="5.2" data-track-index="0">
        <div class="body">Near a black hole,<br/>one second can equal<br/><em>years on Earth.</em></div>
      </div>
      <div id="s3" class="scene clip" data-start="8.9" data-duration="5.1" data-track-index="0">
        <div class="body">GPS satellites already<br/>correct for this<br/><em>every day.</em></div>
        <div class="sub">Relativity runs the modern world.</div>
      </div>
      <div id="s4" class="scene clip" data-start="13.8" data-duration="4.0" data-track-index="0">
        <div class="body">Not a chalkboard theory.<br/><em>Engineering reality.</em></div>
      </div>
      <div id="s5" class="scene clip" data-start="17.6" data-duration="3.4" data-track-index="0">
        <div class="brand-wrap"><div class="brand">BAMO</div><div class="handle">@12bamo</div></div>
      </div>
      <div class="bar"><i id="progress"></i></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#stars", { opacity: 0.4 }, { opacity: 1, duration: 1.2, ease: "power2.out" }, 0);
      tl.fromTo("#nebula", { scale: 0.85, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.4, ease: "power2.out" }, 0.1);
      tl.fromTo("#bh", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.0, ease: "power3.out" }, 0.3);
      tl.fromTo("#r1, #r2, #r3", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 1.0, stagger: 0.08, ease: "power2.out" }, 0.35);
      tl.fromTo("#orbit", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.5);
      tl.to("#orbit", { rotation: 360, transformOrigin: "7px 240px", duration: 21, ease: "none" }, 0);
      tl.to("#r1", { rotation: 120, duration: 21, ease: "none" }, 0);
      tl.to("#r2", { rotation: -90, duration: 21, ease: "none" }, 0);
      tl.to("#r3", { rotation: 60, duration: 21, ease: "none" }, 0);
      tl.to("#nebula", { scale: 1.08, duration: 21, ease: "none" }, 0);
      tl.to("#progress", { width: "100%", duration: 21, ease: "none" }, 0);
      tl.fromTo("#s1", { opacity: 0, y: 48 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.15);
      tl.to("#s1", { opacity: 0, y: -36, duration: 0.35, ease: "power2.in" }, 3.6);
      tl.fromTo("#s2", { opacity: 0, y: 48 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 3.9);
      tl.to("#bh", { scale: 1.12, duration: 4.8, ease: "sine.inOut" }, 3.9);
      tl.to("#s2", { opacity: 0, y: -36, duration: 0.35, ease: "power2.in" }, 8.55);
      tl.fromTo("#s3", { opacity: 0, y: 48 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 8.9);
      tl.to("#s3", { opacity: 0, y: -36, duration: 0.35, ease: "power2.in" }, 13.5);
      tl.fromTo("#s4", { opacity: 0, y: 48 }, { opacity: 1, y: 0, duration: 0.65, ease: "power3.out" }, 13.8);
      tl.to("#s4", { opacity: 0, y: -28, duration: 0.3, ease: "power2.in" }, 17.35);
      tl.fromTo("#s5", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 17.6);
      tl.to("#bh", { scale: 1.0, opacity: 0.55, duration: 2.5, ease: "power2.out" }, 17.6);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
