<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #05070f;
        --ink: #f5f7ff;
        --accent: #5eead4;
        --muted: #94a3b8;
        --font-display: "Inter", system-ui, -apple-system, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
        font-family: var(--font-display);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: radial-gradient(ellipse at 50% 30%, #0f172a 0%, #05070f 70%);
        overflow: hidden;
      }
      .scene {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 120px 80px;
        text-align: center;
        opacity: 0;
      }
      .hook {
        font-size: 78px;
        font-weight: 800;
        line-height: 1.15;
        color: var(--ink);
        letter-spacing: -0.03em;
      }
      .hook span { color: var(--accent); }
      .body {
        font-size: 56px;
        font-weight: 600;
        line-height: 1.25;
        color: var(--ink);
        letter-spacing: -0.02em;
      }
      .sub {
        margin-top: 36px;
        font-size: 36px;
        font-weight: 500;
        color: var(--muted);
      }
      .brand {
        font-size: 64px;
        font-weight: 800;
        color: var(--ink);
        letter-spacing: 0.08em;
      }
      .handle {
        margin-top: 24px;
        font-size: 40px;
        color: var(--accent);
        font-weight: 600;
      }
      .ring {
        position: absolute;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        border: 3px solid rgba(94, 234, 212, 0.25);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .ring.inner {
        width: 360px;
        height: 360px;
        border-color: rgba(94, 234, 212, 0.45);
      }
      .dot {
        position: absolute;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--accent);
        top: 18%;
        left: 50%;
        margin-left: -9px;
        box-shadow: 0 0 24px rgba(94, 234, 212, 0.8);
      }
      audio.clip { display: none; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="21"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <audio
        id="narration"
        class="clip"
        data-start="0"
        data-duration="20.4"
        data-track-index="1"
        data-has-audio="true"
        src="assets/narration.mp3"
        preload="auto"
      ></audio>

      <div class="ring" id="ring-outer"></div>
      <div class="ring inner" id="ring-inner"></div>
      <div class="dot" id="orbit-dot"></div>

      <div id="s1" class="scene clip" data-start="0" data-duration="4.2" data-track-index="0">
        <div class="hook">Time is <span>not</span> the same<br/>for everyone.</div>
      </div>

      <div id="s2" class="scene clip" data-start="4.0" data-duration="5.2" data-track-index="0">
        <div class="body">Near a black hole,<br/>one second can equal<br/><span style="color:#5eead4">years on Earth.</span></div>
      </div>

      <div id="s3" class="scene clip" data-start="9.0" data-duration="5.0" data-track-index="0">
        <div class="body">GPS satellites already<br/>correct for this<br/><span style="color:#5eead4">every day.</span></div>
        <div class="sub">Relativity runs the modern world.</div>
      </div>

      <div id="s4" class="scene clip" data-start="14.0" data-duration="4.0" data-track-index="0">
        <div class="body">Not a chalkboard theory.<br/><span style="color:#5eead4">Engineering reality.</span></div>
      </div>

      <div id="s5" class="scene clip" data-start="17.8" data-duration="3.2" data-track-index="0">
        <div class="brand">BAMO</div>
        <div class="handle">@12bamo</div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.to("#orbit-dot", {
        rotation: 360,
        transformOrigin: "9px 620px",
        duration: 21,
        ease: "none"
      }, 0);
      tl.to("#ring-outer", { rotation: 90, duration: 21, ease: "none" }, 0);
      tl.to("#ring-inner", { rotation: -120, duration: 21, ease: "none" }, 0);

      tl.fromTo("#s1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0);
      tl.to("#s1", { opacity: 0, y: -30, duration: 0.35, ease: "power2.in" }, 3.7);

      tl.fromTo("#s2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 4.0);
      tl.to("#s2", { opacity: 0, y: -30, duration: 0.35, ease: "power2.in" }, 8.7);

      tl.fromTo("#s3", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 9.0);
      tl.to("#s3", { opacity: 0, y: -30, duration: 0.35, ease: "power2.in" }, 13.6);

      tl.fromTo("#s4", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 14.0);
      tl.to("#s4", { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 17.5);

      tl.fromTo("#s5", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, 17.8);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
