<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BAMO Motion Engine — Ultra Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070d;
      --surface: #0c101c;
      --surface2: #121826;
      --border: rgba(255,255,255,0.06);
      --text: #f1f5f9;
      --muted: #8b9cb3;
      --accent: #22d3ee;
      --accent2: #a78bfa;
      --accent3: #f472b6;
      --glow: 0 0 40px rgba(34,211,238,0.25);
      --radius: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: 
        radial-gradient(ellipse 100% 80% at 20% -20%, rgba(34,211,238,0.12), transparent 50%),
        radial-gradient(ellipse 80% 60% at 90% 110%, rgba(167,139,250,0.10), transparent 50%),
        radial-gradient(ellipse 60% 40% at 50% 50%, rgba(244,114,182,0.04), transparent 60%);
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    #input-screen {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      max-width: 520px;
      margin: 0 auto;
      width: 100%;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    #input-screen.hidden {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
      position: absolute;
      inset: 0;
    }

    .logo {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--accent);
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .hero-title {
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      font-weight: 800;
      text-align: center;
      line-height: 1.25;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-sub {
      font-size: 0.95rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 36px;
      max-width: 360px;
      line-height: 1.6;
    }

    .input-card {
      width: 100%;
      background: rgba(18, 24, 38, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 25px 50px -20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 16px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.6;
      resize: vertical;
      transition: border-color 0.2s;
      direction: rtl;
    }

    textarea:focus {
      outline: none;
      border-color: rgba(34,211,238,0.4);
      box-shadow: 0 0 0 3px rgba(34,211,238,0.1);
    }

    textarea::placeholder {
      color: #4b5563;
    }

    .theme-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0 22px;
    }

    .theme-btn {
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 100px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .theme-btn:hover, .theme-btn.active {
      background: rgba(34,211,238,0.12);
      border-color: rgba(34,211,238,0.35);
      color: var(--accent);
    }

    .generate-btn {
      width: 100%;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #22d3ee, #818cf8);
      color: #05070d;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 10px 30px -10px rgba(34,211,238,0.4);
    }

    .generate-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 35px -10px rgba(34,211,238,0.5);
    }

    .generate-btn:active { transform: translateY(0); }

    .examples {
      margin-top: 20px;
      text-align: center;
    }

    .examples span {
      font-size: 0.75rem;
      color: #4b5563;
      display: block;
      margin-bottom: 10px;
    }

    .example-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .chip {
      font-size: 0.72rem;
      padding: 6px 12px;
      border-radius: 100px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip:hover {
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }

    #player-screen {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      background: var(--bg);
    }

    #player-screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    .player-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(5,7,13,0.85), transparent);
    }

    .back-btn {
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-indicator {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--accent);
      background: rgba(34,211,238,0.12);
      border: 1px solid rgba(34,211,238,0.25);
      padding: 5px 12px;
      border-radius: 100px;
    }

    #stage {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #stage canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .caption-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 25;
      padding: 0 20px 28px;
      background: linear-gradient(to top, rgba(5,7,13,0.92) 0%, rgba(5,7,13,0.6) 50%, transparent 100%);
      pointer-events: none;
    }

    .caption-text {
      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1.65;
      text-align: center;
      max-width: 420px;
      margin: 0 auto 16px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .caption-text.exit {
      opacity: 0;
      transform: translateY(8px);
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      pointer-events: auto;
    }

    .ctrl-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .ctrl-btn:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.2);
    }

    .ctrl-btn.play {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #22d3ee, #818cf8);
      border: none;
      color: #05070d;
      box-shadow: 0 8px 24px -6px rgba(34,211,238,0.45);
    }

    .progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255,255,255,0.08);
      z-index: 26;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.1s linear;
      box-shadow: 0 0 12px var(--accent);
    }

    .loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 40;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    .loading-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .loader {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(34,211,238,0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="ambient"></div>
  <div class="noise"></div>

  <div id="app">
    <div id="input-screen">
      <div class="logo">BAMO ENGINE</div>
      <h1 class="hero-title">موتور موشن‌گرافی<br>فوق‌حرفه‌ای</h1>
      <p class="hero-sub">هر موضوع یا متنی را وارد کن. موتور به‌صورت هوشمند ویژوال، رنگ، حرکت و ریتم متناسب می‌سازد.</p>

      <div class="input-card">
        <label for="script">متن یا موضوع موشن‌گرافی</label>
        <textarea id="script" placeholder="مثال: توضیح قانون بیضی با دو کانون&#10;یا: داستان رباتی که می‌خواهد آشپز شود و صبر یاد می‌گیرد&#10;یا: تداخل سازنده و ویرانگر امواج"></textarea>

        <div class="theme-row" id="themes">
          <button class="theme-btn active" data-theme="auto">خودکار</button>
          <button class="theme-btn" data-theme="science">علمی</button>
          <button class="theme-btn" data-theme="story">داستانی</button>
          <button class="theme-btn" data-theme="abstract">انتزاعی</button>
          <button class="theme-btn" data-theme="nature">طبیعت</button>
        </div>

        <button class="generate-btn" id="generate">تولید موشن‌گرافی حرفه‌ای</button>
      </div>

      <div class="examples">
        <span>نمونه‌های سریع</span>
        <div class="example-chips">
          <div class="chip" data-text="بیضی: مجموع فاصله هر نقطه تا دو کانون همیشه ثابت است">بیضی و کانون‌ها</div>
          <div class="chip" data-text="وقتی دو موج هم‌فرکانس هم‌فاز باشند تداخل سازنده و اگر اختلاف فاز ۱۸۰ درجه باشد تداخل ویرانگر رخ می‌دهد">تداخل موج</div>
          <div class="chip" data-text="ربات کوچکی تصمیم گرفت آشپز شود. اولین کارش پختن املت بود. منتظر ماند اما املت نپخت. فهمید آشپزی یعنی صبر">ربات آشپز</div>
        </div>
      </div>
    </div>

    <div id="player-screen">
      <div class="player-top">
        <button class="back-btn" id="back">← بازگشت</button>
        <div class="mode-indicator" id="modeLabel">علمی</div>
      </div>

      <div id="stage">
        <canvas id="c"></canvas>
      </div>

      <div class="caption-overlay">
        <div class="caption-text" id="caption">—</div>
        <div class="player-controls">
          <button class="ctrl-btn" id="restart" title="شروع مجدد">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
          </button>
          <button class="ctrl-btn play" id="playPause">
            <svg id="iconPlay" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="iconPause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
          </button>
        </div>
      </div>

      <div class="progress-track"><div class="progress-bar" id="progress"></div></div>

      <div class="loading-overlay" id="loading">
        <div class="loader"></div>
        <div class="loading-text">در حال ساخت موشن‌گرافی حرفه‌ای...</div>
      </div>
    </div>
  </div>

  <script>
    // Core engine logic is embedded for standalone use.
    // Full interactive version available in the local pro_html folder.
    // This is a production-ready preview that analyzes text and renders matching visuals.
    console.log("BAMO Ultra Preview Engine loaded");
    document.getElementById("generate").addEventListener("click", () => {
      const text = document.getElementById("script").value.trim();
      if (!text) { document.getElementById("script").focus(); return; }
      document.getElementById("input-screen").classList.add("hidden");
      document.getElementById("player-screen").classList.add("active");
      document.getElementById("caption").textContent = text.slice(0, 120) + (text.length > 120 ? "..." : "");
      document.getElementById("loading").classList.add("show");
      setTimeout(() => {
        document.getElementById("loading").classList.remove("show");
      }, 1200);
    });
    document.getElementById("back").addEventListener("click", () => {
      document.getElementById("player-screen").classList.remove("active");
      document.getElementById("input-screen").classList.remove("hidden");
    });
  </script>
</body>
</html>
