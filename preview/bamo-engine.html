<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BAMO Motion Engine — Ultra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05070d;
      --surface: #0c101c;
      --surface2: #121826;
      --border: rgba(255,255,255,0.06);
      --text: #f1f5f9;
      --muted: #8b9cb3;
      --accent: #22d3ee;
      --accent2: #a78bfa;
      --accent3: #f472b6;
      --glow: 0 0 40px rgba(34,211,238,0.25);
      --radius: 20px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ========== APP SHELL ========== */
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Ambient background */
    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background: 
        radial-gradient(ellipse 100% 80% at 20% -20%, rgba(34,211,238,0.12), transparent 50%),
        radial-gradient(ellipse 80% 60% at 90% 110%, rgba(167,139,250,0.10), transparent 50%),
        radial-gradient(ellipse 60% 40% at 50% 50%, rgba(244,114,182,0.04), transparent 60%);
    }

    .noise {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* ========== INPUT SCREEN ========== */
    #input-screen {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      max-width: 520px;
      margin: 0 auto;
      width: 100%;
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    #input-screen.hidden {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
      position: absolute;
      inset: 0;
    }

    .logo {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--accent);
      margin-bottom: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo::before {
      content: '';
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }

    .hero-title {
      font-size: clamp(1.8rem, 6vw, 2.4rem);
      font-weight: 800;
      text-align: center;
      line-height: 1.25;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-sub {
      font-size: 0.95rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 36px;
      max-width: 360px;
      line-height: 1.6;
    }

    .input-card {
      width: 100%;
      background: rgba(18, 24, 38, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 25px 50px -20px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 10px;
    }

    textarea {
      width: 100%;
      min-height: 120px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 16px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.6;
      resize: vertical;
      transition: border-color 0.2s;
      direction: rtl;
    }

    textarea:focus {
      outline: none;
      border-color: rgba(34,211,238,0.4);
      box-shadow: 0 0 0 3px rgba(34,211,238,0.1);
    }

    textarea::placeholder {
      color: #4b5563;
    }

    .theme-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0 22px;
    }

    .theme-btn {
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 100px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .theme-btn:hover, .theme-btn.active {
      background: rgba(34,211,238,0.12);
      border-color: rgba(34,211,238,0.35);
      color: var(--accent);
    }

    .generate-btn {
      width: 100%;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #22d3ee, #818cf8);
      color: #05070d;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 10px 30px -10px rgba(34,211,238,0.4);
    }

    .generate-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 35px -10px rgba(34,211,238,0.5);
    }

    .generate-btn:active { transform: translateY(0); }

    .generate-btn::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s;
    }

    .generate-btn:hover::after {
      transform: translateX(100%);
    }

    .examples {
      margin-top: 20px;
      text-align: center;
    }

    .examples span {
      font-size: 0.75rem;
      color: #4b5563;
      display: block;
      margin-bottom: 10px;
    }

    .example-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .chip {
      font-size: 0.72rem;
      padding: 6px 12px;
      border-radius: 100px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip:hover {
      background: rgba(255,255,255,0.08);
      color: var(--text);
    }

    /* ========== PLAYER SCREEN ========== */
    #player-screen {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
      background: var(--bg);
    }

    #player-screen.active {
      opacity: 1;
      pointer-events: auto;
    }

    .player-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(5,7,13,0.85), transparent);
    }

    .back-btn {
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-indicator {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--accent);
      background: rgba(34,211,238,0.12);
      border: 1px solid rgba(34,211,238,0.25);
      padding: 5px 12px;
      border-radius: 100px;
    }

    #stage {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #stage canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Caption overlay */
    .caption-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 25;
      padding: 0 20px 28px;
      background: linear-gradient(to top, rgba(5,7,13,0.92) 0%, rgba(5,7,13,0.6) 50%, transparent 100%);
      pointer-events: none;
    }

    .caption-text {
      font-size: 1.05rem;
      font-weight: 500;
      line-height: 1.65;
      text-align: center;
      max-width: 420px;
      margin: 0 auto 16px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .caption-text.exit {
      opacity: 0;
      transform: translateY(8px);
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      pointer-events: auto;
    }

    .ctrl-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .ctrl-btn:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.2);
    }

    .ctrl-btn.play {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #22d3ee, #818cf8);
      border: none;
      color: #05070d;
      box-shadow: 0 8px 24px -6px rgba(34,211,238,0.45);
    }

    .progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255,255,255,0.08);
      z-index: 26;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      transition: width 0.1s linear;
      box-shadow: 0 0 12px var(--accent);
    }

    /* Loading state */
    .loading-overlay {
      position: absolute;
      inset: 0;
      z-index: 40;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s;
    }

    .loading-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .loader {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(34,211,238,0.15);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 0.9rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="ambient"></div>
  <div class="noise"></div>

  <div id="app">
    <!-- INPUT SCREEN -->
    <div id="input-screen">
      <div class="logo">BAMO ENGINE</div>
      <h1 class="hero-title">موتور موشن‌گرافی<br>فوق‌حرفه‌ای</h1>
      <p class="hero-sub">هر موضوع یا متنی را وارد کن. موتور به‌صورت هوشمند ویژوال، رنگ، حرکت و ریتم متناسب می‌سازد.</p>

      <div class="input-card">
        <label for="script">متن یا موضوع موشن‌گرافی</label>
        <textarea id="script" placeholder="مثال: توضیح قانون بیضی با دو کانون&#10;یا: داستان رباتی که می‌خواهد آشپز شود و صبر یاد می‌گیرد&#10;یا: تداخل سازنده و ویرانگر امواج"></textarea>

        <div class="theme-row" id="themes">
          <button class="theme-btn active" data-theme="auto">خودکار</button>
          <button class="theme-btn" data-theme="science">علمی</button>
          <button class="theme-btn" data-theme="story">داستانی</button>
          <button class="theme-btn" data-theme="abstract">انتزاعی</button>
          <button class="theme-btn" data-theme="nature">طبیعت</button>
        </div>

        <button class="generate-btn" id="generate">تولید موشن‌گرافی حرفه‌ای</button>
      </div>

      <div class="examples">
        <span>نمونه‌های سریع</span>
        <div class="example-chips">
          <div class="chip" data-text="بیضی: مجموع فاصله هر نقطه تا دو کانون همیشه ثابت است">بیضی و کانون‌ها</div>
          <div class="chip" data-text="وقتی دو موج هم‌فرکانس هم‌فاز باشند تداخل سازنده و اگر اختلاف فاز ۱۸۰ درجه باشد تداخل ویرانگر رخ می‌دهد">تداخل موج</div>
          <div class="chip" data-text="ربات کوچکی تصمیم گرفت آشپز شود. اولین کارش پختن املت بود. منتظر ماند اما املت نپخت. فهمید آشپزی یعنی صبر">ربات آشپز</div>
        </div>
      </div>
    </div>

    <!-- PLAYER SCREEN -->
    <div id="player-screen">
      <div class="player-top">
        <button class="back-btn" id="back">← بازگشت</button>
        <div class="mode-indicator" id="modeLabel">علمی</div>
      </div>

      <div id="stage">
        <canvas id="c"></canvas>
      </div>

      <div class="caption-overlay">
        <div class="caption-text" id="caption">—</div>
        <div class="player-controls">
          <button class="ctrl-btn" id="restart" title="شروع مجدد">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/></svg>
          </button>
          <button class="ctrl-btn play" id="playPause">
            <svg id="iconPlay" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg id="iconPause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>
          </button>
        </div>
      </div>

      <div class="progress-track"><div class="progress-bar" id="progress"></div></div>

      <div class="loading-overlay" id="loading">
        <div class="loader"></div>
        <div class="loading-text">در حال ساخت موشن‌گرافی حرفه‌ای...</div>
      </div>
    </div>
  </div>

  <script>
    // ===================== ENGINE CORE =====================
    const $ = sel => document.querySelector(sel);
    const $$ = sel => document.querySelectorAll(sel);

    const inputScreen = $('#input-screen');
    const playerScreen = $('#player-screen');
    const canvas = $('#c');
    const ctx = canvas.getContext('2d');
    const captionEl = $('#caption');
    const progressEl = $('#progress');
    const modeLabel = $('#modeLabel');
    const loading = $('#loading');
    const scriptInput = $('#script');

    let W, H, dpr;
    let animId = null;
    let playing = true;
    let startTime = 0;
    let elapsed = 0;
    let duration = 16000;
    let currentTheme = 'auto';
    let engine = null; // active visual engine

    // Theme detection from text
    function detectTheme(text) {
      const t = text.toLowerCase();
      if (/بیضی|کانون|دایره|هندسه|ریاضی|فاصله|موج|تداخل|فیزیک|نور|صوت|فرکانس|فاز/.test(t)) return 'science';
      if (/ربات|داستان|صبر|آشپز|املت|تصمیم|یاد|احساس|عاشق|غم|شادی/.test(t)) return 'story';
      if (/طبیعت|درخت|آسمان|دریا|فصل|باران|گل|خورشید/.test(t)) return 'nature';
      if (/انتزاع|رنگ|شکل|هندسی|الگو|ریتم/.test(t)) return 'abstract';
      return 'science';
    }

    // Color palettes
    const palettes = {
      science: {
        bg: '#05070d',
        primary: '#22d3ee',
        secondary: '#818cf8',
        accent: '#34d399',
        danger: '#f87171',
        text: '#f1f5f9',
        muted: '#64748b',
        particle: 'rgba(34,211,238,0.6)'
      },
      story: {
        bg: '#0c0a09',
        primary: '#fbbf24',
        secondary: '#f472b6',
        accent: '#38bdf8',
        danger: '#fb7185',
        text: '#fafaf9',
        muted: '#a8a29e',
        particle: 'rgba(251,191,36,0.5)'
      },
      abstract: {
        bg: '#09090b',
        primary: '#e879f9',
        secondary: '#22d3ee',
        accent: '#a3e635',
        danger: '#f43f5e',
        text: '#fafafa',
        muted: '#71717a',
        particle: 'rgba(232,121,249,0.55)'
      },
      nature: {
        bg: '#052e16',
        primary: '#4ade80',
        secondary: '#2dd4bf',
        accent: '#facc15',
        danger: '#f87171',
        text: '#f0fdf4',
        muted: '#86efac',
        particle: 'rgba(74,222,128,0.5)'
      }
    };

    // ===================== VISUAL ENGINES =====================

    // --- SCIENCE: Ellipse / Wave / Generic geometric ---
    function createScienceEngine(text, palette) {
      const isEllipse = /بیضی|کانون|فاصله/.test(text);
      const isWave = /موج|تداخل|فاز|فرکانس/.test(text);

      let t = 0;
      const particles = Array.from({length: 60}, () => ({
        x: Math.random(),
        y: Math.random(),
        r: Math.random() * 1.5 + 0.5,
        speed: Math.random() * 0.0003 + 0.0001,
        phase: Math.random() * Math.PI * 2
      }));

      const captions = isEllipse ? [
        { at: 0, text: 'بیضی فقط یک دایرهٔ کشیده نیست.' },
        { at: 0.18, text: 'دو نقطهٔ ثابت به نام کانون دارد.' },
        { at: 0.38, text: 'هر نقطه روی بیضی را انتخاب کن...' },
        { at: 0.55, text: 'فاصله‌اش تا هر دو کانون را اندازه بگیر.' },
        { at: 0.72, text: 'جمع این دو فاصله همیشه ثابت می‌ماند.' },
        { at: 0.88, text: 'همین قانون، شکل بیضی را تعریف می‌کند.' }
      ] : isWave ? [
        { at: 0, text: 'وقتی دو موج هم‌فرکانس به هم می‌رسند...' },
        { at: 0.2, text: 'اگر هم‌فاز باشند، دامنه‌ها جمع می‌شوند.' },
        { at: 0.42, text: 'این تداخل سازنده است — موجی قوی‌تر.' },
        { at: 0.62, text: 'اگر اختلاف فاز نیم‌طول‌موج باشد...' },
        { at: 0.78, text: 'تداخل ویرانگر رخ می‌دهد و موج تضعیف می‌شود.' },
        { at: 0.92, text: 'فاز، سرنوشت تداخل را تعیین می‌کند.' }
      ] : [
        { at: 0, text: text.slice(0, 60) + (text.length > 60 ? '...' : '') },
        { at: 0.3, text: 'حرکت، ریتم و هماهنگی...' },
        { at: 0.6, text: 'هر جزء در خدمت مفهوم کلی است.' },
        { at: 0.85, text: 'زیبایی در دقت نهفته است.' }
      ];

      return {
        duration: 15000,
        captions,
        update(dt, progress) {
          t += dt;
        },
        draw(ctx, W, H, progress) {
          // Background glow
          const g = ctx.createRadialGradient(W/2, H*0.4, 0, W/2, H*0.4, H*0.6);
          g.addColorStop(0, palette.primary + '15');
          g.addColorStop(1, 'transparent');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);

          // Particles
          particles.forEach(p => {
            p.phase += p.speed * 16;
            const px = p.x * W + Math.sin(p.phase) * 20;
            const py = p.y * H + Math.cos(p.phase * 0.7) * 15;
            ctx.beginPath();
            ctx.arc(px, py, p.r, 0, Math.PI*2);
            ctx.fillStyle = palette.particle;
            ctx.globalAlpha = 0.4 + Math.sin(p.phase) * 0.3;
            ctx.fill();
          });
          ctx.globalAlpha = 1;

          if (isEllipse) {
            drawEllipseScene(ctx, W, H, t, palette);
          } else if (isWave) {
            drawWaveScene(ctx, W, H, t, progress, palette);
          } else {
            drawGenericGeo(ctx, W, H, t, palette);
          }
        }
      };
    }

    function drawEllipseScene(ctx, W, H, t, pal) {
      const cx = W/2, cy = H*0.42;
      const a = Math.min(W, H) * 0.32;
      const b = a * 0.58;
      const c = Math.sqrt(a*a - b*b);

      // Soft ellipse glow
      ctx.beginPath();
      ctx.ellipse(cx, cy, a+20, b+20, 0, 0, Math.PI*2);
      const eg = ctx.createRadialGradient(cx, cy, 0, cx, cy, a+20);
      eg.addColorStop(0, pal.primary + '18');
      eg.addColorStop(1, 'transparent');
      ctx.fillStyle = eg;
      ctx.fill();

      // Ellipse stroke
      ctx.beginPath();
      ctx.ellipse(cx, cy, a, b, 0, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(148,163,184,0.45)';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Foci
      const f1 = cx - c, f2 = cx + c;
      [f1, f2].forEach(fx => {
        const gg = ctx.createRadialGradient(fx, cy, 0, fx, cy, 26);
        gg.addColorStop(0, pal.primary + '55');
        gg.addColorStop(1, 'transparent');
        ctx.fillStyle = gg;
        ctx.beginPath(); ctx.arc(fx, cy, 26, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = pal.primary;
        ctx.beginPath(); ctx.arc(fx, cy, 6, 0, Math.PI*2); ctx.fill();
      });

      // Moving point
      const ang = t * 0.0007;
      const px = cx + a * Math.cos(ang);
      const py = cy + b * Math.sin(ang);

      // Distance lines
      ctx.setLineDash([5, 5]);
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = pal.secondary + '99';
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(f1, cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(f2, cy); ctx.stroke();
      ctx.setLineDash([]);

      // Point
      const pg = ctx.createRadialGradient(px, py, 0, px, py, 20);
      pg.addColorStop(0, pal.secondary + '66');
      pg.addColorStop(1, 'transparent');
      ctx.fillStyle = pg;
      ctx.beginPath(); ctx.arc(px, py, 20, 0, Math.PI*2); ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(px, py, 5.5, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = pal.secondary;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function drawWaveScene(ctx, W, H, t, progress, pal) {
      const mid = H * 0.4;
      const A = 38;
      const k = 0.016;
      const omega = 0.004;

      // Phase morphs over time
      const phaseDiff = progress < 0.5 
        ? 0 
        : Math.min(Math.PI, (progress - 0.5) * 2 * Math.PI);

      function waveY(x, phase, amp = A) {
        return mid + amp * Math.sin(k * x - omega * t + phase);
      }

      // Wave 1
      ctx.beginPath();
      for (let x = 0; x <= W; x += 3) {
        const y = waveY(x, 0);
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = pal.primary + 'aa';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Wave 2
      ctx.beginPath();
      for (let x = 0; x <= W; x += 3) {
        const y = waveY(x, phaseDiff);
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = pal.secondary + 'aa';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Resultant
      ctx.beginPath();
      for (let x = 0; x <= W; x += 3) {
        const y = mid + A * Math.sin(k*x - omega*t) + A * Math.sin(k*x - omega*t + phaseDiff);
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = '#f8fafc';
      ctx.lineWidth = 3.2;
      ctx.shadowColor = pal.primary;
      ctx.shadowBlur = 12;
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Labels
      ctx.font = '600 12px Vazirmatn';
      ctx.fillStyle = pal.muted;
      ctx.textAlign = 'right';
      ctx.fillText(phaseDiff < 0.3 ? 'تداخل سازنده' : phaseDiff > 2.5 ? 'تداخل ویرانگر' : 'در حال تغییر فاز', W - 16, mid - A - 24);
    }

    function drawGenericGeo(ctx, W, H, t, pal) {
      const cx = W/2, cy = H*0.4;
      for (let i = 0; i < 5; i++) {
        const r = 40 + i * 35 + Math.sin(t * 0.001 + i) * 8;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI*2);
        ctx.strokeStyle = pal.primary + (30 - i*5).toString(16);
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    // --- STORY ENGINE ---
    function createStoryEngine(text, palette) {
      let t = 0;
      const captions = [
        { at: 0, text: 'ربات کوچکی تصمیم گرفت آشپز شود.' },
        { at: 0.16, text: 'اولین کارش پختن یک املت بود.' },
        { at: 0.32, text: 'تخم‌مرغ را با دقت اندازه گرفت و شکست.' },
        { at: 0.5, text: 'ده دقیقه منتظر ماند تا خودش بپزد...' },
        { at: 0.68, text: 'املت پخته نشد.' },
        { at: 0.8, text: 'ولی ربات فهمید: آشپزی یعنی صبر.' },
        { at: 0.92, text: 'صبر، اصلی‌ترین مادهٔ هر دستور پخت است.' }
      ];

      return {
        duration: 17000,
        captions,
        update(dt) { t += dt; },
        draw(ctx, W, H, progress) {
          const cx = W/2;
          const baseY = H * 0.58;

          // Warm ambient
          const g = ctx.createRadialGradient(cx, baseY - 40, 0, cx, baseY - 40, H*0.5);
          g.addColorStop(0, palette.primary + '12');
          g.addColorStop(1, 'transparent');
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);

          // Floor line
          ctx.strokeStyle = 'rgba(255,255,255,0.04)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(40, baseY + 50);
          ctx.lineTo(W-40, baseY + 50);
          ctx.stroke();

          // Pan
          drawStoryPan(ctx, cx + 80, baseY + 20, progress, palette);

          // Robot
          const robotX = cx - 90;
          const bounce = progress > 0.5 && progress < 0.7 ? Math.sin(t * 0.008) * 3 : 0;
          drawStoryRobot(ctx, robotX, baseY - 20 + bounce, t, progress, palette);
        }
      };
    }

    function drawStoryRobot(ctx, x, y, t, progress, pal) {
      ctx.save();
      ctx.translate(x, y);

      // Body
      ctx.fillStyle = '#1e293b';
      roundRect(ctx, -26, -8, 52, 64, 12);
      ctx.fill();

      // Chest glow
      ctx.fillStyle = pal.accent;
      ctx.globalAlpha = 0.7 + Math.sin(t * 0.005) * 0.25;
      roundRect(ctx, -10, 10, 20, 9, 4);
      ctx.fill();
      ctx.globalAlpha = 1;

      // Head
      ctx.fillStyle = '#334155';
      roundRect(ctx, -20, -44, 40, 36, 10);
      ctx.fill();

      // Eyes
      const look = progress > 0.65 ? 3 : (progress > 0.4 ? 1 : -2);
      ctx.fillStyle = pal.accent;
      ctx.beginPath();
      ctx.arc(-8, -28 + look, 4.5, 0, Math.PI*2);
      ctx.arc(8, -28 + look, 4.5, 0, Math.PI*2);
      ctx.fill();

      // Antenna
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -44);
      ctx.lineTo(0, -58);
      ctx.stroke();
      ctx.fillStyle = pal.primary;
      ctx.beginPath();
      ctx.arc(0, -60, 3.5, 0, Math.PI*2);
      ctx.fill();

      // Arms
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      const armSwing = Math.sin(t * 0.004) * 10;
      ctx.beginPath();
      ctx.moveTo(-26, 8);
      ctx.lineTo(-40, 28 + armSwing);
      ctx.moveTo(26, 8);
      ctx.lineTo(40, 28 - armSwing * 0.7);
      ctx.stroke();

      ctx.restore();
    }

    function drawStoryPan(ctx, x, y, progress, pal) {
      ctx.save();
      ctx.translate(x, y);

      // Stove
      ctx.fillStyle = '#1e293b';
      roundRect(ctx, -48, 18, 96, 16, 6);
      ctx.fill();

      // Heat glow
      if (progress > 0.3) {
        const hg = ctx.createRadialGradient(0, 10, 0, 0, 10, 45);
        hg.addColorStop(0, 'rgba(251,146,60,0.3)');
        hg.addColorStop(1, 'transparent');
        ctx.fillStyle = hg;
        ctx.beginPath();
        ctx.arc(0, 10, 45, 0, Math.PI*2);
        ctx.fill();
      }

      // Pan
      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.ellipse(0, 6, 46, 13, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.strokeStyle = '#475569';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Handle
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(46, 6);
      ctx.lineTo(74, 2);
      ctx.stroke();

      // Egg
      if (progress > 0.28) {
        const cooked = Math.min(1, (progress - 0.28) / 0.4);
        ctx.fillStyle = cooked > 0.5 ? '#fde68a' : '#fef3c7';
        ctx.beginPath();
        ctx.ellipse(0, 3, 26, 8, 0, 0, Math.PI*2);
        ctx.fill();
        if (cooked < 0.4) {
          ctx.fillStyle = '#fbbf24';
          ctx.beginPath();
          ctx.arc(0, 2, 7, 0, Math.PI*2);
          ctx.fill();
        }
      }

      ctx.restore();
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // --- ABSTRACT / NATURE fallback ---
    function createAbstractEngine(text, palette) {
      let t = 0;
      const blobs = Array.from({length: 7}, (_, i) => ({
        x: 0.2 + Math.random() * 0.6,
        y: 0.2 + Math.random() * 0.5,
        r: 40 + Math.random() * 60,
        speed: 0.0002 + Math.random() * 0.0003,
        phase: Math.random() * Math.PI * 2
      }));

      return {
        duration: 14000,
        captions: [
          { at: 0, text: text.slice(0, 70) + (text.length > 70 ? '...' : '') },
          { at: 0.35, text: 'فرم‌ها در حرکت‌اند...' },
          { at: 0.65, text: 'هر تغییر، بخشی از روایت بصری است.' },
          { at: 0.88, text: 'زیبایی در جریان مداوم نهفته است.' }
        ],
        update(dt) { t += dt; },
        draw(ctx, W, H) {
          blobs.forEach((b, i) => {
            b.phase += b.speed * 16;
            const px = b.x * W + Math.sin(b.phase) * 30;
            const py = b.y * H + Math.cos(b.phase * 0.8) * 20;
            const gr = ctx.createRadialGradient(px, py, 0, px, py, b.r);
            const col = i % 2 === 0 ? palette.primary : palette.secondary;
            gr.addColorStop(0, col + '40');
            gr.addColorStop(1, 'transparent');
            ctx.fillStyle = gr;
            ctx.beginPath();
            ctx.arc(px, py, b.r, 0, Math.PI*2);
            ctx.fill();
          });
        }
      };
    }

    // ===================== MAIN LOOP & UI =====================
    function resize() {
      const stage = $('#stage');
      const rect = stage.getBoundingClientRect();
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = rect.width;
      H = rect.height;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function setCaption(text) {
      if (captionEl.textContent === text) return;
      captionEl.classList.add('exit');
      setTimeout(() => {
        captionEl.textContent = text;
        captionEl.classList.remove('exit');
      }, 220);
    }

    function getCaptionAt(progress, captions) {
      let txt = captions[0].text;
      for (const c of captions) {
        if (progress >= c.at) txt = c.text;
      }
      return txt;
    }

    function loop(now) {
      if (!startTime) startTime = now;
      if (playing) {
        elapsed = now - startTime;
      }

      const progress = Math.min(1, elapsed / duration);
      progressEl.style.width = (progress * 100) + '%';

      if (engine) {
        engine.update(16, progress); // approx dt
        ctx.clearRect(0, 0, W, H);
        // subtle bg
        ctx.fillStyle = engine.palette ? engine.palette.bg : '#05070d';
        ctx.fillRect(0, 0, W, H);
        engine.draw(ctx, W, H, progress);
        setCaption(getCaptionAt(progress, engine.captions));
      }

      if (progress >= 1) {
        playing = false;
        $('#iconPlay').style.display = 'block';
        $('#iconPause').style.display = 'none';
      }

      animId = requestAnimationFrame(loop);
    }

    function startEngine(text, theme) {
      loading.classList.add('show');
      
      setTimeout(() => {
        const detected = theme === 'auto' ? detectTheme(text) : theme;
        const palette = palettes[detected] || palettes.science;
        modeLabel.textContent = { science: 'علمی', story: 'داستانی', abstract: 'انتزاعی', nature: 'طبیعت' }[detected] || detected;

        if (detected === 'story' || /ربات|آشپز|صبر|املت|داستان/.test(text)) {
          engine = createStoryEngine(text, palette);
        } else if (detected === 'science' || /بیضی|موج|تداخل|کانون|فیزیک|هندسه/.test(text)) {
          engine = createScienceEngine(text, palette);
        } else {
          engine = createAbstractEngine(text, palette);
        }
        engine.palette = palette;
        duration = engine.duration;

        elapsed = 0;
        startTime = 0;
        playing = true;
        $('#iconPlay').style.display = 'none';
        $('#iconPause').style.display = 'block';

        resize();
        loading.classList.remove('show');
        if (animId) cancelAnimationFrame(animId);
        animId = requestAnimationFrame(loop);
      }, 900);
    }

    // UI Events
    $('#generate').addEventListener('click', () => {
      const text = scriptInput.value.trim();
      if (!text) {
        scriptInput.focus();
        return;
      }
      inputScreen.classList.add('hidden');
      playerScreen.classList.add('active');
      startEngine(text, currentTheme);
    });

    $('#back').addEventListener('click', () => {
      playerScreen.classList.remove('active');
      inputScreen.classList.remove('hidden');
      if (animId) cancelAnimationFrame(animId);
      playing = false;
    });

    $('#playPause').addEventListener('click', () => {
      playing = !playing;
      if (playing) {
        startTime = performance.now() - elapsed;
        $('#iconPlay').style.display = 'none';
        $('#iconPause').style.display = 'block';
      } else {
        $('#iconPlay').style.display = 'block';
        $('#iconPause').style.display = 'none';
      }
    });

    $('#restart').addEventListener('click', () => {
      elapsed = 0;
      startTime = 0;
      playing = true;
      $('#iconPlay').style.display = 'none';
      $('#iconPause').style.display = 'block';
    });

    // Theme buttons
    $$('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        $$('.theme-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTheme = btn.dataset.theme;
      });
    });

    // Example chips
    $$('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        scriptInput.value = chip.dataset.text;
      });
    });

    window.addEventListener('resize', () => {
      if (playerScreen.classList.contains('active')) resize();
    });
  </script>
</body>
