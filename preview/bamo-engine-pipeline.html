<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAMO Pipeline Engine</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05070d; }
    canvas { display: block; width: 100%; height: 100%; }
    #caption {
      position: fixed; bottom: 8%; left: 5%; right: 5%;
      text-align: center; color: white; font-family: 'Vazirmatn', sans-serif;
      font-size: clamp(22px, 4.2vw, 38px); font-weight: 600;
      text-shadow: 0 2px 12px rgba(0,0,0,0.7); line-height: 1.45;
      pointer-events: none; z-index: 10;
      transition: opacity 0.25s;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="caption"></div>

  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const captionEl = document.getElementById('caption');

    let W, H, dpr;
    let project = null;
    let sceneIndex = 0;
    let sceneTime = 0;
    let globalTime = 0;
    let playing = false;
    let lastNow = 0;
    let currentPalette = null;
    let particles = [];

    window.BAMO = {
      loadProject(p) {
        project = p;
        sceneIndex = 0;
        sceneTime = 0;
        globalTime = 0;
        initParticles();
        currentPalette = choosePalette(project.scenes[0] || {});
        resize();
        draw();
        return true;
      },
      play() { playing = true; lastNow = performance.now(); },
      pause() { playing = false; },
      seek(seconds) {
        let acc = 0;
        for (let i = 0; i < project.scenes.length; i++) {
          const d = project.scenes[i].duration;
          if (acc + d > seconds) {
            sceneIndex = i;
            sceneTime = seconds - acc;
            break;
          }
          acc += d;
        }
        draw();
      },
      getState() {
        return { sceneIndex, sceneTime, globalTime, totalDuration: totalDuration(), playing };
      },
      ready: false
    };

    function totalDuration() {
      if (!project) return 0;
      return project.scenes.reduce((s, sc) => s + sc.duration, 0);
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = 720;
      H = 1280;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function choosePalette(scene) {
      const text = ((scene.narration || '') + ' ' + (scene.visual_prompt || '') + ' ' + (scene.text || '')).toLowerCase();
      if (/صبر|امید|نور|توکل|آرامش|قلب|دعا/.test(text)) {
        return { bg: '#0c0a09', primary: '#fbbf24', secondary: '#f472b6', accent: '#38bdf8', particle: 'rgba(251,191,36,0.45)' };
      }
      if (/رشد|پیشرفت|آینده|موفق|قدم|مسیر/.test(text)) {
        return { bg: '#052e16', primary: '#4ade80', secondary: '#2dd4bf', accent: '#facc15', particle: 'rgba(74,222,128,0.4)' };
      }
      if (/فکر|ذهن|تصمیم|انتخاب|دو راه/.test(text)) {
        return { bg: '#111827', primary: '#a78bfa', secondary: '#22d3ee', accent: '#e879f9', particle: 'rgba(167,139,250,0.45)' };
      }
      return { bg: '#05070d', primary: '#22d3ee', secondary: '#818cf8', accent: '#34d399', particle: 'rgba(34,211,238,0.4)' };
    }

    function initParticles() {
      particles = Array.from({length: 55}, () => ({
        x: Math.random(), y: Math.random(),
        r: Math.random() * 1.8 + 0.4,
        speed: Math.random() * 0.0004 + 0.0001,
        phase: Math.random() * Math.PI * 2
      }));
    }

    function analyzeScene(scene) {
      const t = ((scene.narration || '') + ' ' + (scene.visual_prompt || '')).toLowerCase();
      if (/بیضی|کانون|فاصله ثابت/.test(t)) return 'ellipse';
      if (/موج|تداخل|فاز|فرکانس/.test(t)) return 'wave';
      if (/مسیر|قدم|رشد|پله|آینده/.test(t)) return 'path';
      if (/نور|طلوع|امید|قلب/.test(t)) return 'light';
      if (/انتخاب|دو راه|تصمیم/.test(t)) return 'choice';
      return 'abstract';
    }

    function drawBackground(pal) {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, pal.bg);
      g.addColorStop(1, shade(pal.bg, 0.7));
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
      const vg = ctx.createRadialGradient(W/2, H/2, H*0.2, W/2, H/2, H*0.7);
      vg.addColorStop(0, 'transparent');
      vg.addColorStop(1, 'rgba(0,0,0,0.35)');
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, W, H);
    }

    function shade(hex, factor) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return `rgb(${Math.round(r*factor)},${Math.round(g*factor)},${Math.round(b*factor)})`;
    }

    function drawParticles(pal, t) {
      particles.forEach(p => {
        p.phase += p.speed * 16;
        const px = p.x * W + Math.sin(p.phase) * 18;
        const py = p.y * H + Math.cos(p.phase * 0.7) * 12;
        ctx.beginPath();
        ctx.arc(px, py, p.r, 0, Math.PI*2);
        ctx.fillStyle = pal.particle;
        ctx.globalAlpha = 0.35 + Math.sin(p.phase) * 0.25;
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function drawEllipse(pal, t) {
      const cx = W/2, cy = H*0.42;
      const a = Math.min(W, H) * 0.28;
      const b = a * 0.58;
      const c = Math.sqrt(a*a - b*b);
      ctx.beginPath();
      ctx.ellipse(cx, cy, a, b, 0, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(148,163,184,0.5)';
      ctx.lineWidth = 3;
      ctx.stroke();
      [cx - c, cx + c].forEach(fx => {
        const gg = ctx.createRadialGradient(fx, cy, 0, fx, cy, 22);
        gg.addColorStop(0, pal.primary + '60');
        gg.addColorStop(1, 'transparent');
        ctx.fillStyle = gg;
        ctx.beginPath(); ctx.arc(fx, cy, 22, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = pal.primary;
        ctx.beginPath(); ctx.arc(fx, cy, 6, 0, Math.PI*2); ctx.fill();
      });
      const ang = t * 0.9;
      const px = cx + a * Math.cos(ang);
      const py = cy + b * Math.sin(ang);
      ctx.setLineDash([6, 5]);
      ctx.strokeStyle = pal.secondary + 'aa';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(cx - c, cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(cx + c, cy); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI*2); ctx.fill();
    }

    function drawWave(pal, t, progress) {
      const mid = H * 0.4;
      const A = 42;
      const k = 0.015;
      const phaseDiff = progress < 0.45 ? 0 : Math.min(Math.PI, (progress - 0.45) * 2.2 * Math.PI);
      function yOf(x, phase) { return mid + A * Math.sin(k * x - t * 2.8 + phase); }
      ctx.beginPath();
      for (let x = 0; x <= W; x += 4) { const y = yOf(x, 0); x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
      ctx.strokeStyle = pal.primary + 'bb'; ctx.lineWidth = 3; ctx.stroke();
      ctx.beginPath();
      for (let x = 0; x <= W; x += 4) { const y = yOf(x, phaseDiff); x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
      ctx.strokeStyle = pal.secondary + 'bb'; ctx.lineWidth = 3; ctx.stroke();
      ctx.beginPath();
      for (let x = 0; x <= W; x += 4) {
        const y = mid + A * Math.sin(k*x - t*2.8) + A * Math.sin(k*x - t*2.8 + phaseDiff);
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 4;
      ctx.shadowColor = pal.primary; ctx.shadowBlur = 14; ctx.stroke(); ctx.shadowBlur = 0;
    }

    function drawPath(pal, t) {
      const cx = W/2, cy = H*0.48;
      ctx.strokeStyle = pal.primary + 'cc'; ctx.lineWidth = 5; ctx.lineCap = 'round';
      ctx.beginPath();
      for (let i = 0; i <= 40; i++) {
        const u = i / 40;
        const x = cx + Math.sin(u * Math.PI * 1.5 + t * 0.6) * 90 * u;
        const y = cy - 180 + u * 320;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
      for (let i = 0; i < 5; i++) {
        const u = (i + 0.5) / 5;
        const x = cx + Math.sin(u * Math.PI * 1.5 + t * 0.6) * 90 * u;
        const y = cy - 180 + u * 320;
        ctx.fillStyle = pal.primary;
        ctx.globalAlpha = 0.7 + 0.3 * Math.sin(t * 2 + i);
        ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function drawLight(pal, t) {
      const cx = W/2, cy = H*0.38;
      for (let i = 5; i >= 0; i--) {
        const r = 40 + i * 38 + Math.sin(t * 1.5 + i) * 8;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, pal.primary + (40 - i * 6).toString(16));
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      }
    }

    function drawChoice(pal, t) {
      const cx = W/2, cy = H*0.5;
      for (const side of [-1, 1]) {
        ctx.strokeStyle = side === 1 ? pal.primary : pal.secondary + '99';
        ctx.lineWidth = side === 1 ? 5 : 3;
        ctx.beginPath();
        ctx.moveTo(cx, cy + 120);
        ctx.quadraticCurveTo(cx + side * 140, cy, cx + side * 160, cy - 160);
        ctx.stroke();
      }
    }

    function drawAbstract(pal, t) {
      for (let i = 0; i < 6; i++) {
        const x = W * (0.2 + 0.12 * i) + Math.sin(t * 0.8 + i) * 20;
        const y = H * 0.4 + Math.cos(t * 0.6 + i * 0.7) * 40;
        const r = 30 + i * 12;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, (i % 2 ? pal.primary : pal.secondary) + '50');
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
      }
    }

    function draw() {
      if (!project || !project.scenes.length) return;
      const scene = project.scenes[sceneIndex];
      const progress = Math.min(1, sceneTime / scene.duration);
      currentPalette = choosePalette(scene);
      drawBackground(currentPalette);
      drawParticles(currentPalette, globalTime);
      const kind = analyzeScene(scene);
      if (kind === 'ellipse') drawEllipse(currentPalette, sceneTime);
      else if (kind === 'wave') drawWave(currentPalette, sceneTime, progress);
      else if (kind === 'path') drawPath(currentPalette, sceneTime);
      else if (kind === 'light') drawLight(currentPalette, sceneTime);
      else if (kind === 'choice') drawChoice(currentPalette, sceneTime);
      else drawAbstract(currentPalette, sceneTime);
      captionEl.textContent = scene.text || '';
      captionEl.style.opacity = progress < 0.08 || progress > 0.92 ? 0.3 + progress * 2 : 1;
    }

    function loop(now) {
      if (!lastNow) lastNow = now;
      const dt = (now - lastNow) / 1000;
      lastNow = now;
      if (playing && project) {
        sceneTime += dt;
        globalTime += dt;
        const scene = project.scenes[sceneIndex];
        if (sceneTime >= scene.duration) {
          sceneTime = 0;
          sceneIndex++;
          if (sceneIndex >= project.scenes.length) {
            playing = false;
            sceneIndex = project.scenes.length - 1;
            sceneTime = project.scenes[sceneIndex].duration;
          }
        }
        draw();
      }
      requestAnimationFrame(loop);
    }

    resize();
    window.addEventListener('resize', resize);

    try {
      const params = new URLSearchParams(location.search);
      if (params.get('project')) {
        const raw = atob(params.get('project'));
        window.BAMO.loadProject(JSON.parse(raw));
      }
    } catch (e) {}

    if (window.BAMO_PROJECT) {
      window.BAMO.loadProject(window.BAMO_PROJECT);
    }

    window.BAMO.ready = true;
    requestAnimationFrame(loop);
    setTimeout(() => { if (project) window.BAMO.play(); }, 300);
  </script>
</body>
</html>
