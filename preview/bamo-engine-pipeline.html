const fragment=`
precision highp float;
uniform vec2 u_resolution;
uniform float u_time,u_progress,u_kind,u_phase;
uniform vec3 u_primary,u_secondary,u_accent,u_bg;
#define MAX_STEPS 92
#define MAX_DIST 36.0
#define SURF_DIST 0.0015
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float sdSphere(vec3 p,float r){return length(p)-r;}
float sdTorus(vec3 p,vec2 t){vec2 q=vec2(length(p.xz)-t.x,p.y);return length(q)-t.y;}
float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0);}
float sdCapsule(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);return length(pa-ba*h)-r;}
float sdEllipsoid(vec3 p,vec3 r){float k0=length(p/r);float k1=length(p/(r*r));return k0*(k0-1.0)/max(k1,.0001);}
float sceneSDF(vec3 p){
 float t=u_time;
 p.xz=rot(0.12*sin(t*.22)+u_phase*.035)*p.xz;
 p.xy=rot(.10*cos(t*.19))*p.xy;
 if(u_kind<.5){
   float ring=sdTorus(p,vec2(1.08,.055));
   float core=sdSphere(p, .37+.06*sin(t*1.8));
   float orbit=sdSphere(p-vec3(1.08*cos(t*1.1),.0,1.08*sin(t*1.1)),.105);
   return min(min(ring,core),orbit);
 }else if(u_kind<1.5){
   float wave=abs(p.y-(.30*sin(p.x*3.2-t*2.2)+.18*sin(p.x*5.1+t*1.4)))-.035;
   float slab=max(wave,abs(p.z)-.11);
   float wave2=abs(p.y-(.30*sin(p.x*3.2-t*2.2+u_progress*3.14159)+.18*sin(p.x*5.1+t*1.4))+.43)-.035;
   float slab2=max(wave2,abs(p.z)-.11);
   float sum=min(slab,slab2);
   return min(sum,sdSphere(p-vec3(0,-.1,0),.13));
 }else if(u_kind<2.5){
   float road=sdCapsule(p,vec3(-.75,-.8,0),vec3(-.25,.0,0),.075);
   road=min(road,sdCapsule(p,vec3(-.25,0,0),vec3(.5,.65,0),.075));
   road=min(road,sdCapsule(p,vec3(.5,.65,0),vec3(.85,.95,0),.075));
   float bead=sdSphere(p-vec3(.5+.30*sin(t*.9),.65+.30*sin(t*.9),0),.14);
   return min(road,bead);
 }else if(u_kind<3.5){
   float orb=sdSphere(p, .68+.08*sin(t*1.5));
   float halo=sdTorus(p,vec2(1.02,.035));
   return min(orb,halo);
 }else if(u_kind<4.5){
   float left=sdCapsule(p,vec3(0,-.8,0),vec3(-.72,.62,0),.055);
   float right=sdCapsule(p,vec3(0,-.8,0),vec3(.72,.62,0),.055);
   return min(left,right);
 }else if(u_kind<5.5){
   float a=sdTorus(p,vec2(.75,.06));
   float b=sdTorus(p,vec2(.48,.045));
   p.xy=rot(1.05)*p.xy;
   return min(min(a,b),sdSphere(p,.22));
 }else if(u_kind>=6.5 && u_kind<7.5){
   // Saturn body and a separately orbiting icy moon. The ring is rendered
   // as thousands of discrete particles in the ray-plane pass below.
   float core=sdSphere(p,.62+.012*sin(t*1.7));
   vec3 moonPos=vec3(1.42*cos(t*.38),.09+.025*sin(t*.61),1.42*sin(t*.38));
   float moon=sdSphere(p-moonPos,.078);

 }else if(u_kind>=5.5 && u_kind<6.5){

   float r2=length(p.xz-vec2(.68,0.0));

   float waveB=sin(7.6*r2-t*1.8+u_phase);
   float height=.19*(waveA+waveB);
   float surface=abs(p.y-height)-.035;
   float edge=length(p.xz)-1.55;
   float sheet=max(surface,edge);
   float sourceA=sdSphere(p-vec3(-.68,0.0,0.0),.09);
   float sourceB=sdSphere(p-vec3(.68,0.0,0.0),.09);
   return min(sheet,min(sourceA,sourceB));
 }else if(u_kind>=7.5 && u_kind<8.5){

   roots=min(roots,sdCapsule(p,vec3(0,-.83,0),vec3(0,-1.48,0),.04));
   float branches=min(sdCapsule(p,vec3(0,.30,0),vec3(-.43,.62,0),.045),sdCapsule(p,vec3(0,.30,0),vec3(.43,.62,0),.045));
   float leaves=min(sdEllipsoid(p-vec3(-.66,.76,0),vec3(.39,.15,.12)),sdEllipsoid(p-vec3(.66,.76,0),vec3(.39,.15,.12)));
   leaves=min(leaves,sdEllipsoid(p-vec3(0,.99,0),vec3(.24,.11,.10)));

   float drops=10.0;
   for(int i=0;i<5;i++){float fi=float(i);float y=mod(t*.52+fi*.33,1.48)-.74;drops=min(drops,sdSphere(p-vec3(.0,y,.035),.034));}

 }else if(u_kind>=8.5 && u_kind<9.5){
   // Open-front xylem vessel: exposed lumen, distinct water column and visible

   laterals=min(laterals,sdCapsule(p,vec3(0,-.48,0),vec3(.46,-1.05,-.03),.032));
   float hairs=10.0;
   for(int i=0;i<7;i++){float fi=float(i);float y=.28-fi*.17;float side=mod(fi,2.0)<1.0?-1.0:1.0;hairs=min(hairs,sdCapsule(p,vec3(side*.075,y,0),vec3(side*(.34+.035*sin(fi)),y-.11,.025),.018));}
   float droplets=10.0;
   for(int i=0;i<5;i++){float fi=float(i);float x=-.62+fi*.31;droplets=min(droplets,sdSphere(p-vec3(x,-.62+.07*sin(t+fi),.04),.045));}
   return min(tap,min(laterals,min(hairs,droplets)));
 }else if(u_kind>=12.5 && u_kind<13.5){
   // Aurora scene: Earth, dipole-like magnetic loops, flowing auroral curtains,
   // and a stream of solar-wind particles. All geometry is ray-marched in 3D.
   float earth=sdSphere(p,.79);
   float field=10.0;
   for(int i=0;i<4;i++){
     float a=float(i)*1.5707963+t*.025+u_phase*.045;
     mat2 rr=rot(a);
     vec3 p0=vec3(0,.73,0),p1=vec3(.42,1.12,0),p2=vec3(.98,0,0),p3=vec3(.42,-1.12,0),p4=vec3(0,-.73,0);
     p0.xz=rr*p0.xz;p1.xz=rr*p1.xz;p2.xz=rr*p2.xz;p3.xz=rr*p3.xz;p4.xz=rr*p4.xz;
     field=min(field,sdCapsule(p,p0,p1,.012));
     field=min(field,sdCapsule(p,p1,p2,.012));
     field=min(field,sdCapsule(p,p2,p3,.012));
     field=min(field,sdCapsule(p,p3,p4,.012));
   }
   float curtains=10.0;
   for(int i=0;i<5;i++){
     float fi=float(i);
     float a=fi*1.256637+t*.035+u_phase*.10;
     float r0=.77+.035*sin(t*1.1+fi);
     float r1=.91+.075*sin(t*1.55+fi*1.7+u_phase);
     float r2=.87+.11*sin(t*1.2+fi*1.3);
     vec3 c0=vec3(r0*cos(a),.48,r0*sin(a));
     vec3 c1=vec3(r1*cos(a+.12*sin(t+fi)),.96,r1*sin(a+.12*sin(t+fi)));
     vec3 c2=vec3(r2*cos(a+.24*sin(t*.7+fi)),1.48,r2*sin(a+.24*sin(t*.7+fi)));
     curtains=min(curtains,sdCapsule(p,c0,c1,.031));
     curtains=min(curtains,sdCapsule(p,c1,c2,.024));
   }
   float solar=10.0;
   for(int i=0;i<8;i++){
     float fi=float(i);
     float x=-1.66+mod(t*.42+fi*.23,1.18);
     float y=.22+.20*sin(fi*2.1+t*.65);
     float z=.18*sin(fi*1.4+t*.35);
     solar=min(solar,sdSphere(p-vec3(x,y,z),.027));
   }
   return min(earth,min(field,min(curtains,solar)));
 }else if(u_kind>=13.5 && u_kind<14.5){
   // Whole Tokay gecko on a smooth vertical glass surface.
   float glass=sdBox(p-vec3(0.0,0.0,-.55),vec3(1.62,1.20,.035));
   float body=sdEllipsoid(p-vec3(-.06,0.0,0.0),vec3(.66,.22,.30));
   float chest=sdEllipsoid(p-vec3(.43,.015,0.0),vec3(.34,.24,.29));
   float head=sdEllipsoid(p-vec3(.70,.13,0.0),vec3(.30,.22,.26));
   float snout=sdEllipsoid(p-vec3(.91,.045,0.0),vec3(.20,.12,.20));
   float tail=min(sdCapsule(p,vec3(-.58,-.02,0.0),vec3(-.96,-.14,0.0),.15),
                  sdCapsule(p,vec3(-.96,-.14,0.0),vec3(-1.42,-.30,.015),.075));
   float legs=10.0;
   legs=min(legs,sdCapsule(p,vec3(.36,-.10,.20),vec3(.68,-.34,.49),.065));
   legs=min(legs,sdCapsule(p,vec3(.36,-.10,-.20),vec3(.68,-.34,-.49),.065));
   legs=min(legs,sdCapsule(p,vec3(-.43,-.10,.22),vec3(-.76,-.34,.48),.075));
   legs=min(legs,sdCapsule(p,vec3(-.43,-.10,-.22),vec3(-.76,-.34,-.48),.075));
   float feet=min(sdEllipsoid(p-vec3(.72,-.35,.52),vec3(.18,.055,.12)),
                  sdEllipsoid(p-vec3(.72,-.35,-.52),vec3(.18,.055,.12)));
   feet=min(feet,sdEllipsoid(p-vec3(-.80,-.35,.51),vec3(.17,.055,.12)));
   feet=min(feet,sdEllipsoid(p-vec3(-.80,-.35,-.51),vec3(.17,.055,.12)));
   float toes=10.0;
   for(int i=0;i<3;i++){
     float fi=float(i)-1.0;
     toes=min(toes,sdCapsule(p,vec3(.77,-.35,.52),vec3(.94,-.37,.52+fi*.075),.023));
     toes=min(toes,sdCapsule(p,vec3(.77,-.35,-.52),vec3(.94,-.37,-.52-fi*.075),.023));
   }
   float eyes=min(sdSphere(p-vec3(.78,.245,.205),.065),sdSphere(p-vec3(.78,.245,-.205),.065));
   return min(glass,min(min(body,chest),min(head,min(snout,min(tail,min(legs,min(feet,min(toes,eyes))))))));
 }else if(u_kind>=14.5 && u_kind<15.5){
   // Macro toe pad with five spreading digits and fine contact filaments.
   float glass=sdBox(p-vec3(0.0,0.0,-.49),vec3(1.18,.92,.035));
   float pad=sdEllipsoid(p-vec3(-.10,-.05,0.0),vec3(.34,.12,.28));
   float digits=10.0;
   float filaments=10.0;
   for(int i=0;i<5;i++){
     float fi=float(i)-2.0;
     vec3 base=vec3(.02,-.04,fi*.075);
     vec3 tip=vec3(.64+.035*cos(fi*1.2),-.055,fi*.16);
     digits=min(digits,sdCapsule(p,base,tip,.052));
     digits=min(digits,sdEllipsoid(p-tip,vec3(.12,.045,.075)));
     filaments=min(filaments,sdCapsule(p,tip+vec3(0,0,-.015),tip+vec3(.035,-.005,-.38),.012));
   }
   return min(glass,min(pad,min(digits,filaments)));
 }else if(u_kind>=15.5 && u_kind<16.5){
   // Magnified keratin setae branching into flattened spatula-like tips.
   float ground=sdBox(p-vec3(0.0,-.91,0.0),vec3(1.35,.035,.60));
   float cluster=10.0;
   for(int i=0;i<5;i++){
     float fi=float(i);
     float x=(fi-2.0)*.43;
     float shaft=sdCapsule(p,vec3(x,-.86,0.0),vec3(x,.36,0.0),.034);
     float branchL=sdCapsule(p,vec3(x,.30,0.0),vec3(x-.18,.67,0.0),.020);
     float branchR=sdCapsule(p,vec3(x,.30,0.0),vec3(x+.18,.67,0.0),.020);
     float tipL=sdEllipsoid(p-vec3(x-.23,.70,0.0),vec3(.105,.026,.085));
     float tipR=sdEllipsoid(p-vec3(x+.23,.70,0.0),vec3(.105,.026,.085));
     float tipC=sdEllipsoid(p-vec3(x,.76,0.0),vec3(.085,.023,.078));
     cluster=min(cluster,min(shaft,min(branchL,min(branchR,min(tipL,min(tipR,tipC))))));
   }
   return min(ground,cluster);
 }else if(u_kind>=16.5 && u_kind<17.5){
   // Contact close-up: spatula tips nearly touch a molecularly smooth substrate.
   float substrate=sdBox(p-vec3(0.0,.84,0.0),vec3(1.30,.045,.62));
   float hairs=10.0;
   float molecules=10.0;
   for(int i=0;i<5;i++){
     float fi=float(i);
     float x=(fi-2.0)*.43;
     hairs=min(hairs,sdCapsule(p,vec3(x,-.78,0.0),vec3(x,.54,0.0),.030));
     hairs=min(hairs,sdCapsule(p,vec3(x,.42,0.0),vec3(x-.16,.73,0.0),.018));
     hairs=min(hairs,sdCapsule(p,vec3(x,.42,0.0),vec3(x+.16,.73,0.0),.018));
     hairs=min(hairs,sdEllipsoid(p-vec3(x-.20,.755,0.0),vec3(.095,.020,.07)));
     hairs=min(hairs,sdEllipsoid(p-vec3(x+.20,.755,0.0),vec3(.095,.020,.07)));
     molecules=min(molecules,sdSphere(p-vec3(x,.785,.12),.026));
   }
   return min(substrate,min(hairs,molecules));
 }else{
   // A rising chain of water molecules joined by hydrogen-bond links.
   float chain=10.0;
   for(int i=0;i<5;i++){
     float fi=float(i);
     float y=mod(t*.50+fi*.36,1.72)-.86;
     vec3 c=vec3(.12*sin(fi*1.7+t*.25),y,.0);
     float molecule=sdSphere(p-c,.075);
     molecule=min(molecule,sdSphere(p-(c+vec3(.105,.055,0)),.043));
     molecule=min(molecule,sdSphere(p-(c+vec3(-.105,.055,0)),.043));
     float bond=sdCapsule(p,c,c+vec3(.105,.055,0),.018);
     bond=min(bond,sdCapsule(p,c,c+vec3(-.105,.055,0),.018));
     chain=min(chain,min(molecule,bond));
   }
   return chain;
 }
}
vec3 getNormal(vec3 p){vec2 e=vec2(.001,0);return normalize(vec3(sceneSDF(p+e.xyy)-sceneSDF(p-e.xyy),sceneSDF(p+e.yxy)-sceneSDF(p-e.yxy),sceneSDF(p+e.yyx)-sceneSDF(p-e.yyx)));}
float march(vec3 ro,vec3 rd,out vec3 hit){
 // Conservative scene-bound intersection skips background pixels before
 // expensive SDF ray marching, especially important on CPU SwiftShader.
 float b=dot(ro,rd);
 float c=dot(ro,ro)-1.8*1.8;
 float h=b*b-c;
 if(h<0.0)return MAX_DIST;
 float root=sqrt(h);
 float nearT=max(0.0,-b-root);
 float farT=-b+root;
 if(farT<=nearT)return MAX_DIST;
 float d=nearT;
 for(int i=0;i<MAX_STEPS;i++){
   if(d>farT)break;
   vec3 p=ro+rd*d;
   float dist=sceneSDF(p);
   if(dist<SURF_DIST){hit=p;return d;}
   d+=max(dist*.9,.002);
 }
 return MAX_DIST;
}
float hash21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*u_resolution)/u_resolution.y;
 float t=u_time;
 vec3 ro=vec3(3.1*sin(t*.18+u_phase*.12),1.25+.16*sin(t*.27),4.2*cos(t*.18+u_phase*.12));
 vec3 target=vec3(0,0,0);
 vec3 ww=normalize(target-ro),uu=normalize(cross(ww,vec3(0,1,0))),vv=cross(uu,ww);
 vec3 rd=normalize(uv.x*uu+uv.y*vv+1.75*ww);
 vec3 hit;float d=march(ro,rd,hit);
 vec3 col=u_bg;
 float stars=0.0;
 vec2 gv=fract(uv*vec2(95.,150.))-0.5;
 vec2 id=floor(uv*vec2(95.,150.));
 float rnd=fract(sin(dot(id,vec2(127.1,311.7)))*43758.5453);
 stars=step(.994,rnd)*pow(max(0.,1.-length(gv)*2.),4.)*(.45+.55*sin(t*1.7+rnd*20.));
 col+=vec3(.35,.55,.9)*stars;
 float haze=exp(-length(uv-vec2(.0,.08)) * 3.0);
 col+=u_primary*haze*.075;
 if(d<MAX_DIST){
   vec3 n=getNormal(hit);
   vec3 lightDir=normalize(vec3(-.6,1.1,1.4));
   float diff=max(dot(n,lightDir),0.0);
   float fres=pow(1.0-max(dot(n,-rd),0.0),3.0);
   float spec=pow(max(dot(reflect(-lightDir,n),-rd),0.0),48.0);
   float bands=.5+.5*sin(hit.y*19.0+hit.x*8.0-t*2.0);
   vec3 base=mix(u_primary,u_secondary,bands*.45+.25);
   col=base*(.16+.92*diff)+u_accent*(.18*fres+spec*.8);
   if(u_kind>=8.5 && u_kind<9.5){
     float radial=length(hit.xz);
     float flow=.5+.5*sin(hit.y*15.0-t*4.0);

const waveVertex=`
precision highp float;

const waveFragment=`

const auroraVertex = "\nprecision highp float;\nattribute vec3 a_position;\nattribute vec3 a_normal;\nuniform vec2 u_resolution;\nuniform float u_time,u_phase,u_object_type;\nvarying vec3 v_world;\nvarying vec3 v_normal;\nvarying float v_type;\nvarying float v_height;\nvoid main(){\n float kind=u_object_type;\n vec3 p=a_position;\n vec3 n=a_normal;\n if(kind<0.5){\n   float spin=u_time*.045;\n   mat2 r=mat2(cos(spin),-sin(spin),sin(spin),cos(spin));\n   p.xz=r*p.xz;\n   n.xz=r*n.xz;\n   p*=.79;\n }else if(kind<1.5){\n   float fi=floor(p.x+.5),s=p.y,side=p.z;\n   float a=fi*1.5707963+u_time*.025+u_phase*.045;\n   float x=.98*sin(3.1415926*s);\n   float y=1.12*cos(3.1415926*s);\n   vec2 tangent=normalize(vec2(.98*3.1415926*cos(3.1415926*s),-1.12*3.1415926*sin(3.1415926*s)));\n   vec2 normal=vec2(-tangent.y,tangent.x);\n   vec3 c=vec3(x+normal.x*side*.010,y+normal.y*side*.010,0.0);\n   p=vec3(c.x*cos(a),c.y,c.x*sin(a));\n   n=normalize(vec3(cos(a),.1,sin(a)));\n }else if(kind<2.5){\n   float fi=floor(p.x+.5),y=p.y,side=p.z;\n   float f=clamp((y-.48)/1.0,0.0,1.0);\n   float a=fi*1.256637+u_time*.035+u_phase*.10;\n   float r=mix(.78,.91,f)+.055*sin(u_time*1.2+fi+f*4.0);\n   float twist=.045*sin(u_time*.8+fi+f*5.0);\n   a+=side*(.035+twist);\n   p=vec3(r*cos(a),y+.025*sin(u_time+fi*1.7+f*8.0),r*sin(a));\n   n=normalize(vec3(cos(a),.08,sin(a)));\n }else{\n   float fi=p.x;\n   float x=-1.68+mod(u_time*.42+fi*.23,1.35);\n   float y=.22+.20*sin(fi*2.1+u_time*.65);\n   float z=.18*sin(fi*1.4+u_time*.35);\n   p=vec3(x,y,z);\n   n=vec3(0.0,1.0,0.0);\n   gl_PointSize=8.0+2.0*sin(fi+u_time*3.0);\n }\n v_world=p;\n v_normal=normalize(n);\n v_type=kind;\n v_height=p.y;\n vec3 ro=vec3(3.1*sin(u_time*.18+u_phase*.12),1.25+.16*sin(u_time*.27),4.2*cos(u_time*.18+u_phase*.12));\n vec3 ww=normalize(-ro);\n vec3 uu=normalize(cross(ww,vec3(0.0,1.0,0.0)));\n vec3 vv=cross(uu,ww);\n vec3 rel=p-ro;\n float vx=dot(rel,uu),vy=dot(rel,vv),vz=dot(rel,ww);\n float aspect=u_resolution.x/u_resolution.y;\n float focal=1.75,nearPlane=.1,farPlane=30.0;\n gl_Position=vec4(vx*focal/aspect,vy*focal,(farPlane/(farPlane-nearPlane))*vz-(farPlane*nearPlane/(farPlane-nearPlane)),vz);\n}";
const auroraFragment = "\nprecision highp float;\nuniform float u_time;\nuniform vec3 u_primary,u_secondary,u_accent;\nvarying vec3 v_world;\nvarying vec3 v_normal;\nvarying float v_type;\nvarying float v_height;\nvoid main(){\n if(v_type>2.5){\n   vec2 q=gl_PointCoord-vec2(.5);\n   float d=length(q);\n   float alpha=1.0-smoothstep(.12,.5,d);\n   vec3 c=mix(u_accent,u_primary,.35+.35*sin(u_time*2.0+v_world.x*8.0));\n   gl_FragColor=vec4(c*(.65+alpha),alpha);\n   return;\n }\n vec3 n=normalize(v_normal);\n vec3 lightDir=normalize(vec3(-.6,1.1,1.4));\n float diff=max(dot(n,lightDir),0.0);\n vec3 viewDir=normalize(vec3(3.1*sin(u_time*.18),1.25,4.2*cos(u_time*.18))-v_world);\n float rim=pow(1.0-max(dot(n,viewDir),0.0),3.0);\n vec3 col;\n float alpha=1.0;\n if(v_type<.5){\n   float land=sin(v_world.x*12.0+sin(v_world.z*8.0))*cos(v_world.y*13.0+v_world.z*4.0);\n   vec3 ocean=mix(vec3(.004,.018,.075),vec3(.012,.16,.34),.5+.5*v_world.y);\n   vec3 terrain=mix(vec3(.025,.12,.075),vec3(.16,.34,.19),.5+.5*sin(v_world.x*4.0+v_world.z*6.0));\n   col=mix(ocean,terrain,smoothstep(-.18,.42,land));\n   col=col*(.30+.92*diff)+u_primary*(.20*rim);\n   col+=vec3(.015,.035,.08);\n }else if(v_type<1.5){\n   col=mix(u_secondary,u_accent,.35+.25*sin(v_height*7.0+u_time));\n   col*=.35+.55*diff;\n   alpha=.42;\n }else{\n   float folds=.5+.5*sin(v_world.x*13.0+v_height*7.0+u_time*1.6);\n   float ripple=.5+.5*sin(v_height*18.0-u_time*2.8+v_world.z*6.0);\n   col=mix(u_primary,u_secondary,clamp(folds*.68+ripple*.32,0.0,1.0));\n   col=col*(.42+.68*diff)+u_accent*(.25*rim);\n   alpha=.64;\n }\n gl_FragColor=vec4(col,alpha);\n}";
function hex3(h){const x=(h||"#ffffff").replace("#","");return [parseInt(x.slice(0,2),16)/255,parseInt(x.slice(2,4),16)/255,parseInt(x.slice(4,6),16)/255];}

function makeProgram(vs,fs){

function createWaveGrid(){
 const segments=160,stride=segments+1;
 const vertices=new Float32Array(stride*stride*2);
 let k=0;
 for(let z=0;z<=segments;z++){
  for(let x=0;x<=segments;x++){
   vertices[k++]=(x/segments)*2-1;
   vertices[k++]=(z/segments)*2-1;
  }
 }
 const indices=new Uint16Array(segments*segments*6);
 k=0;
 for(let z=0;z<segments;z++){
  for(let x=0;x<segments;x++){
   const a=z*stride+x,b=a+1,c=a+stride,d=c+1;
   indices[k++]=a;indices[k++]=c;indices[k++]=b;
   indices[k++]=b;indices[k++]=c;indices[k++]=d;
  }

 waveGridBuffer=gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER,waveGridBuffer);

 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,waveIndexBuffer);

function createAuroraMeshes(){

 for(let y=0;y<lat;y++)for(let x=0;x<lon;x++){
   const a=point(y,x),b=point(y,x+1),c=point(y+1,x),d=point(y+1,x+1);
   pushAuroraVertex(sphere,a,a);pushAuroraVertex(sphere,c,c);pushAuroraVertex(sphere,b,b);
   pushAuroraVertex(sphere,b,b);pushAuroraVertex(sphere,c,c);pushAuroraVertex(sphere,d,d);
 }

 const field=[];
 for(let fi=0;fi<4;fi++)for(let i=0;i<64;i++){
   const s0=i/64,s1=(i+1)/64;
   const a=[fi,s0,-1],b=[fi,s0,1],c=[fi,s1,-1],d=[fi,s1,1],n=[0,1,0];
   pushAuroraVertex(field,a,n);pushAuroraVertex(field,c,n);pushAuroraVertex(field,b,n);

   pushAuroraVertex(curtains,a,n);pushAuroraVertex(curtains,c,n);pushAuroraVertex(curtains,b,n);
   pushAuroraVertex(curtains,b,n);pushAuroraVertex(curtains,c,n);pushAuroraVertex(curtains,d,n);
 }

function drawAurora(p,phase){

 createAuroraMeshes();
 gl.disable(gl.BLEND);
 gl.disable(gl.DEPTH_TEST);
}
function resize(){
 const dpr=Math.min(window.devicePixelRatio||1,1);
 W=Math.max(1,window.innerWidth||720);
 H=Math.max(1,window.innerHeight||1280);
 canvas.width=Math.round(W*dpr);
 canvas.height=Math.round(H*dpr);
 gl.viewport(0,0,canvas.width,canvas.height);
}

function choosePalette(s){if(s.palette&&s.palette.bg)return s.palette;const t=((s.narration||"")+" "+(s.visual_prompt||"")+" "+(s.text||"")).toLowerCase();if(/آرام|صلح|calm/.test(t))return{bg:"#0c0a09",primary:"#f5d0a9",secondary:"#a78bfa",accent:"#67e8f9"};if(/حماسی|قهرمان|epic/.test(t))return{bg:"#0a0a12",primary:"#fbbf24",secondary:"#f472b6",accent:"#38bdf8"};if(/راز|مرموز|mystery/.test(t))return{bg:"#0b0c15",primary:"#818cf8",secondary:"#c084fc",accent:"#22d3ee"};if(/موج|تداخل|wave/.test(t))return{bg:"#050817",primary:"#22d3ee",secondary:"#a78bfa",accent:"#f472b6"};return{bg:"#07101d",primary:"#22d3ee",secondary:"#a78bfa",accent:"#fbbf24"};}
function kindOf(s){if(s.motif){return({ellipse:0,wave:1,path:2,light:3,choice:4,cosmic:5,growth:3,abstract:5,interference:6,saturn:7,plant:8,xylem:9,stomata:10,root:11,xylem_flow:12,aurora:13,gecko:14,gecko_toe:15,gecko_setae:16,gecko_contact:17})[s.motif]??5;}const t=((s.narration||"")+" "+(s.visual_prompt||"")+" "+(s.text||"")).toLowerCase();if(/بیضی|کانون|ellipse/.test(t))return 0;if(/موج|تداخل|wave|phase/.test(t))return 1;if(/مسیر|قدم|راه|path|journey/.test(t))return 2;if(/نور|طلوع|light|hope/.test(t))return 3;if(/انتخاب|دو راه|choice/.test(t))return 4;return 5;}

function drawBackground(p,t){
 gl.disable(gl.DEPTH_TEST);
 gl.useProgram(bgProgram);
 bindFullscreen(bgProgram);
 gl.uniform2f(bgUniforms.u_resolution,canvas.width,canvas.height);
 gl.uniform1f(bgUniforms.u_time,t);
 gl.uniform3fv(bgUniforms.u_bg,hex3(p.bg));
 gl.uniform3fv(bgUniforms.u_primary,hex3(p.primary));
 gl.drawArrays(gl.TRIANGLES,0,3);
}
function drawWave(p,phase){
 gl.clear(gl.DEPTH_BUFFER_BIT);
 gl.enable(gl.DEPTH_TEST);
 gl.depthFunc(gl.LEQUAL);
 gl.useProgram(waveProgram);
 gl.uniform2f(waveUniforms.u_resolution,canvas.width,canvas.height);
 gl.uniform1f(waveUniforms.u_time,globalTime);
 gl.uniform1f(waveUniforms.u_phase,phase);
 gl.uniform3fv(waveUniforms.u_primary,hex3(p.primary));
 gl.uniform3fv(waveUniforms.u_secondary,hex3(p.secondary));
 gl.uniform3fv(waveUniforms.u_accent,hex3(p.accent));
 gl.bindBuffer(gl.ARRAY_BUFFER,waveGridBuffer);
 const loc=gl.getAttribLocation(waveProgram,"a_grid");
 gl.enableVertexAttribArray(loc);
 gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,waveIndexBuffer);
 gl.drawElements(gl.TRIANGLES,waveIndexCount,gl.UNSIGNED_SHORT,0);
 gl.disable(gl.DEPTH_TEST);
}
function draw(){
 if(!project||!project.scenes.length)return;
 const s=project.scenes[sceneIndex];if(!s)return;
 currentPalette=choosePalette(s);const p=currentPalette;
 const kind=kindOf(s);
 const progress=Math.min(1,sceneTime/Math.max(.01,s.duration));
 const phase=Number(s.phase||0)+progress*Number(s.phase_sweep||0);
 if(kind===13){
  drawAurora(p,phase);
 }else if(kind===6){
  drawBackground(p,globalTime);
  drawWave(p,phase);
 }else{
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(program);
  bindFullscreen(program);
  gl.uniform2f(uniforms.u_resolution,canvas.width,canvas.height);
  gl.uniform1f(uniforms.u_time,globalTime);
  gl.uniform1f(uniforms.u_progress,progress);
  gl.uniform1f(uniforms.u_kind,kind);
  gl.uniform1f(uniforms.u_phase,phase);
  gl.uniform3fv(uniforms.u_primary,hex3(p.primary));
  gl.uniform3fv(uniforms.u_secondary,hex3(p.secondary));
  gl.uniform3fv(uniforms.u_accent,hex3(p.accent));
  gl.uniform3fv(uniforms.u_bg,hex3(p.bg));
  gl.drawArrays(gl.TRIANGLES,0,3);
 }
 caption.textContent=s.text||"";
 let opacity=1,scale=1;
 if(progress<.1){opacity=progress/.1;scale=.92+progress*.8;}
 else if(progress>.88){opacity=(1-progress)/.12;scale=1-(progress-.88)*.3;}
 caption.style.opacity=String(Math.max(0,Math.min(1,opacity)));
 caption.style.transform="scale("+scale.toFixed(3)+")";
}

function totalDuration(){return project?project.scenes.reduce((a,s)=>a+Number(s.duration||4),0):0;}
window.BAMO={
 loadProject(p){if(!p||!Array.isArray(p.scenes)||!p.scenes.length)throw new Error("Project must contain scenes");project=p;sceneIndex=0;sceneTime=0;globalTime=0;draw();return true;},
 play(){playing=true;lastNow=performance.now();},pause(){playing=false;},
 seek(seconds){if(!project)return;let left=Math.max(0,seconds),acc=0;sceneIndex=project.scenes.length-1;sceneTime=Number(project.scenes[sceneIndex].duration||4);for(let i=0;i<project.scenes.length;i++){const d=Number(project.scenes[i].duration||4);if(left<acc+d||i===project.scenes.length-1){sceneIndex=i;sceneTime=Math.max(0,Math.min(d,left-acc));break;}acc+=d;}globalTime=seconds;draw();},
 getState(){return{sceneIndex,sceneTime,globalTime,totalDuration:totalDuration(),playing,renderer:"WebGL"};},
 ready:false
};
function loop(now){if(!lastNow)lastNow=now;const dt=Math.min(.05,(now-lastNow)/1000);lastNow=now;if(playing&&project){sceneTime+=dt;globalTime+=dt;const s=project.scenes[sceneIndex],d=Number(s.duration||4);if(sceneTime>=d){sceneTime-=d;sceneIndex++;if(sceneIndex>=project.scenes.length){sceneIndex=project.scenes.length-1;sceneTime=Number(project.scenes[sceneIndex].duration||4);playing=false;}}draw();}requestAnimationFrame(loop);}
try{initGL();resize();window.addEventListener("resize",resize);const q=new URLSearchParams(location.search);if(q.get("project")){const binary=atob(q.get("project"));const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const decoded=new TextDecoder("utf-8",{fatal:true}).decode(bytes);window.BAMO.loadProject(JSON.parse(decoded));}if(window.BAMO_PROJECT)window.BAMO.loadProject(window.BAMO_PROJECT);window.BAMO.ready=true;requestAnimationFrame(loop);/* Rendering is frame-stepped by Playwright; autoplay would cause duplicate GPU work. */}catch(e){errorBox.style.display="grid";errorBox.textContent="BAMO WebGL Engine Error: "+e.message;window.BAMO.ready=false;window.BAMO.error=String(e);}
})();
</script>
