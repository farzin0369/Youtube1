<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAMO WebGL Motion Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#030611}
#c{display:block;width:100%;height:100%}
#caption{position:fixed;bottom:8%;left:6%;right:6%;text-align:center;color:#fff;font-family:'Vazirmatn',sans-serif;font-size:clamp(24px,4.5vw,40px);font-weight:700;line-height:1.45;text-shadow:0 2px 20px #000,0 0 48px #0008;pointer-events:none;z-index:5;transition:opacity .2s ease,transform .25s ease}
#error{position:fixed;inset:0;display:none;place-items:center;padding:32px;color:#fff;background:#160b12;font:20px sans-serif;text-align:center;z-index:20}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="caption"></div><div id="error"></div>
<script>
(() => {
"use strict";
const canvas=document.getElementById("c"),caption=document.getElementById("caption"),errorBox=document.getElementById("error");
const gl=canvas.getContext("webgl",{alpha:false,antialias:true,preserveDrawingBuffer:true});
let project=null,sceneIndex=0,sceneTime=0,globalTime=0,playing=false,lastNow=0,W=720,H=1280,program,uniforms={},buffer;
let currentPalette={bg:"#050817",primary:"#22d3ee",secondary:"#a78bfa",accent:"#f472b6"};
const vertex=`
attribute vec2 a_position;
void main(){gl_Position=vec4(a_position,0.0,1.0);}
`;
const fragment=`
precision highp float;
uniform vec2 u_resolution;
uniform float u_time,u_progress,u_kind;
uniform vec3 u_primary,u_secondary,u_accent,u_bg;
#define MAX_STEPS 92
#define MAX_DIST 36.0
#define SURF_DIST 0.0015
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float sdSphere(vec3 p,float r){return length(p)-r;}
float sdTorus(vec3 p,vec2 t){vec2 q=vec2(length(p.xz)-t.x,p.y);return length(q)-t.y;}
float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0);}
float sdCapsule(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);return length(pa-ba*h)-r;}
float sceneSDF(vec3 p){
 float t=u_time;
 p.xz=rot(0.12*sin(t*.22))*p.xz;
 p.xy=rot(.10*cos(t*.19))*p.xy;
 if(u_kind<.5){
   float ring=sdTorus(p,vec2(1.08,.055));
   float core=sdSphere(p, .37+.06*sin(t*1.8));
   float orbit=sdSphere(p-vec3(1.08*cos(t*1.1),.0,1.08*sin(t*1.1)),.105);
   return min(min(ring,core),orbit);
 }else if(u_kind<1.5){
   float wave=abs(p.y-(.30*sin(p.x*3.2-t*2.2)+.18*sin(p.x*5.1+t*1.4)))-.035;
   float slab=max(wave,abs(p.z)-.11);
   float wave2=abs(p.y-(.30*sin(p.x*3.2-t*2.2+u_progress*3.14159)+.18*sin(p.x*5.1+t*1.4))+.43)-.035;
   float slab2=max(wave2,abs(p.z)-.11);
   float sum=min(slab,slab2);
   return min(sum,sdSphere(p-vec3(0,-.1,0),.13));
 }else if(u_kind<2.5){
   float road=sdCapsule(p,vec3(-.75,-.8,0),vec3(-.25,.0,0),.075);
   road=min(road,sdCapsule(p,vec3(-.25,0,0),vec3(.5,.65,0),.075));
   road=min(road,sdCapsule(p,vec3(.5,.65,0),vec3(.85,.95,0),.075));
   float bead=sdSphere(p-vec3(.5+.30*sin(t*.9),.65+.30*sin(t*.9),0),.14);
   return min(road,bead);
 }else if(u_kind<3.5){
   float orb=sdSphere(p, .68+.08*sin(t*1.5));
   float halo=sdTorus(p,vec2(1.02,.035));
   return min(orb,halo);
 }else if(u_kind<4.5){
   float left=sdCapsule(p,vec3(0,-.8,0),vec3(-.72,.62,0),.055);
   float right=sdCapsule(p,vec3(0,-.8,0),vec3(.72,.62,0),.055);
   return min(left,right);
 }else{
   float a=sdTorus(p,vec2(.75,.06));
   float b=sdTorus(p,vec2(.48,.045));
   p.xy=rot(1.05)*p.xy;
   return min(min(a,b),sdSphere(p,.22));
 }
}
vec3 getNormal(vec3 p){vec2 e=vec2(.001,0);return normalize(vec3(sceneSDF(p+e.xyy)-sceneSDF(p-e.xyy),sceneSDF(p+e.yxy)-sceneSDF(p-e.yxy),sceneSDF(p+e.yyx)-sceneSDF(p-e.yyx)));}
float march(vec3 ro,vec3 rd,out vec3 hit){
 // Conservative scene-bound intersection skips background pixels before
 // expensive SDF ray marching, especially important on CPU SwiftShader.
 float b=dot(ro,rd);
 float c=dot(ro,ro)-1.8*1.8;
 float h=b*b-c;
 if(h<0.0)return MAX_DIST;
 float root=sqrt(h);
 float nearT=max(0.0,-b-root);
 float farT=-b+root;
 if(farT<=nearT)return MAX_DIST;
 float d=nearT;
 for(int i=0;i<MAX_STEPS;i++){
   if(d>farT)break;
   vec3 p=ro+rd*d;
   float dist=sceneSDF(p);
   if(dist<SURF_DIST){hit=p;return d;}
   d+=max(dist*.9,.002);
 }
 return MAX_DIST;
}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*u_resolution)/u_resolution.y;
 float t=u_time;
 vec3 ro=vec3(3.1*sin(t*.18),1.25+.16*sin(t*.27),4.2*cos(t*.18));
 vec3 target=vec3(0,0,0);
 vec3 ww=normalize(target-ro),uu=normalize(cross(ww,vec3(0,1,0))),vv=cross(uu,ww);
 vec3 rd=normalize(uv.x*uu+uv.y*vv+1.75*ww);
 vec3 hit;float d=march(ro,rd,hit);
 vec3 col=u_bg;
 float stars=0.0;
 vec2 gv=fract(uv*vec2(95.,150.))-0.5;
 vec2 id=floor(uv*vec2(95.,150.));
 float rnd=fract(sin(dot(id,vec2(127.1,311.7)))*43758.5453);
 stars=step(.994,rnd)*pow(max(0.,1.-length(gv)*2.),4.)*(.45+.55*sin(t*1.7+rnd*20.));
 col+=vec3(.35,.55,.9)*stars;
 float haze=exp(-length(uv-vec2(.0,.08)) * 3.0);
 col+=u_primary*haze*.075;
 if(d<MAX_DIST){
   vec3 n=getNormal(hit);
   vec3 lightDir=normalize(vec3(-.6,1.1,1.4));
   float diff=max(dot(n,lightDir),0.0);
   float fres=pow(1.0-max(dot(n,-rd),0.0),3.0);
   float spec=pow(max(dot(reflect(-lightDir,n),-rd),0.0),48.0);
   float bands=.5+.5*sin(hit.y*19.0+hit.x*8.0-t*2.0);
   vec3 base=mix(u_primary,u_secondary,bands*.45+.25);
   col=base*(.16+.92*diff)+u_accent*(.18*fres+spec*.8);
   col+=u_primary*(.12/(.08+abs(sceneSDF(hit+ n*.035))));
   float fog=1.0-exp(-d*.055);col=mix(col,u_bg,fog*.38);
 }
 float vignette=1.0-smoothstep(.35,1.25,length(uv));
 col*=vignette;
 col=col/(1.0+col);
 col=pow(col,vec3(.88));
 gl_FragColor=vec4(col,1.0);
}
`;
function hex3(h){const x=(h||"#ffffff").replace("#","");return [parseInt(x.slice(0,2),16)/255,parseInt(x.slice(2,4),16)/255,parseInt(x.slice(4,6),16)/255];}
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
function initGL(){
 if(!gl)throw new Error("WebGL در مرورگر فعال نیست؛ این موتور به WebGL نیاز دارد.");
 program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);
 if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));
 gl.useProgram(program);
 buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 const loc=gl.getAttribLocation(program,"a_position");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
 ["u_resolution","u_time","u_progress","u_kind","u_primary","u_secondary","u_accent","u_bg"].forEach(k=>uniforms[k]=gl.getUniformLocation(program,k));
 gl.disable(gl.DEPTH_TEST);gl.disable(gl.BLEND);
}
function resize(){const dpr=Math.min(window.devicePixelRatio||1,1.5);W=720;H=1280;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);gl.viewport(0,0,canvas.width,canvas.height);}
function choosePalette(s){if(s.palette&&s.palette.bg)return s.palette;const t=((s.narration||"")+" "+(s.visual_prompt||"")+" "+(s.text||"")).toLowerCase();if(/آرام|صلح|calm/.test(t))return{bg:"#0c0a09",primary:"#f5d0a9",secondary:"#a78bfa",accent:"#67e8f9"};if(/حماسی|قهرمان|epic/.test(t))return{bg:"#0a0a12",primary:"#fbbf24",secondary:"#f472b6",accent:"#38bdf8"};if(/راز|مرموز|mystery/.test(t))return{bg:"#0b0c15",primary:"#818cf8",secondary:"#c084fc",accent:"#22d3ee"};if(/موج|تداخل|wave/.test(t))return{bg:"#050817",primary:"#22d3ee",secondary:"#a78bfa",accent:"#f472b6"};return{bg:"#07101d",primary:"#22d3ee",secondary:"#a78bfa",accent:"#fbbf24"};}
function kindOf(s){if(s.motif){return({ellipse:0,wave:1,path:2,light:3,choice:4,cosmic:5,growth:3,abstract:5})[s.motif]??5;}const t=((s.narration||"")+" "+(s.visual_prompt||"")+" "+(s.text||"")).toLowerCase();if(/بیضی|کانون|ellipse/.test(t))return 0;if(/موج|تداخل|wave|phase/.test(t))return 1;if(/مسیر|قدم|راه|path|journey/.test(t))return 2;if(/نور|طلوع|light|hope/.test(t))return 3;if(/انتخاب|دو راه|choice/.test(t))return 4;return 5;}
function draw(){
 if(!project||!project.scenes.length)return;
 const s=project.scenes[sceneIndex];if(!s)return;
 currentPalette=choosePalette(s);const p=currentPalette;
 gl.useProgram(program);
 gl.uniform2f(uniforms.u_resolution,canvas.width,canvas.height);
 gl.uniform1f(uniforms.u_time,globalTime);
 gl.uniform1f(uniforms.u_progress,Math.min(1,sceneTime/Math.max(.01,s.duration)));
 gl.uniform1f(uniforms.u_kind,kindOf(s));
 gl.uniform3fv(uniforms.u_primary,hex3(p.primary));gl.uniform3fv(uniforms.u_secondary,hex3(p.secondary));gl.uniform3fv(uniforms.u_accent,hex3(p.accent));gl.uniform3fv(uniforms.u_bg,hex3(p.bg));
 gl.drawArrays(gl.TRIANGLES,0,3);
 caption.textContent=s.text||"";
 const progress=Math.min(1,sceneTime/Math.max(.01,s.duration));
 let opacity=1,scale=1;if(progress<.1){opacity=progress/.1;scale=.92+progress*.8;}else if(progress>.88){opacity=(1-progress)/.12;scale=1-(progress-.88)*.3;}
 caption.style.opacity=String(Math.max(0,Math.min(1,opacity)));caption.style.transform="scale("+scale.toFixed(3)+")";
}
function totalDuration(){return project?project.scenes.reduce((a,s)=>a+Number(s.duration||4),0):0;}
window.BAMO={
 loadProject(p){if(!p||!Array.isArray(p.scenes)||!p.scenes.length)throw new Error("Project must contain scenes");project=p;sceneIndex=0;sceneTime=0;globalTime=0;draw();return true;},
 play(){playing=true;lastNow=performance.now();},pause(){playing=false;},
 seek(seconds){if(!project)return;let left=Math.max(0,seconds),acc=0;sceneIndex=project.scenes.length-1;sceneTime=Number(project.scenes[sceneIndex].duration||4);for(let i=0;i<project.scenes.length;i++){const d=Number(project.scenes[i].duration||4);if(left<acc+d||i===project.scenes.length-1){sceneIndex=i;sceneTime=Math.max(0,Math.min(d,left-acc));break;}acc+=d;}globalTime=seconds;draw();},
 getState(){return{sceneIndex,sceneTime,globalTime,totalDuration:totalDuration(),playing,renderer:"WebGL"};},
 ready:false
};
function loop(now){if(!lastNow)lastNow=now;const dt=Math.min(.05,(now-lastNow)/1000);lastNow=now;if(playing&&project){sceneTime+=dt;globalTime+=dt;const s=project.scenes[sceneIndex],d=Number(s.duration||4);if(sceneTime>=d){sceneTime-=d;sceneIndex++;if(sceneIndex>=project.scenes.length){sceneIndex=project.scenes.length-1;sceneTime=Number(project.scenes[sceneIndex].duration||4);playing=false;}}draw();}requestAnimationFrame(loop);}
try{initGL();resize();window.addEventListener("resize",resize);const q=new URLSearchParams(location.search);if(q.get("project"))window.BAMO.loadProject(JSON.parse(atob(q.get("project"))));if(window.BAMO_PROJECT)window.BAMO.loadProject(window.BAMO_PROJECT);window.BAMO.ready=true;requestAnimationFrame(loop);setTimeout(()=>{if(project)window.BAMO.play();},300);}catch(e){errorBox.style.display="grid";errorBox.textContent="BAMO WebGL Engine Error: "+e.message;window.BAMO.ready=false;window.BAMO.error=String(e);}
})();
</script>
</body></html>
