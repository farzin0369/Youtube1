<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAMO Pipeline Engine</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #05070d; }
    canvas { display: block; width: 100%; height: 100%; }
    #caption {
      position: fixed; bottom: 8%; left: 5%; right: 5%;
      text-align: center; color: white; font-family: 'Vazirmatn', sans-serif;
      font-size: clamp(22px, 4.2vw, 38px); font-weight: 600;
      text-shadow: 0 2px 16px rgba(0,0,0,0.85), 0 0 40px rgba(0,0,0,0.4);
      line-height: 1.45; pointer-events: none; z-index: 10;
      transition: opacity 0.3s;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="caption"></div>
  <script>
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const captionEl = document.getElementById('caption');
    let W, H, dpr, project = null, sceneIndex = 0, sceneTime = 0, globalTime = 0, playing = false, lastNow = 0, currentPalette = null;
    let particles = [], lightRays = [], sparks = [];

    window.BAMO = {
      loadProject(p) { project = p; sceneIndex = 0; sceneTime = 0; globalTime = 0; initParticles(); initLightRays(); initSparks(); currentPalette = choosePalette(project.scenes[0] || {}); resize(); draw(); return true; },
      play() { playing = true; lastNow = performance.now(); },
      pause() { playing = false; },
      seek(seconds) { let acc = 0; for (let i = 0; i < project.scenes.length; i++) { const d = project.scenes[i].duration; if (acc + d > seconds) { sceneIndex = i; sceneTime = seconds - acc; break; } acc += d; } draw(); },
      getState() { return { sceneIndex, sceneTime, globalTime, totalDuration: totalDuration(), playing }; },
      ready: false
    };

    function totalDuration() { return project ? project.scenes.reduce((s, sc) => s + sc.duration, 0) : 0; }
    function resize() { dpr = Math.min(window.devicePixelRatio || 1, 2); W = 720; H = 1280; canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = '100%'; canvas.style.height = '100%'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }

    function choosePalette(scene) {
      const text = ((scene.narration || '') + ' ' + (scene.visual_prompt || '') + ' ' + (scene.text || '')).toLowerCase();
      if (/صبر|امید|نور|توکل|آرامش|قلب|دعا/.test(text)) return { bg: '#0c0a09', primary: '#fbbf24', secondary: '#f472b6', accent: '#38bdf8', particle: 'rgba(251,191,36,0.55)', glow: 'rgba(251,191,36,0.25)' };
      if (/رشد|پیشرفت|آینده|موفق|قدم|مسیر/.test(text)) return { bg: '#052e16', primary: '#4ade80', secondary: '#2dd4bf', accent: '#facc15', particle: 'rgba(74,222,128,0.5)', glow: 'rgba(74,222,128,0.22)' };
      if (/فکر|ذهن|تصمیم|انتخاب|دو راه/.test(text)) return { bg: '#111827', primary: '#a78bfa', secondary: '#22d3ee', accent: '#e879f9', particle: 'rgba(167,139,250,0.5)', glow: 'rgba(167,139,250,0.22)' };
      return { bg: '#05070d', primary: '#22d3ee', secondary: '#818cf8', accent: '#34d399', particle: 'rgba(34,211,238,0.5)', glow: 'rgba(34,211,238,0.22)' };
    }

    function initParticles() { particles = Array.from({length: 90}, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 2.2 + 0.4, speed: Math.random() * 0.0005 + 0.00012, phase: Math.random() * Math.PI * 2, drift: (Math.random() - 0.5) * 0.3 })); }
    function initLightRays() { lightRays = Array.from({length: 7}, (_, i) => ({ angle: (i / 7) * Math.PI * 2, width: 0.04 + Math.random() * 0.06, length: 0.55 + Math.random() * 0.35, speed: 0.08 + Math.random() * 0.12, alpha: 0.04 + Math.random() * 0.06 })); }
    function initSparks() { sparks = Array.from({length: 18}, () => ({ x: 0.3 + Math.random() * 0.4, y: 0.25 + Math.random() * 0.4, vx: (Math.random() - 0.5) * 0.15, vy: (Math.random() - 0.5) * 0.15, life: Math.random(), maxLife: 0.8 + Math.random() * 1.4, r: 1 + Math.random() * 2.5 })); }

    function analyzeScene(scene) {
      const t = ((scene.narration || '') + ' ' + (scene.visual_prompt || '')).toLowerCase();
      if (/بیضی|کانون|فاصله ثابت/.test(t)) return 'ellipse';
      if (/موج|تداخل|فاز|فرکانس/.test(t)) return 'wave';
      if (/مسیر|قدم|رشد|پله|آینده/.test(t)) return 'path';
      if (/نور|طلوع|امید|قلب/.test(t)) return 'light';
      if (/انتخاب|دو راه|تصمیم/.test(t)) return 'choice';
      return 'abstract';
    }

    function shade(hex, factor) { const r = parseInt(hex.slice(1,3), 16), g = parseInt(hex.slice(3,5), 16), b = parseInt(hex.slice(5,7), 16); return `rgb(${Math.round(r*factor)},${Math.round(g*factor)},${Math.round(b*factor)})`; }

    function drawBackground(pal, t) {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, pal.bg); g.addColorStop(0.55, shade(pal.bg, 0.85)); g.addColorStop(1, shade(pal.bg, 0.55));
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      const topGlow = ctx.createRadialGradient(W/2, 0, 0, W/2, 0, H*0.55);
      topGlow.addColorStop(0, pal.glow); topGlow.addColorStop(1, 'transparent');
      ctx.fillStyle = topGlow; ctx.fillRect(0, 0, W, H);
      const bloom = ctx.createRadialGradient(W/2, H*0.4, 0, W/2, H*0.4, H*0.45);
      bloom.addColorStop(0, pal.glow.replace(/[\d.]+\)$/, '0.12)')); bloom.addColorStop(1, 'transparent');
      ctx.fillStyle = bloom; ctx.fillRect(0, 0, W, H);
      const vg = ctx.createRadialGradient(W/2, H/2, H*0.25, W/2, H/2, H*0.72);
      vg.addColorStop(0, 'transparent'); vg.addColorStop(1, 'rgba(0,0,0,0.45)');
      ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    }

    function drawLightRays(pal, t) {
      const cx = W/2, cy = H*0.38;
      lightRays.forEach((ray, i) => {
        const ang = ray.angle + t * ray.speed * 0.15;
        const len = ray.length * Math.min(W, H);
        const alpha = ray.alpha * (0.7 + 0.3 * Math.sin(t * 0.8 + i));
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
        const grd = ctx.createLinearGradient(0, 0, len, 0);
        grd.addColorStop(0, pal.primary + Math.round(alpha * 255).toString(16).padStart(2, '0'));
        grd.addColorStop(0.4, pal.primary + '15'); grd.addColorStop(1, 'transparent');
        ctx.fillStyle = grd;
        ctx.beginPath(); ctx.moveTo(0, -ray.width * 40); ctx.lineTo(len, -ray.width * 120); ctx.lineTo(len, ray.width * 120); ctx.lineTo(0, ray.width * 40); ctx.closePath(); ctx.fill();
        ctx.restore();
      });
    }

    function drawParticles(pal, t) {
      particles.forEach(p => {
        p.phase += p.speed * 16;
        const px = p.x * W + Math.sin(p.phase) * 22 + p.drift * 30;
        const py = p.y * H + Math.cos(p.phase * 0.7) * 16;
        const pulse = 0.45 + 0.55 * Math.sin(p.phase * 1.3);
        ctx.beginPath(); ctx.arc(px, py, p.r * pulse, 0, Math.PI*2);
        ctx.fillStyle = pal.particle; ctx.globalAlpha = 0.25 + pulse * 0.4; ctx.fill();
        if (p.r > 1.4) {
          const gg = ctx.createRadialGradient(px, py, 0, px, py, p.r * 4);
          gg.addColorStop(0, pal.particle.replace(/[\d.]+\)$/, '0.18)')); gg.addColorStop(1, 'transparent');
          ctx.fillStyle = gg; ctx.globalAlpha = 0.6; ctx.beginPath(); ctx.arc(px, py, p.r * 4, 0, Math.PI*2); ctx.fill();
        }
      });
      ctx.globalAlpha = 1;
    }

    function drawSparks(pal, t) {
      sparks.forEach(s => {
        s.life += 0.016;
        if (s.life > s.maxLife) { s.life = 0; s.x = 0.25 + Math.random() * 0.5; s.y = 0.2 + Math.random() * 0.45; s.vx = (Math.random() - 0.5) * 0.18; s.vy = (Math.random() - 0.5) * 0.18; }
        const progress = s.life / s.maxLife;
        const alpha = progress < 0.2 ? progress * 5 : (1 - progress);
        const px = (s.x + s.vx * s.life) * W;
        const py = (s.y + s.vy * s.life) * H;
        ctx.beginPath(); ctx.arc(px, py, s.r * (1 - progress * 0.5), 0, Math.PI*2);
        ctx.fillStyle = pal.accent; ctx.globalAlpha = alpha * 0.7; ctx.fill();
        ctx.beginPath(); ctx.arc(px - s.vx * 20, py - s.vy * 20, s.r * 0.4, 0, Math.PI*2);
        ctx.globalAlpha = alpha * 0.3; ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    function drawEllipse(pal, t) {
      const cx = W/2, cy = H*0.42; const a = Math.min(W, H) * 0.28; const b = a * 0.58; const c = Math.sqrt(a*a - b*b);
      const eg = ctx.createRadialGradient(cx, cy, 0, cx, cy, a * 1.4);
      eg.addColorStop(0, pal.glow); eg.addColorStop(1, 'transparent');
      ctx.fillStyle = eg; ctx.beginPath(); ctx.ellipse(cx, cy, a*1.3, b*1.3, 0, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(cx, cy, a, b, 0, 0, Math.PI*2);
      ctx.strokeStyle = 'rgba(200,210,230,0.55)'; ctx.lineWidth = 3; ctx.stroke();
      [cx - c, cx + c].forEach(fx => {
        const gg = ctx.createRadialGradient(fx, cy, 0, fx, cy, 28);
        gg.addColorStop(0, pal.primary + '70'); gg.addColorStop(1, 'transparent');
        ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(fx, cy, 28, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = pal.primary; ctx.beginPath(); ctx.arc(fx, cy, 7, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.7; ctx.beginPath(); ctx.arc(fx - 2, cy - 2, 2.5, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
      });
      const ang = t * 0.9; const px = cx + a * Math.cos(ang); const py = cy + b * Math.sin(ang);
      ctx.setLineDash([6, 5]); ctx.strokeStyle = pal.secondary + 'bb'; ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(cx - c, cy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(cx + c, cy); ctx.stroke(); ctx.setLineDash([]);
      const pg = ctx.createRadialGradient(px, py, 0, px, py, 18);
      pg.addColorStop(0, pal.secondary + '88'); pg.addColorStop(1, 'transparent');
      ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(px, py, 18, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI*2); ctx.fill();
    }

    function drawWave(pal, t, progress) {
      const mid = H * 0.4; const A = 44; const k = 0.015;
      const phaseDiff = progress < 0.45 ? 0 : Math.min(Math.PI, (progress - 0.45) * 2.2 * Math.PI);
      function yOf(x, phase) { return mid + A * Math.sin(k * x - t * 2.8 + phase); }
      ctx.beginPath();
      for (let x = 0; x <= W; x += 6) { const y = mid + A * Math.sin(k*x - t*2.8) + A * Math.sin(k*x - t*2.8 + phaseDiff); x === 0 ? ctx.moveTo(x, y + 20) : ctx.lineTo(x, y + 20); }
      ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.closePath();
      const ug = ctx.createLinearGradient(0, mid, 0, mid + 120); ug.addColorStop(0, pal.glow); ug.addColorStop(1, 'transparent');
      ctx.fillStyle = ug; ctx.fill();
      ctx.beginPath(); for (let x = 0; x <= W; x += 3) { const y = yOf(x, 0); x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
      ctx.strokeStyle = pal.primary + 'cc'; ctx.lineWidth = 3; ctx.stroke();
      ctx.beginPath(); for (let x = 0; x <= W; x += 3) { const y = yOf(x, phaseDiff); x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
      ctx.strokeStyle = pal.secondary + 'cc'; ctx.lineWidth = 3; ctx.stroke();
      ctx.beginPath();
      for (let x = 0; x <= W; x += 3) { const y = mid + A * Math.sin(k*x - t*2.8) + A * Math.sin(k*x - t*2.8 + phaseDiff); x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
      ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 4.5; ctx.shadowColor = pal.primary; ctx.shadowBlur = 18; ctx.stroke(); ctx.shadowBlur = 0;
    }

    function drawPath(pal, t) {
      const cx = W/2, cy = H*0.48;
      ctx.strokeStyle = pal.primary + '40'; ctx.lineWidth = 14; ctx.lineCap = 'round';
      ctx.beginPath(); for (let i = 0; i <= 40; i++) { const u = i / 40; const x = cx + Math.sin(u * Math.PI * 1.5 + t * 0.6) * 90 * u; const y = cy - 180 + u * 320; i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke();
      ctx.strokeStyle = pal.primary + 'ee'; ctx.lineWidth = 5;
      ctx.beginPath(); for (let i = 0; i <= 40; i++) { const u = i / 40; const x = cx + Math.sin(u * Math.PI * 1.5 + t * 0.6) * 90 * u; const y = cy - 180 + u * 320; i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke();
      for (let i = 0; i < 5; i++) {
        const u = (i + 0.5) / 5; const x = cx + Math.sin(u * Math.PI * 1.5 + t * 0.6) * 90 * u; const y = cy - 180 + u * 320;
        const pulse = 0.75 + 0.25 * Math.sin(t * 2.2 + i);
        const gg = ctx.createRadialGradient(x, y, 0, x, y, 16); gg.addColorStop(0, pal.primary + '99'); gg.addColorStop(1, 'transparent');
        ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(x, y, 16 * pulse, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.9; ctx.beginPath(); ctx.arc(x, y, 6, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
      }
    }

    function drawLight(pal, t) {
      const cx = W/2, cy = H*0.38;
      for (let i = 6; i >= 0; i--) {
        const r = 35 + i * 42 + Math.sin(t * 1.4 + i) * 10;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, pal.primary + (50 - i * 6).toString(16).padStart(2, '0'));
        g.addColorStop(0.6, pal.primary + '10'); g.addColorStop(1, 'transparent');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      }
      ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.85; ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
    }

    function drawChoice(pal, t) {
      const cx = W/2, cy = H*0.5;
      for (const side of [-1, 1]) {
        ctx.strokeStyle = (side === 1 ? pal.primary : pal.secondary) + '35'; ctx.lineWidth = 16;
        ctx.beginPath(); ctx.moveTo(cx, cy + 120); ctx.quadraticCurveTo(cx + side * 140, cy, cx + side * 160, cy - 160); ctx.stroke();
        ctx.strokeStyle = side === 1 ? pal.primary : pal.secondary + 'bb'; ctx.lineWidth = side === 1 ? 5 : 3.5;
        ctx.beginPath(); ctx.moveTo(cx, cy + 120); ctx.quadraticCurveTo(cx + side * 140, cy, cx + side * 160, cy - 160); ctx.stroke();
      }
    }

    function drawAbstract(pal, t) {
      for (let i = 0; i < 7; i++) {
        const x = W * (0.18 + 0.11 * i) + Math.sin(t * 0.75 + i) * 24;
        const y = H * 0.38 + Math.cos(t * 0.55 + i * 0.8) * 50;
        const r = 28 + i * 11;
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, (i % 2 ? pal.primary : pal.secondary) + '55'); g.addColorStop(1, 'transparent');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
      }
    }

    function draw() {
      if (!project || !project.scenes.length) return;
      const scene = project.scenes[sceneIndex];
      const progress = Math.min(1, sceneTime / Math.max(0.01, scene.duration));
      currentPalette = choosePalette(scene);
      drawBackground(currentPalette, globalTime);
      drawLightRays(currentPalette, globalTime);
      drawParticles(currentPalette, globalTime);
      drawSparks(currentPalette, globalTime);
      const kind = analyzeScene(scene);
      if (kind === 'ellipse') drawEllipse(currentPalette, sceneTime);
      else if (kind === 'wave') drawWave(currentPalette, sceneTime, progress);
      else if (kind === 'path') drawPath(currentPalette, sceneTime);
      else if (kind === 'light') drawLight(currentPalette, sceneTime);
      else if (kind === 'choice') drawChoice(currentPalette, sceneTime);
      else drawAbstract(currentPalette, sceneTime);
      captionEl.textContent = scene.text || '';
      captionEl.style.opacity = progress < 0.07 || progress > 0.93 ? Math.max(0.2, progress * 3) : 1;
    }

    function loop(now) {
      if (!lastNow) lastNow = now;
      const dt = (now - lastNow) / 1000; lastNow = now;
      if (playing && project) {
        sceneTime += dt; globalTime += dt;
        const scene = project.scenes[sceneIndex];
        if (sceneTime >= scene.duration) {
          sceneTime = 0; sceneIndex++;
          if (sceneIndex >= project.scenes.length) { playing = false; sceneIndex = project.scenes.length - 1; sceneTime = project.scenes[sceneIndex].duration; }
        }
        draw();
      }
      requestAnimationFrame(loop);
    }

    resize(); window.addEventListener('resize', resize);
    try { const params = new URLSearchParams(location.search); if (params.get('project')) window.BAMO.loadProject(JSON.parse(atob(params.get('project')))); } catch (e) {}
    if (window.BAMO_PROJECT) window.BAMO.loadProject(window.BAMO_PROJECT);
    window.BAMO.ready = true;
    requestAnimationFrame(loop);
    setTimeout(() => { if (project) window.BAMO.play(); }, 300);
  </script>
</body>
</html>
