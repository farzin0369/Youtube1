<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BAMO WebGL Motion Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#030611}
#c{display:block;width:100%;height:100%}
#caption{position:fixed;bottom:8%;left:6%;right:6%;text-align:right;direction:rtl;color:#fff;font-family:'Vazirmatn',sans-serif;font-size:clamp(24px,4.5vw,40px);font-weight:700;line-height:1.45;text-shadow:0 2px 20px #000,0 0 48px #0008;pointer-events:none;z-index:5;transition:opacity .2s ease,transform .25s ease}
#error{position:fixed;inset:0;display:none;place-items:center;padding:32px;color:#fff;background:#160b12;font:20px sans-serif;text-align:center;z-index:20}
</style>
</head>
<body>
<canvas id="c"></canvas><div id="caption"></div><div id="error"></div>
<script>
(() => {
"use strict";
const canvas=document.getElementById("c"),caption=document.getElementById("caption"),errorBox=document.getElementById("error");
const gl=canvas.getContext("webgl",{alpha:false,antialias:true,preserveDrawingBuffer:true});
let project=null,sceneIndex=0,sceneTime=0,globalTime=0,playing=false,lastNow=0,W=720,H=1280,program,uniforms={},buffer,waveProgram,bgProgram,waveUniforms={},bgUniforms={},waveGridBuffer,waveIndexBuffer,waveIndexCount=0;
let currentPalette={bg:"#050817",primary:"#22d3ee",secondary:"#a78bfa",accent:"#f472b6"};
const vertex=`
attribute vec2 a_position;
void main(){gl_Position=vec4(a_position,0.0,1.0);}
`;
const fragment=`
precision highp float;
uniform vec2 u_resolution;
uniform float u_time,u_progress,u_kind,u_phase;
uniform vec3 u_primary,u_secondary,u_accent,u_bg;
#define MAX_STEPS 92
#define MAX_DIST 36.0
#define SURF_DIST 0.0015
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
float sdSphere(vec3 p,float r){return length(p)-r;}
float sdTorus(vec3 p,vec2 t){vec2 q=vec2(length(p.xz)-t.x,p.y);return length(q)-t.y;}
float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0);}
float sdCapsule(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);return length(pa-ba*h)-r;}
float sceneSDF(vec3 p){
 float t=u_time;
 p.xz=rot(0.12*sin(t*.22))*p.xz;
 p.xy=rot(.10*cos(t*.19))*p.xy;
 if(u_kind<.5){
   float ring=sdTorus(p,vec2(1.08,.055));
   float core=sdSphere(p, .37+.06*sin(t*1.8));
   float orbit=sdSphere(p-vec3(1.08*cos(t*1.1),.0,1.08*sin(t*1.1)),.105);
   return min(min(ring,core),orbit);
 }else if(u_kind<1.5){
   float wave=abs(p.y-(.30*sin(p.x*3.2-t*2.2)+.18*sin(p.x*5.1+t*1.4)))-.035;
   float slab=max(wave,abs(p.z)-.11);
   float wave2=abs(p.y-(.30*sin(p.x*3.2-t*2.2+u_progress*3.14159)+.18*sin(p.x*5.1+t*1.4))+.43)-.035;
   float slab2=max(wave2,abs(p.z)-.11);
   float sum=min(slab,slab2);
   return min(sum,sdSphere(p-vec3(0,-.1,0),.13));
 }else if(u_kind<2.5){
   float road=sdCapsule(p,vec3(-.75,-.8,0),vec3(-.25,.0,0),.075);
   road=min(road,sdCapsule(p,vec3(-.25,0,0),vec3(.5,.65,0),.075));
   road=min(road,sdCapsule(p,vec3(.5,.65,0),vec3(.85,.95,0),.075));
   float bead=sdSphere(p-vec3(.5+.30*sin(t*.9),.65+.30*sin(t*.9),0),.14);
   return min(road,bead);
 }else if(u_kind<3.5){
   float orb=sdSphere(p, .68+.08*sin(t*1.5));
   float halo=sdTorus(p,vec2(1.02,.035));
   return min(orb,halo);
 }else if(u_kind<4.5){
   float left=sdCapsule(p,vec3(0,-.8,0),vec3(-.72,.62,0),.055);
   float right=sdCapsule(p,vec3(0,-.8,0),vec3(.72,.62,0),.055);
   return min(left,right);
 }else if(u_kind<5.5){
   float a=sdTorus(p,vec2(.75,.06));
   float b=sdTorus(p,vec2(.48,.045));
   p.xy=rot(1.05)*p.xy;
   return min(min(a,b),sdSphere(p,.22));
 }else{
   // Two coherent point sources create a genuine 3D interference surface.
   float r1=length(p.xz-vec2(-.68,0.0));
   float r2=length(p.xz-vec2(.68,0.0));
   float waveA=sin(7.6*r1-t*1.8);
   float waveB=sin(7.6*r2-t*1.8+u_phase);
   float height=.19*(waveA+waveB);
   float surface=abs(p.y-height)-.035;
   float edge=length(p.xz)-1.55;
   float sheet=max(surface,edge);
   float sourceA=sdSphere(p-vec3(-.68,0.0,0.0),.09);
   float sourceB=sdSphere(p-vec3(.68,0.0,0.0),.09);
   return min(sheet,min(sourceA,sourceB));
 }
}
vec3 getNormal(vec3 p){vec2 e=vec2(.001,0);return normalize(vec3(sceneSDF(p+e.xyy)-sceneSDF(p-e.xyy),sceneSDF(p+e.yxy)-sceneSDF(p-e.yxy),sceneSDF(p+e.yyx)-sceneSDF(p-e.yyx)));}
float march(vec3 ro,vec3 rd,out vec3 hit){
 // Conservative scene-bound intersection skips background pixels before
 // expensive SDF ray marching, especially important on CPU SwiftShader.
 float b=dot(ro,rd);
 float c=dot(ro,ro)-1.8*1.8;
 float h=b*b-c;
 if(h<0.0)return MAX_DIST;
 float root=sqrt(h);
 float nearT=max(0.0,-b-root);
 float farT=-b+root;
 if(farT<=nearT)return MAX_DIST;
 float d=nearT;
 for(int i=0;i<MAX_STEPS;i++){
   if(d>farT)break;
   vec3 p=ro+rd*d;
   float dist=sceneSDF(p);
   if(dist<SURF_DIST){hit=p;return d;}
   d+=max(dist*.9,.002);
 }
 return MAX_DIST;
}
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*u_resolution)/u_resolution.y;
 float t=u_time;
 vec3 ro=vec3(3.1*sin(t*.18),1.25+.16*sin(t*.27),4.2*cos(t*.18));
 vec3 target=vec3(0,0,0);
 vec3 ww=normalize(target-ro),uu=normalize(cross(ww,vec3(0,1,0))),vv=cross(uu,ww);
 vec3 rd=normalize(uv.x*uu+uv.y*vv+1.75*ww);
 vec3 hit;float d=march(ro,rd,hit);
 vec3 col=u_bg;
 float stars=0.0;
 vec2 gv=fract(uv*vec2(95.,150.))-0.5;
 vec2 id=floor(uv*vec2(95.,150.));
 float rnd=fract(sin(dot(id,vec2(127.1,311.7)))*43758.5453);
 stars=step(.994,rnd)*pow(max(0.,1.-length(gv)*2.),4.)*(.45+.55*sin(t*1.7+rnd*20.));
 col+=vec3(.35,.55,.9)*stars;
 float haze=exp(-length(uv-vec2(.0,.08)) * 3.0);
 col+=u_primary*haze*.075;
 if(d<MAX_DIST){
   vec3 n=getNormal(hit);
   vec3 lightDir=normalize(vec3(-.6,1.1,1.4));
   float diff=max(dot(n,lightDir),0.0);
   float fres=pow(1.0-max(dot(n,-rd),0.0),3.0);
   float spec=pow(max(dot(reflect(-lightDir,n),-rd),0.0),48.0);
   float bands=.5+.5*sin(hit.y*19.0+hit.x*8.0-t*2.0);
   vec3 base=mix(u_primary,u_secondary,bands*.45+.25);
   col=base*(.16+.92*diff)+u_accent*(.18*fres+spec*.8);
   col+=u_primary*(.12/(.08+abs(sceneSDF(hit+ n*.035))));
   float fog=1.0-exp(-d*.055);col=mix(col,u_bg,fog*.38);
 }
 float vignette=1.0-smoothstep(.35,1.25,length(uv));
 col*=vignette;
 col=col/(1.0+col);
 col=pow(col,vec3(.88));
 gl_FragColor=vec4(col,1.0);
}
`;

const waveVertex=`
precision highp float;
attribute vec2 a_grid;
uniform vec2 u_resolution;
uniform float u_time,u_phase;
varying vec3 v_normal;
varying vec3 v_world;
varying vec2 v_uv;
varying float v_height;
float waveHeight(vec2 xz){
 float r1=length(xz-vec2(-.68,0.0));
 float r2=length(xz-vec2(.68,0.0));
 float a=sin(7.6*r1-u_time*1.8);
 float b=sin(7.6*r2-u_time*1.8+u_phase);
 return .19*(a+b);
}
void main(){
 vec2 xz=a_grid*1.55;
 float y=waveHeight(xz);
 float e=.009;
 float hx1=waveHeight(xz+vec2(e,0.0));
 float hx2=waveHeight(xz-vec2(e,0.0));
 float hz1=waveHeight(xz+vec2(0.0,e));
 float hz2=waveHeight(xz-vec2(0.0,e));
 vec3 tangentX=vec3(2.0*e,hx1-hx2,0.0);
 vec3 tangentZ=vec3(0.0,hz1-hz2,2.0*e);
 v_normal=normalize(cross(tangentZ,tangentX));
 v_world=vec3(xz.x,y,xz.y);
 v_uv=a_grid*.5+.5;
 v_height=y;
 vec3 ro=vec3(3.1*sin(u_time*.18),1.45+.16*sin(u_time*.27),4.2*cos(u_time*.18));
 vec3 ww=normalize(-ro);
 vec3 uu=normalize(cross(ww,vec3(0.0,1.0,0.0)));
 vec3 vv=cross(uu,ww);
 vec3 rel=v_world-ro;
 float vx=dot(rel,uu),vy=dot(rel,vv),vz=dot(rel,ww);
 float aspect=u_resolution.x/u_resolution.y;
 float focal=1.65,nearPlane=.1,farPlane=30.0;
 gl_Position=vec4(vx*focal/aspect,vy*focal,(farPlane/(farPlane-nearPlane))*vz-(farPlane*nearPlane/(farPlane-nearPlane)),vz);
}
`;
const waveFragment=`
precision highp float;
uniform float u_time;
uniform vec3 u_primary,u_secondary,u_accent;
varying vec3 v_normal;
varying vec3 v_world;
varying vec2 v_uv;
varying float v_height;
void main(){
 vec3 n=normalize(v_normal);
 vec3 lightDir=normalize(vec3(-.45,1.2,.8));
 vec3 viewDir=normalize(vec3(0.0,1.4,4.5)-v_world);
 float diff=max(dot(n,lightDir),0.0);
 float fres=pow(1.0-max(dot(n,viewDir),0.0),3.0);
 float spec=pow(max(dot(reflect(-lightDir,n),viewDir),0.0),32.0);
 float bands=.5+.5*sin(v_height*22.0+v_world.x*5.0-u_time*1.4);
 vec3 base=mix(u_primary,u_secondary,smoothstep(.05,.95,bands));
 float contour=1.0-smoothstep(.0,.055,abs(fract((v_height+.5)*14.0)-.5));
 float rA=length(v_world.xz-vec2(-.68,0.0));
 float rB=length(v_world.xz-vec2(.68,0.0));
 float sourceA=exp(-rA*30.0),sourceB=exp(-rB*30.0);
 float ringA=exp(-abs(rA-.18)*45.0),ringB=exp(-abs(rB-.18)*45.0);
 vec3 col=base*(.22+.9*diff)+u_accent*(.18*fres+.65*spec);
 col+=u_accent*(contour*.16+(sourceA+sourceB)*.75+(ringA+ringB)*.12);
 float edgeFade=smoothstep(0.0,.06,min(min(v_uv.x,1.0-v_uv.x),min(v_uv.y,1.0-v_uv.y)));
 col*=.45+.55*edgeFade;
 col=col/(1.0+col);
 col=pow(col,vec3(.9));
 gl_FragColor=vec4(col,1.0);
}
`;
const bgFragment=`
precision mediump float;
uniform vec2 u_resolution;
uniform float u_time;
uniform vec3 u_bg,u_primary;
void main(){
 vec2 uv=(gl_FragCoord.xy-.5*u_resolution)/u_resolution.y;
 vec2 gv=fract(uv*vec2(95.0,150.0))-.5;
 vec2 id=floor(uv*vec2(95.0,150.0));
 float rnd=fract(sin(dot(id,vec2(127.1,311.7)))*43758.5453);
 float stars=step(.994,rnd)*pow(max(0.0,1.0-length(gv)*2.0),4.0)*(.45+.55*sin(u_time*1.7+rnd*20.0));
 float haze=exp(-length(uv-vec2(0.0,.08))*3.0);
 vec3 col=u_bg+vec3(.35,.55,.9)*stars+u_primary*haze*.075;
 float vignette=1.0-smoothstep(.35,1.25,length(uv));
 col*=vignette;
 gl_FragColor=vec4(col,1.0);
}
`;

function hex3(h){const x=(h||"#ffffff").replace("#","");return [parseInt(x.slice(0,2),16)/255,parseInt(x.slice(2,4),16)/255,parseInt(x.slice(4,6),16)/255];}
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}

function makeProgram(vs,fs){
 const p=gl.createProgram();
 gl.attachShader(p,shader(gl.VERTEX_SHADER,vs));
 gl.attachShader(p,shader(gl.FRAGMENT_SHADER,fs));
 gl.linkProgram(p);
 if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));
 return p;
}
function bindFullscreen(p){
 gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
 const loc=gl.getAttribLocation(p,"a_position");
 gl.enableVertexAttribArray(loc);
 gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
}
function createWaveGrid(){
 const segments=160,stride=segments+1;
 const vertices=new Float32Array(stride*stride*2);
 let k=0;
 for(let z=0;z<=segments;z++){
  for(let x=0;x<=segments;x++){
   vertices[k++]=(x/segments)*2-1;
   vertices[k++]=(z/segments)*2-1;
  }
 }
 const indices=new Uint16Array(segments*segments*6);
 k=0;
 for(let z=0;z<segments;z++){
  for(let x=0;x<segments;x++){
   const a=z*stride+x,b=a+1,c=a+stride,d=c+1;
   indices[k++]=a;indices[k++]=c;indices[k++]=b;
   indices[k++]=b;indices[k++]=c;indices[k++]=d;
  }
 }
 waveGridBuffer=gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER,waveGridBuffer);
 gl.bufferData(gl.ARRAY_BUFFER,vertices,gl.STATIC_DRAW);
 waveIndexBuffer=gl.createBuffer();
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,waveIndexBuffer);
 gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,indices,gl.STATIC_DRAW);
 waveIndexCount=indices.length;
}
function initGL(){
 if(!gl)throw new Error("WebGL در مرورگر فعال نیست؛ این موتور به WebGL نیاز دارد.");
 program=makeProgram(vertex,fragment);
 waveProgram=makeProgram(waveVertex,waveFragment);
 bgProgram=makeProgram(vertex,bgFragment);
 buffer=gl.createBuffer();
 gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
 gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 uniforms={};
 ["u_resolution","u_time","u_progress","u_kind","u_phase","u_primary","u_secondary","u_accent","u_bg"].forEach(k=>uniforms[k]=gl.getUniformLocation(program,k));
 waveUniforms={};
 ["u_resolution","u_time","u_phase","u_primary","u_secondary","u_accent"].forEach(k=>waveUniforms[k]=gl.getUniformLocation(waveProgram,k));
 bgUniforms={};
 ["u_resolution","u_time","u_bg","u_primary"].forEach(k=>bgUniforms[k]=gl.getUniformLocation(bgProgram,k));
 createWaveGrid();
 gl.disable(gl.BLEND);
 gl.disable(gl.DEPTH_TEST);
}
function resize(){
 const dpr=Math.min(window.devicePixelRatio||1,1);
 W=Math.max(1,window.innerWidth||720);
 H=Math.max(1,window.innerHeight||1280);
 canvas.width=Math.round(W*dpr);
 canvas.height=Math.round(H*dpr);
 gl.viewport(0,0,canvas.width,canvas.height);
}

function choosePalette(s){if(s.palette&&s.palette.bg)return s.palette;const t=((s.narration||"")+" "+(s.visual_prompt||"")+" "+(s.text||"")).toLowerCase();if(/آرام|صلح|calm/.test(t))return{bg:"#0c0a09",primary:"#f5d0a9",secondary:"#a78bfa",accent:"#67e8f9"};if(/حماسی|قهرمان|epic/.test(t))return{bg:"#0a0a12",primary:"#fbbf24",secondary:"#f472b6",accent:"#38bdf8"};if(/راز|مرموز|mystery/.test(t))return{bg:"#0b0c15",primary:"#818cf8",secondary:"#c084fc",accent:"#22d3ee"};if(/موج|تداخل|wave/.test(t))return{bg:"#050817",primary:"#22d3ee",secondary:"#a78bfa",accent:"#f472b6"};return{bg:"#07101d",primary:"#22d3ee",secondary:"#a78bfa",accent:"#fbbf24"};}
function kindOf(s){if(s.motif){return({ellipse:0,wave:1,path:2,light:3,choice:4,cosmic:5,growth:3,abstract:5,interference:6})[s.motif]??5;}const t=((s.narration||"")+" "+(s.visual_prompt||"")+" "+(s.text||"")).toLowerCase();if(/بیضی|کانون|ellipse/.test(t))return 0;if(/موج|تداخل|wave|phase/.test(t))return 1;if(/مسیر|قدم|راه|path|journey/.test(t))return 2;if(/نور|طلوع|light|hope/.test(t))return 3;if(/انتخاب|دو راه|choice/.test(t))return 4;return 5;}

function drawBackground(p,t){
 gl.disable(gl.DEPTH_TEST);
 gl.useProgram(bgProgram);
 bindFullscreen(bgProgram);
 gl.uniform2f(bgUniforms.u_resolution,canvas.width,canvas.height);
 gl.uniform1f(bgUniforms.u_time,t);
 gl.uniform3fv(bgUniforms.u_bg,hex3(p.bg));
 gl.uniform3fv(bgUniforms.u_primary,hex3(p.primary));
 gl.drawArrays(gl.TRIANGLES,0,3);
}
function drawWave(p,phase){
 gl.clear(gl.DEPTH_BUFFER_BIT);
 gl.enable(gl.DEPTH_TEST);
 gl.depthFunc(gl.LEQUAL);
 gl.useProgram(waveProgram);
 gl.uniform2f(waveUniforms.u_resolution,canvas.width,canvas.height);
 gl.uniform1f(waveUniforms.u_time,globalTime);
 gl.uniform1f(waveUniforms.u_phase,phase);
 gl.uniform3fv(waveUniforms.u_primary,hex3(p.primary));
 gl.uniform3fv(waveUniforms.u_secondary,hex3(p.secondary));
 gl.uniform3fv(waveUniforms.u_accent,hex3(p.accent));
 gl.bindBuffer(gl.ARRAY_BUFFER,waveGridBuffer);
 const loc=gl.getAttribLocation(waveProgram,"a_grid");
 gl.enableVertexAttribArray(loc);
 gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,waveIndexBuffer);
 gl.drawElements(gl.TRIANGLES,waveIndexCount,gl.UNSIGNED_SHORT,0);
 gl.disable(gl.DEPTH_TEST);
}
function draw(){
 if(!project||!project.scenes.length)return;
 const s=project.scenes[sceneIndex];if(!s)return;
 currentPalette=choosePalette(s);const p=currentPalette;
 const kind=kindOf(s);
 const progress=Math.min(1,sceneTime/Math.max(.01,s.duration));
 const phase=Number(s.phase||0)+progress*Number(s.phase_sweep||0);
 if(kind===6){
  drawBackground(p,globalTime);
  drawWave(p,phase);
 }else{
  gl.disable(gl.DEPTH_TEST);
  gl.useProgram(program);
  bindFullscreen(program);
  gl.uniform2f(uniforms.u_resolution,canvas.width,canvas.height);
  gl.uniform1f(uniforms.u_time,globalTime);
  gl.uniform1f(uniforms.u_progress,progress);
  gl.uniform1f(uniforms.u_kind,kind);
  gl.uniform1f(uniforms.u_phase,phase);
  gl.uniform3fv(uniforms.u_primary,hex3(p.primary));
  gl.uniform3fv(uniforms.u_secondary,hex3(p.secondary));
  gl.uniform3fv(uniforms.u_accent,hex3(p.accent));
  gl.uniform3fv(uniforms.u_bg,hex3(p.bg));
  gl.drawArrays(gl.TRIANGLES,0,3);
 }
 caption.textContent=s.text||"";
 let opacity=1,scale=1;
 if(progress<.1){opacity=progress/.1;scale=.92+progress*.8;}
 else if(progress>.88){opacity=(1-progress)/.12;scale=1-(progress-.88)*.3;}
 caption.style.opacity=String(Math.max(0,Math.min(1,opacity)));
 caption.style.transform="scale("+scale.toFixed(3)+")";
}

function totalDuration(){return project?project.scenes.reduce((a,s)=>a+Number(s.duration||4),0):0;}
window.BAMO={
 loadProject(p){if(!p||!Array.isArray(p.scenes)||!p.scenes.length)throw new Error("Project must contain scenes");project=p;sceneIndex=0;sceneTime=0;globalTime=0;draw();return true;},
 play(){playing=true;lastNow=performance.now();},pause(){playing=false;},
 seek(seconds){if(!project)return;let left=Math.max(0,seconds),acc=0;sceneIndex=project.scenes.length-1;sceneTime=Number(project.scenes[sceneIndex].duration||4);for(let i=0;i<project.scenes.length;i++){const d=Number(project.scenes[i].duration||4);if(left<acc+d||i===project.scenes.length-1){sceneIndex=i;sceneTime=Math.max(0,Math.min(d,left-acc));break;}acc+=d;}globalTime=seconds;draw();},
 getState(){return{sceneIndex,sceneTime,globalTime,totalDuration:totalDuration(),playing,renderer:"WebGL"};},
 ready:false
};
function loop(now){if(!lastNow)lastNow=now;const dt=Math.min(.05,(now-lastNow)/1000);lastNow=now;if(playing&&project){sceneTime+=dt;globalTime+=dt;const s=project.scenes[sceneIndex],d=Number(s.duration||4);if(sceneTime>=d){sceneTime-=d;sceneIndex++;if(sceneIndex>=project.scenes.length){sceneIndex=project.scenes.length-1;sceneTime=Number(project.scenes[sceneIndex].duration||4);playing=false;}}draw();}requestAnimationFrame(loop);}
try{initGL();resize();window.addEventListener("resize",resize);const q=new URLSearchParams(location.search);if(q.get("project")){const binary=atob(q.get("project"));const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));const decoded=new TextDecoder("utf-8",{fatal:true}).decode(bytes);window.BAMO.loadProject(JSON.parse(decoded));}if(window.BAMO_PROJECT)window.BAMO.loadProject(window.BAMO_PROJECT);window.BAMO.ready=true;requestAnimationFrame(loop);setTimeout(()=>{if(project)window.BAMO.play();},300);}catch(e){errorBox.style.display="grid";errorBox.textContent="BAMO WebGL Engine Error: "+e.message;window.BAMO.ready=false;window.BAMO.error=String(e);}
})();
</script>
</body></html>
